# pnpm v11's verify-deps-before-run pre-script check, disabled repo-wide —
# see .npmrc's comment for the incident history (the .npmrc key alone does
# not take effect on v11; this camelCase workspace setting is the one the
# runtime honors). CI is unaffected: it always runs
# `pnpm install --frozen-lockfile` explicitly first.
verifyDepsBeforeRun: false

packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - eslint@10.8.0
  - turbo@2.10.7
  - pg-boss@12.26.3
overrides:
  postcss: ">=8.5.12"
  next>postcss: ">=8.5.12"
  next>sharp: ">=0.35.0"
