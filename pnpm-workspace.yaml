# pnpm v11's verify-deps-before-run pre-script check, disabled repo-wide —
# see .npmrc's comment for the incident history (the .npmrc key alone does
# not take effect on v11; this camelCase workspace setting is the one the
# runtime honors). CI is unaffected: it always runs
# `pnpm install --frozen-lockfile` explicitly first.
verifyDepsBeforeRun: false

packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
allowBuilds:
  core-js: true
  esbuild: true
  koffi: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - eslint@10.8.0
  - turbo@2.10.7
  - pg-boss@12.26.3
overrides:
  # >=8.5.23: GHSA-fxqj-rqcc-2cmp (moderate) fix floor
  postcss: ">=8.5.23"
  next>postcss: ">=8.5.23"
  next>sharp: ">=0.35.0"
  # ^3.3.17: GHSA-2v37-7h3g-55p8 (high) fix floor; stay on 3.x — postcss
  # requires nanoid via CJS and nanoid >=4 is ESM-only
  postcss>nanoid: "^3.3.17"
  # AUD-W6-004: pg-boss@12.26.3 pins cron-parser@5.6.2, whose published
  # tarball the registry itself flags `deprecated` — "built from a stale
  # dist/ ... missing the fixes from #414 and #415 ... effectively v5.6.1
  # ... upgrade to v5.7.0." pg-boss's own declared range (^5.6.2) already
  # permits 5.7.0; this override just forces the lockfile to actually
  # resolve to it. N2 policy check: 5.7.0 is a GA patch line, eligible.
  cron-parser: "5.7.0"
