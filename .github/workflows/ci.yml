name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger (see the matrix-economy note on the gate job). The os
  # input allows validating a single slow leg (windows, macos) without
  # running the whole matrix.
  workflow_dispatch:
    inputs:
      os:
        description: "Gate matrix legs to run"
        type: choice
        default: all
        options: [all, ubuntu, ubuntu-windows, ubuntu-macos]

env:
  # D18: dev-compose Postgres binds host port 5442 by default; CI mirrors
  # that so local + CI configs never drift.
  PGHOST: 127.0.0.1
  PGPORT: "5442"
  PGUSER: loombre
  PGPASSWORD: loombre
  PGDATABASE: loombre
  DATABASE_URL: postgres://loombre:loombre@127.0.0.1:5442/loombre
  # Pinned oasdiff release (CLAUDE.md gate step "oasdiff") — keep in sync
  # across all three per-OS install steps below.
  OASDIFF_VERSION: "1.26.0"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      # MATRIX ECONOMY (the repo is public as of 2026-07-26 — STATE.md:3944 —
      # so runner minutes are unmetered; this ubuntu-only default dates from
      # the private-repo billed-minutes era and is kept for wall-clock/queue
      # economy, not billing): ordinary pushes run ubuntu only; the
      # Windows/macOS legs run when the commit message carries [full-ci] or
      # the workflow is dispatched manually. macOS is additionally covered
      # by real-hardware runs on owner hardware; use [full-ci] at phase
      # boundaries and before releases, not per-commit.
      # NOTE: this MUST live in strategy.matrix (github context available),
      # not a job-level `if` (matrix context is NOT available there — a
      # matrix.os reference kills the whole workflow file at parse time,
      # zero jobs created; bitten once at 30095735973).
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && ((inputs.os == 'ubuntu' && fromJSON('["ubuntu-latest"]')) || (inputs.os == 'ubuntu-windows' && fromJSON('["ubuntu-latest", "windows-latest"]')) || (inputs.os == 'ubuntu-macos' && fromJSON('["ubuntu-latest", "macos-latest"]')) || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')) || (contains(github.event.head_commit.message, '[full-ci]') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]')) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # oasdiff (gate step) diffs the current contract against `main` —
          # needs full history, not just the tip commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # No explicit version: reads the "packageManager" field in
        # package.json so every OS installs the exact same pinned pnpm.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      # Lane WG1 (STATE.md "Loombre Remote", RG1/RG14): a Go BUILD toolchain
      # for packages/wg-native/native (compiled into a per-OS c-shared
      # library, loaded via koffi — never shipped as a Go RUNTIME, so the
      # N2 Active-LTS Node policy does not govern this pin). Pinned to
      # current stable (matches go.dev/dl's `stable: true` entry at the
      # time this was wired) — same "pin, don't float" posture as OASDIFF_VERSION.
      - name: Set up Go (packages/wg-native build toolchain)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Explicit, clearly-labeled step (rather than relying solely on
      # turbo's implicit ^build dependency during the gate's typecheck/test
      # steps) — a Go/wg-native build failure gets its own red X instead of
      # surfacing confusingly inside "typecheck" or "test". LOOMBRE_REQUIRE_WG
      # is NOT set here: a build failure with Go present is already a hard
      # `pnpm --filter` non-zero exit regardless: only "Go not found at all"
      # is soft, and setup-go above guarantees Go IS found on every leg.
      - name: Build wg-native (Go c-shared library)
        run: pnpm --filter @loombre/wg-native run build

      - name: Install oasdiff (ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          rm -f oasdiff.tar.gz
          oasdiff --version

      - name: Install oasdiff (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_darwin_all.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          rm -f oasdiff.tar.gz
          oasdiff --version

      - name: Install oasdiff (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_windows_amd64.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff.exe
          mkdir -p "${RUNNER_TEMP}/oasdiff-bin"
          mv oasdiff.exe "${RUNNER_TEMP}/oasdiff-bin/oasdiff.exe"
          rm -f oasdiff.tar.gz
          echo "${RUNNER_TEMP}/oasdiff-bin" >> "$GITHUB_PATH"

      - name: Set up Postgres 18 (D18 — port 5442)
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: loombre
          password: loombre
          database: loombre
          port: "5442"
          postgres-version: "18"

      - name: "Zero-to-current proof: fresh DB → all migrations → seed"
        shell: bash
        # Standing H4 gate (docs/PLAN.md §4.2 forward-only migration policy
        # — closes the audit finding "no down migrations exist anywhere
        # (contradicts PLAN.md 4.2)"): ikalnytskyi/action-setup-postgres
        # above stands up a brand-new Postgres every run, but nothing
        # asserted it was actually empty before today — the property was
        # incidental. The check below makes "fresh" a verified premise, not
        # an assumption, before replaying every migration onto it and
        # seeding. Conformance (apps/server/test/conformance.spec.ts,
        # test/seeded-conformance.spec.ts) and the restricted-content leak
        # suite (packages/db/test/leak.spec.ts) ride this same job's later
        # `pnpm gate` test step — each is self-sufficient and
        # resets/reseeds its own derived DB, so they don't disturb this
        # proof. `pnpm gate`'s db:migrate-check step separately replays the
        # full migration chain again into a scratch schema. Runs on every
        # matrix leg (ubuntu on every push; windows/macos when the matrix
        # expands via workflow_dispatch or a [full-ci] commit message) —
        # psql is on PATH on every one of them courtesy of the
        # action-setup-postgres step above (its README: "Adds PostgreSQL
        # client applications to PATH"), so this stays a single
        # cross-platform check rather than three OS-specific ones.
        run: |
          set -euo pipefail
          # tr -d '\r': on the windows leg psql writes stdout in text mode,
          # so "$( )" would capture "0\r" and break [ -ne ] (Lane R review).
          table_count="$(psql "$DATABASE_URL" -X -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | tr -d '\r')"
          if [ "$table_count" -ne 0 ]; then
            echo "zero-to-current proof: expected an EMPTY public schema before migrating, found $table_count existing table(s) — this Postgres instance is not fresh." >&2
            exit 1
          fi
          pnpm db:migrate
          pnpm db:seed

      # Phase 3 step 7 finding: ffmpeg was NEVER installed on runners, so
      # every ffmpeg-gated suite (probe/session/subtitle/battery
      # integration) silently describe.skipIf-skipped on all 3 OSes while
      # the Phase 3 exit gate requires "session integration green on 3 OS
      # runners". Installed via each OS's package manager (current stable;
      # full pinned/vendored bundling remains Phase 4 packaging per P3.5 —
      # any version skew surfaces as probe self-test differences by design).
      # LOOMBRE_REQUIRE_FFMPEG=1 (job step env below) makes an unresolvable
      # ffmpeg a HARD test failure instead of a skip, so a runner
      # misconfiguration can never masquerade as green again.
      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # choco can exit 0 with ffmpeg NOT installed (seen live, run
        # 31113051932 attempt 2: community-feed 503 → "Unable to find
        # package 'ffmpeg'" → "installed 0/0 packages" → exit 0). The job
        # then ran 10 more minutes before LOOMBRE_REQUIRE_FFMPEG correctly
        # hard-failed 7 worker suites with a signature that reads like a
        # code problem. Retry transient feed errors, then verify the
        # binary actually resolves and fail THIS step if it doesn't —
        # a broken runner provision should look like one.
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { $ok = $true; break }
            Write-Host "attempt ${i}: choco did not yield ffmpeg on PATH; retrying in $(15 * $i)s..."
            Start-Sleep -Seconds (15 * $i)
          }
          if (-not $ok) {
            Write-Error "ffmpeg not resolvable after 3 choco attempts — failing fast (the alternative is 7 misleading REQUIRE_FFMPEG test failures 10 minutes from now)."
            exit 1
          }
          ffmpeg -version | Select-Object -First 1

      - name: Generate media fixtures (lavfi — scripts/gen-media-fixtures.mjs)
        shell: bash
        run: node scripts/gen-media-fixtures.mjs

      - name: dep-audit — pnpm audit --prod, gated against audit-allowlist.json (STATE.md P4.15)
        if: runner.os == 'Linux'
        shell: bash
        # ubuntu-only: dependency advisories are resolved from the ONE
        # shared pnpm-lock.yaml, not platform-specific — running this on
        # all 3 OS legs would just triple the npm-registry audit calls for
        # an identical result (same reasoning as the pubkey-consistency
        # step below). `pnpm gate` (next step) ALSO runs this exact check
        # internally (scripts/gate.mjs's own dep-audit step, right after
        # license-check) — this standalone step exists so a vulnerable/
        # unallowlisted dependency fails FAST and with its own clearly-
        # labeled red X in the Actions UI, rather than waiting through the
        # entire gate run to discover it buried in that step's log.
        run: node scripts/dep-audit.mjs

      - name: installers test — node --test over installers/**/*.test.mjs (AUD-A5b-001 regression coverage)
        shell: bash
        # installers/ is not a pnpm workspace, so turbo-run `test` never
        # reaches it (same gap the "scripts + release tooling tests" step
        # below closes for scripts/) — that's what left the x64
        # Distribution.xml hostArchitectures fix (AUD-A5b-001) with zero
        # regression protection. `pnpm gate:full` (next step) ALSO runs
        # this exact check internally (scripts/gate.mjs's own
        # installers-test step, right after `test`) — this standalone step
        # exists so a regressed installer test fails FAST and with its own
        # clearly-labeled red X in the Actions UI, rather than waiting
        # through the entire gate run to discover it buried in that step's
        # log. Not OS-restricted (unlike dep-audit above): coverage
        # genuinely differs by OS — only the macOS legs exercise the real
        # pkgbuild/productbuild/pkgutil round-trip.
        run: pnpm installers:test

      - name: dotnet test — Loombre.Tray.Tests + LoombreServiceHost.Tests (AUD-W1-001)
        if: runner.os == 'Linux'
        shell: bash
        # AUD-W1-001: neither pnpm gate nor gate:full ever built or ran a
        # line of the C# tray/service-host code — the only signal was
        # windows-installer-diag.yml's path-filtered build-msi.mjs run
        # (real MSI harvest, windows-latest-only) and release.yml's tagged
        # build. A regression in Discovery.ReadAsync's exception contract
        # (WAVE-1-crash-boundaries.md's Waivers section) could land with a
        # fully green gate:full and zero signal. Both test projects are
        # deliberately plain net8.0 (not -windows — see each .csproj's own
        # header) specifically so they build and run on any OS without a
        # win-x64 runtime pack; ubuntu-latest ships a .NET SDK already, so
        # this needs no setup-dotnet action, no Windows runner, no WiX/MSI
        # build. Linux-only (same reasoning as dep-audit above): the logic
        # under test is OS-agnostic (argument parsing / IPC discovery), so
        # tripling this across the 3-OS matrix would just triple runner
        # minutes for an identical result. This is intentionally NOT wired
        # into scripts/gate.mjs's installers-test step (see that step's own
        # comment) — there is no dotnet toolchain on dev machines, so
        # putting `dotnet test` in the LOCAL pnpm gate/gate:full loop would
        # fail the inner loop for everyone without the .NET SDK installed.
        # This CI-only step gives the fast, always-on signal without that
        # cost.
        run: |
          set -euo pipefail
          dotnet test installers/windows/tray/Loombre.Tray.Tests/Loombre.Tray.Tests.csproj -c Release
          dotnet test installers/windows/service-host/LoombreServiceHost.Tests/LoombreServiceHost.Tests.csproj -c Release

      - name: pnpm gate:full
        # L4: CI runs the FULL gate (17 steps + web-build-budget), not the
        # fast inner-loop default — bundle size is deterministic, not
        # hardware-sensitive like the perf-NUMBER jobs below, so there's no
        # reason to run it on fewer legs, and runner minutes are unmetered
        # (public repo). This duplicates the standalone perf-web-budget
        # job's check on the ubuntu leg specifically (~1 extra minute here,
        # same assertion) — that job stays because it's the artifact
        # publisher (perf/web-budget-result.json) and a to-be-required
        # branch-protection context (see the owner checklist in the L4
        # freeze report); the owner may choose to retire the standalone job
        # once gate:full's own coverage is trusted, but it isn't retired by
        # this change.
        env:
          LOOMBRE_REQUIRE_FFMPEG: "1"
          # RG1/RG14: a missing/unbuildable wg-native library must be a hard
          # CI failure, never a silent skip of the wg-gated loopback/
          # silence/containment/lifecycle suites (packages/wg-native/test,
          # apps/server/test/remote-wireguard-loopback.e2e.spec.ts) — same
          # posture LOOMBRE_REQUIRE_FFMPEG already established.
          LOOMBRE_REQUIRE_WG: "1"
          # 3-core virtualized runners miss the integration suites'
          # real-hardware-calibrated deadlines; scale patience, not
          # assertions (session.integration.spec.ts). macos-latest is the
          # slowest observed by far (first paced segment >60s vs ~2s on
          # real hardware) — it gets 10x.
          LOOMBRE_TEST_TIME_SCALE: ${{ runner.os == 'macOS' && '10' || '3' }}
        run: pnpm gate:full

      # scripts/ is not a pnpm workspace, so turbo-run tests never reach
      # these suites (fetch-ffmpeg, fetch-embedded-pg, dep-audit, release
      # tooling) — run them explicitly.
      - name: scripts + release tooling tests
        run: pnpm scripts:test

      - name: pubkey consistency + placeholder gate (P4.9 + H5)
        if: runner.os == 'Linux'
        shell: bash
        # The minisign public key must be byte-identical across five
        # checked locations (repo keys/minisign.pub, docs/ops/updating.md,
        # scripts/release/release-notes-template.md, the GENERATED
        # packages/shared/src/update-public-key.ts, and docs/install/
        # linux.md) so a key-substitution attack requires compromising all
        # of them — see scripts/release/lib/pubkey-consistency.mjs's header
        # for exactly which three are the P4.9 trust roots vs. the other
        # two. The same run also fails outright if ANY of those locations —
        # or any other docs/**/*.md page carrying the marker block — still
        # holds the all-zero placeholder key (H5: mutual agreement alone
        # isn't enough, since an all-placeholder tree agrees with itself
        # perfectly). release.yml's `prepare` and `release` jobs run this
        # too; running it here means a PR touching any checked location
        # fails fast, not at tag time. ubuntu-only: the check is
        # platform-independent text comparison.
        run: node scripts/release/check-pubkey-consistency.mjs

      - name: scan smoke — 500-file generated library (Phase 1 wave 4)
        shell: bash
        # Cross-OS scan correctness: unicode names, mixed-case extensions,
        # editions/multi-part, ~230-char deep paths, junk classification,
        # idempotent rescan. Correctness (not perf) — hard-fails on any
        # mismatch. See scripts/scan-smoke.mjs.
        run: node scripts/scan-smoke.mjs

      - name: playback matrix burn-up (docs/PLAYBACK.md §11 step 1, STATE.md P3.9d)
        shell: bash
        # matrix/burnup.json is now the single source of truth for each
        # case's expected status (green|red) — matrix.spec.ts asserts every
        # case's ACTUAL status (does plan() throw NotImplementedError, or
        # does it match the case's full expect block?) against the
        # manifest, and hard-fails on any decision/reasons mismatch or
        # non-NotImplementedError throw regardless of the manifest. A plain
        # `pnpm test:matrix` is therefore meaningfully green today (0 green
        # / 10 red / 10 total) AND stays meaningful as stages land — no
        # more inverted expected-failure step to swap out later.
        run: pnpm test:matrix

  # ─────────────────────────────────────────────────────────────────────────
  # gate-node-next (N1/N2 runtime policy, supported-latest sweep 2026-07-25):
  # the full gate on the CURRENT (non-LTS) Node line, NON-BLOCKING by
  # design — its job is to accumulate months of green (or red-with-
  # evidence) history so the October-2026 Node 26 LTS switch is a routine
  # Renovate PR, not a project. continue-on-error keeps a red run from
  # failing the workflow; push-to-main only (not PRs) per the
  # matrix-economy note above — ubuntu only, ~one extra gate run per
  # batched push. When Node 26 goes LTS and the pins move to it, point this job at
  # the next Current line (27) per the standing N2 policy. L4: runs
  # `pnpm gate:full` (not just `pnpm gate`) so this evidence lane also
  # catches Node-26 web-production-build breakage early — non-blocking, so
  # widening it to gate:full costs nothing at the merge bar.
  # ─────────────────────────────────────────────────────────────────────────
  gate-node-next:
    name: gate (ubuntu, node-current 26, non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js (Current line)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - name: Set up Go (packages/wg-native build toolchain)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Install dependencies
        # --engine-strict=false: root engines pins the SHIPPING floor
        # (>=24); this evidence lane deliberately runs ahead of it.
        run: pnpm install --frozen-lockfile --config.engine-strict=false

      - name: Build wg-native (Go c-shared library)
        run: pnpm --filter @loombre/wg-native run build

      - name: Install oasdiff
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          rm -f oasdiff.tar.gz

      - name: Set up Postgres 18 (D18 — port 5442)
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: loombre
          password: loombre
          database: loombre
          port: "5442"
          postgres-version: "18"

      - name: Migrate + seed database
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:seed

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate media fixtures
        shell: bash
        run: node scripts/gen-media-fixtures.mjs

      - name: pnpm gate:full
        env:
          LOOMBRE_REQUIRE_FFMPEG: "1"
          LOOMBRE_REQUIRE_WG: "1"
          LOOMBRE_TEST_TIME_SCALE: "3"
        run: pnpm gate:full

  # ─────────────────────────────────────────────────────────────────────────
  # Perf jobs (STATE.md P2.6, docs/PLAN.md §9, D15): ENFORCING from Phase 2.
  # These are separate required jobs but are just as blocking — a red perf
  # job fails the PR the same as a red gate job. ubuntu-only: perf NUMBERS
  # are hardware/OS-sensitive enough that a 3-OS matrix here would mostly
  # measure runner noise, not real regressions, at 3x the cost — that
  # reasoning does NOT extend to perf-web-budget below: bundle SIZE is
  # deterministic (not hardware-sensitive), so it's ALSO checked in
  # `pnpm gate:full` (L4) and runs on every gate matrix leg above, not just
  # ubuntu. perf-web-budget stays as its own job regardless — it's the
  # artifact publisher (perf/web-budget-result.json) and a required
  # branch-protection context, both independent of gate:full's coverage.
  # perf-t0 and perf-lighthouse remain genuinely perf-NUMBER jobs (RSS,
  # p95 latency, Lighthouse score) and stay ubuntu-only for the reason
  # above.
  # ─────────────────────────────────────────────────────────────────────────

  perf-t0:
    name: perf-t0 (ubuntu, enforcing)
    runs-on: ubuntu-latest
    # D15: Tier-0 perf budgets flip from warn-only (Phase 0/1) to ENFORCING
    # in Phase 2 — no continue-on-error, this job blocks merges.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/perf-baseline-check.mjs diffs perf/baselines.json
          # against `main` — needs full history, not just the tip commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Postgres 18 (D18 — port 5442)
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: loombre
          password: loombre
          database: loombre
          port: "5442"
          postgres-version: "18"

      - name: Migrate + seed database (base + 50k-item large library)
        shell: bash
        # db:seed-large is additive on top of db:seed (needs the admin/
        # casual users it creates) — see packages/db/seed/seed-large.mjs's
        # own header. ~7s for 50k movies.
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed-large

      - name: Build server
        # The "..." selector builds @loombre/server AND its workspace
        # dependencies (in dependency order) — @loombre/shared/sdk/jobs are
        # dist-based (their package.json exports point at ./dist), so
        # server's emit build needs their .d.ts built first. Building server
        # alone fails to resolve @loombre/shared on a fresh checkout.
        run: pnpm --filter "@loombre/server..." run build

      - name: Run T0 perf harness (ENFORCING — nonzero exit on any budget breach)
        run: pnpm perf:t0

      - name: Check perf/baselines.json changes carry a reason
        run: pnpm perf:baseline-check

      - name: Upload perf baseline artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t0-baseline-${{ github.run_id }}
          path: perf/t0-baseline.json
          if-no-files-found: warn

  perf-web-budget:
    name: perf-web-budget (ubuntu, enforcing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web bundle budget — /browse first-load JS <= 200 KB gz (ENFORCING)
        # Builds apps/web itself (see scripts/perf-web-budget.mjs).
        run: pnpm perf:web-budget

      - name: Upload bundle budget result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-budget-result-${{ github.run_id }}
          path: perf/web-budget-result.json
          if-no-files-found: warn

  perf-lighthouse:
    name: perf-lighthouse (ubuntu, enforcing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Postgres 18 (D18 — port 5442)
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: loombre
          password: loombre
          database: loombre
          port: "5442"
          postgres-version: "18"

      - name: Migrate + seed database
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:seed

      - name: Build + start API server (parity with a real deployment — see apps/web/lighthouserc.cjs for why /login itself doesn't call it yet)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter "@loombre/server..." run build
          NODE_OPTIONS="--import tsx" PORT=3001 DATABASE_URL="$DATABASE_URL" \
            node apps/server/dist/main.js > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/healthz || (cat server.log && exit 1)

      - name: Build apps/web
        run: pnpm --filter @loombre/web run build

      - name: Lighthouse — /login performance >= 0.90, throttled mobile (ENFORCING)
        run: pnpm perf:lighthouse

      - name: Stop API server
        if: always()
        shell: bash
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Upload Lighthouse reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: apps/web/.lighthouseci/
          if-no-files-found: warn
