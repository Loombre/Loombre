# SPDX-License-Identifier: AGPL-3.0-only
#
# DIAGNOSTIC, manual-dispatch only — not part of the gate, never runs on
# push or PR. History of STATE.md P4.21 (the Windows fork crash):
#
# ROOT CAUSE (found in round 5's raw step logs): libuv's Windows fs-event
# backend ABORTS the process on a C-level assert when a watched directory
# path contains a DOS 8.3 short name — exactly what os.tmpdir() returns on
# GitHub runners (C:\Users\RUNNER~1\...):
#
#     Assertion failed: !_wcsnicmp(filename, dir, dirlen),
#       file src\win\fs-event.c, line 72
#
# Both src/tls/manual-provider.spec.ts and src/tls/runtime.spec.ts exercise
# watchManualCertificate's real fs.watch over tmpdir paths, so their vitest
# forks died with no JS error ("Worker exited unexpectedly"). The fix is in
# PRODUCTION code (manual-provider.ts canonicalWatchDir: realpathSync.native
# before fs.watch) because an operator-supplied short-name cert path would
# abort a real Windows server the same way.
#
# METHOD NOTE, learned the hard way: steps with continue-on-error report
# conclusion=success in the API even when they fail. Rounds 1–4's
# "all green" readings were exactly that artifact. Every result step below
# therefore prints an explicit `VERDICT:` line — read THOSE from the log,
# never the step conclusions.
name: windows-tls-diag

on:
  workflow_dispatch:

jobs:
  diag:
    name: windows fs.watch short-name crash — fix verification (round 6)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Confirm tmpdir uses a short name (the trigger precondition)
        shell: bash
        run: |
          node -e "const os=require('os'); console.log('tmpdir:', os.tmpdir())"
          echo "If the path above contains a '~', the crash precondition is present."

      - name: "R1-R3: the two formerly-crashing specs, three times, default pool"
        continue-on-error: true
        working-directory: apps/server
        shell: bash
        run: |
          for i in 1 2 3; do
            if pnpm exec vitest run src/tls/manual-provider.spec.ts src/tls/runtime.spec.ts --reporter=verbose; then
              echo "VERDICT:R$i:PASS"
            else
              echo "VERDICT:R$i:FAIL"
            fi
          done

      - name: Summary
        if: always()
        shell: bash
        run: echo "Read the VERDICT: lines above — three PASSes mean the canonicalWatchDir fix holds at the crash site; the real ci.yml windows leg is the final authority."
