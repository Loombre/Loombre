# SPDX-License-Identifier: AGPL-3.0-only
#
# DIAGNOSTIC, manual-dispatch only — not part of the gate, never runs on
# push or PR.
#
# Question it answers (STATE.md P4.21): on windows-latest, two apps/server
# specs — src/tls/manual-provider.spec.ts and src/tls/runtime.spec.ts —
# never report at all; their vitest fork dies with "Worker exited
# unexpectedly" while every other file passes. Both create a REAL
# https.Server and perform a REAL TLS handshake. Two candidate causes,
# which this run separates:
#
#   A. A native crash (Node/OpenSSL TLS on Windows) inside the test
#      process. Then the failure follows the CODE, and it will reproduce
#      under every pool mode — including threads.
#   B. A vitest fork-pool teardown / handle-leak interaction. Then the
#      failure follows the POOL, and --pool=threads (or --no-isolate)
#      will pass while the default forks pool crashes.
#
# Each step is continue-on-error so ALL configurations report in one run
# rather than the first red one masking the rest. Read the summary at the
# end of the job log.
name: windows-tls-diag

on:
  workflow_dispatch:

jobs:
  diag:
    name: windows TLS fork-crash diagnosis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/server imports built workspace packages (@loombre/secrets et al),
      # so the dependency graph must be built before vitest can resolve them.
      - name: Build workspace dependencies
        run: pnpm build

      - name: "A: default pool (forks + isolate) — the CONTROL, expected to crash"
        continue-on-error: true
        working-directory: apps/server
        run: pnpm exec vitest run src/tls/manual-provider.spec.ts src/tls/runtime.spec.ts --reporter=verbose

      - name: "B: --pool=threads"
        continue-on-error: true
        working-directory: apps/server
        run: pnpm exec vitest run src/tls/manual-provider.spec.ts src/tls/runtime.spec.ts --pool=threads --reporter=verbose

      - name: "C: forks, --no-isolate"
        continue-on-error: true
        working-directory: apps/server
        run: pnpm exec vitest run src/tls/manual-provider.spec.ts src/tls/runtime.spec.ts --no-isolate --reporter=verbose

      # Which of the two files is responsible — one, or both independently?
      - name: "D: runtime.spec.ts alone (default pool)"
        continue-on-error: true
        working-directory: apps/server
        run: pnpm exec vitest run src/tls/runtime.spec.ts --reporter=verbose

      - name: "E: manual-provider.spec.ts alone (default pool)"
        continue-on-error: true
        working-directory: apps/server
        run: pnpm exec vitest run src/tls/manual-provider.spec.ts --reporter=verbose

      # ── ROUND 2 ────────────────────────────────────────────────────────
      # Round 1 (A–E above) came back ALL GREEN, including the control:
      # in isolation these two specs pass on windows-latest under every
      # pool mode. So the crash is NOT intrinsic to them — it is an
      # INTERACTION with the rest of the suite (88 other files run first,
      # sequentially, many of them binding sockets and spawning children).
      #
      # The remaining question is whether that interaction is pool-shaped.
      # These steps run the FULL apps/server suite — the only context in
      # which the crash has ever reproduced — under forks (control) and
      # threads. That needs the gate's real setup, hence Postgres/ffmpeg
      # below.
      - name: Set up Postgres 18 (D18 — port 5442)
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: loombre
          password: loombre
          database: loombre
          port: "5442"
          postgres-version: "18"

      - name: Migrate + seed database
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:seed

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Generate media fixtures
        shell: bash
        run: node scripts/gen-media-fixtures.mjs

      - name: "F: FULL apps/server suite, default forks pool — reproduces the crash?"
        continue-on-error: true
        working-directory: apps/server
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5442"
          PGUSER: loombre
          PGPASSWORD: loombre
          DATABASE_URL: postgres://loombre:loombre@127.0.0.1:5442/loombre
          LOOMBRE_TEST_TIME_SCALE: "3"
        run: pnpm exec vitest run

      - name: "G: FULL apps/server suite, --pool=threads"
        continue-on-error: true
        working-directory: apps/server
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5442"
          PGUSER: loombre
          PGPASSWORD: loombre
          DATABASE_URL: postgres://loombre:loombre@127.0.0.1:5442/loombre
          LOOMBRE_TEST_TIME_SCALE: "3"
        run: pnpm exec vitest run --pool=threads

      # ── ROUND 3 ────────────────────────────────────────────────────────
      # Round 2: F (full apps/server suite, standalone) PASSED. So the
      # crash needs the GATE context, not the suite. turbo.json's `test`
      # dependsOn ["^build", "^test"] — a package waits for its
      # DEPENDENCIES' tests, but apps/server and apps/worker depend on
      # neither each other, so turbo runs BOTH suites CONCURRENTLY at its
      # default concurrency of 10. Each package is carefully sequential
      # INTERNALLY (fileParallelism: false, precisely because live-DB specs
      # must not race) — but nothing serializes them against EACH OTHER.
      # On a 2-core Windows runner that means real ffmpeg transcodes and
      # worker threads (apps/worker) running at the same instant as real
      # https servers, Nest apps and WebSockets (apps/server).
      #
      # H reproduces that collision; I serializes it. Scoped to the two
      # colliding packages so this answers in minutes rather than a full
      # gate run.
      - name: "H: turbo test, server+worker CONCURRENT (default) — reproduces the crash?"
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5442"
          PGUSER: loombre
          PGPASSWORD: loombre
          DATABASE_URL: postgres://loombre:loombre@127.0.0.1:5442/loombre
          LOOMBRE_TEST_TIME_SCALE: "3"
        run: pnpm exec turbo run test --filter=@loombre/server --filter=@loombre/worker

      - name: "I: same two packages, --concurrency=1 (serialized)"
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5442"
          PGUSER: loombre
          PGPASSWORD: loombre
          DATABASE_URL: postgres://loombre:loombre@127.0.0.1:5442/loombre
          LOOMBRE_TEST_TIME_SCALE: "3"
        run: pnpm exec turbo run test --filter=@loombre/server --filter=@loombre/worker --concurrency=1

      - name: How to read this run
        if: always()
        shell: bash
        run: |
          echo "ROUND 1 (A-E, isolation):        all green -> the two specs are fine on their own."
          echo "ROUND 2 (F/G, full suite alone): F green   -> the suite is fine on its own; the GATE context matters."
          echo "ROUND 3 (H/I) is the discriminator:"
          echo "  H red, I green -> cross-package turbo concurrency on a 2-core Windows runner is the cause."
          echo "                    Fix: serialize the test task on Windows (--concurrency=1), NOT a test change."
          echo "  H green        -> the collision needs even more of the gate (web/db suites too, or the"
          echo "                    codegen/lint/typecheck steps running before test). Widen the filter next."
