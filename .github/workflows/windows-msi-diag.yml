# SPDX-License-Identifier: AGPL-3.0-only
#
# DIAGNOSTIC, manual-dispatch only — not part of the gate, never runs on
# push or PR. Exists so the release.yml build-windows leg (lane I3's
# installers/windows/build-msi.mjs) can be exercised on a real
# windows-latest runner WITHOUT burning a tag cycle: the first rc tag
# (v0.9.0-rc.1, run 30217169344) died at build-msi step 1/7 on
# `execFileSync("pnpm") → ENOENT` (pnpm is a .cmd shim on Windows;
# Node refuses shell-less cmd-script spawns per CVE-2024-27980), which
# meant steps 2–7 (pnpm deploy, WiX, dotnet test, MSI harvest) had never
# executed on Windows at all. This workflow mirrors release.yml's
# build-windows job step-for-step (minus the tag-derived version — it
# uses package.json, which the release prepare job pins to the tag
# anyway), so a green run here is direct evidence for the release leg.
#
# METHOD NOTE (see windows-tls-diag.yml): continue-on-error steps report
# conclusion=success in the API even when they fail — this workflow uses
# hard-failing steps plus an explicit `VERDICT:` line, so read the log,
# not the step conclusions.
name: windows-msi-diag

on:
  workflow_dispatch:

jobs:
  msi:
    name: windows MSI lane — release build-windows rehearsal
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --release

      - name: Build workspace
        run: pnpm build

      - name: Prepare release output directory
        shell: bash
        run: mkdir -p dist/release

      - name: build-msi.mjs (lane I3)
        shell: bash
        run: |
          set -euo pipefail
          LOOMBRE_VERSION="$(node -p "require('./package.json').version")"
          echo "version under test: $LOOMBRE_VERSION"
          node installers/windows/build-msi.mjs --version "$LOOMBRE_VERSION"

      - name: Stage the built MSI into dist/release
        shell: bash
        run: |
          set -euo pipefail
          LOOMBRE_VERSION="$(node -p "require('./package.json').version")"
          src="installers/windows/out/loombre-${LOOMBRE_VERSION}-windows-x64.msi"
          if [ ! -f "$src" ]; then
            echo "VERDICT:MSI:FAIL (expected MSI not found at $src)"
            exit 1
          fi
          cp "$src" dist/release/
          ls -l dist/release
          echo "VERDICT:MSI:PASS"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-diag
          path: dist/release/**
          if-no-files-found: error

      # Real install/uninstall smoke — the v0.9.0-rc.1 machine test found
      # two defects a green BUILD cannot catch (install landed in
      # Program Files (x86); payload.zip never extracted because
      # extraction was deferred to a service start that cannot happen
      # yet). Runner is admin, so exercise the actual msiexec paths:
      # install must materialize every extracted tree in the 64-BIT
      # Program Files, uninstall must leave zero residue (RemoveFolderEx).
      - name: Install/uninstall smoke (msiexec, real elevation)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi | Select-Object -First 1).FullName
          $proc = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content install.log -Tail 120
            Write-Host "VERDICT:INSTALL:FAIL (msiexec exit $($proc.ExitCode))"
            exit 1
          }
          $root = "C:\Program Files\Loombre"
          foreach ($d in "server","worker","web","node","pg","ffmpeg","svc","tray","payload") {
            if (-not (Test-Path "$root\$d")) { Write-Host "VERDICT:INSTALL:FAIL (missing $root\$d)"; exit 1 }
          }
          if (-not (Test-Path "$root\server\dist\main.js")) { Write-Host "VERDICT:INSTALL:FAIL (extraction incomplete: server\dist\main.js missing)"; exit 1 }
          if (Test-Path "${env:ProgramFiles(x86)}\Loombre") { Write-Host "VERDICT:INSTALL:FAIL (32-bit Program Files folder present)"; exit 1 }
          foreach ($svc in "LoombreServer","LoombreWorker") {
            if (-not (Get-Service $svc -ErrorAction SilentlyContinue)) { Write-Host "VERDICT:INSTALL:FAIL (service $svc not installed)"; exit 1 }
          }
          # Import-graph proof with the RUNNER's node (the bundled node/ is
          # still a placeholder): dynamic import resolves the server's
          # ENTIRE module graph without booting it (isDirectEntrypoint
          # guard). Catches dead node_modules links surviving the
          # zip/extract hop — the class that broke rc.1 on macOS. Worker
          # has no import guard (importing boots it), so server-only.
          node -e "const{pathToFileURL}=require('node:url');import(pathToFileURL(process.argv[1]).href).then(()=>console.log('server import graph resolves')).catch((e)=>{console.error(e);process.exit(1)})" "C:\Program Files\Loombre\server\dist\main.js"
          if ($LASTEXITCODE -ne 0) { Write-Host "VERDICT:INSTALL:FAIL (server import graph broken in extracted payload)"; exit 1 }
          Write-Host "VERDICT:INSTALL:PASS"
          $un = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($un.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 120
            Write-Host "VERDICT:UNINSTALL:FAIL (msiexec exit $($un.ExitCode))"
            exit 1
          }
          if (Test-Path $root) {
            Get-ChildItem -Recurse $root | Select-Object -First 20 FullName
            Write-Host "VERDICT:UNINSTALL:FAIL (residue remains at $root)"
            exit 1
          }
          if (Get-Service LoombreServer -ErrorAction SilentlyContinue) { Write-Host "VERDICT:UNINSTALL:FAIL (LoombreServer service remains)"; exit 1 }
          Write-Host "VERDICT:UNINSTALL:PASS"
