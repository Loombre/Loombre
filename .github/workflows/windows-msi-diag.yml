# SPDX-License-Identifier: AGPL-3.0-only
#
# DIAGNOSTIC, manual-dispatch only — not part of the gate, never runs on
# push or PR. Exists so the release.yml build-windows leg (lane I3's
# installers/windows/build-msi.mjs) can be exercised on a real
# windows-latest runner WITHOUT burning a tag cycle: the first rc tag
# (v0.9.0-rc.1, run 30217169344) died at build-msi step 1/7 on
# `execFileSync("pnpm") → ENOENT` (pnpm is a .cmd shim on Windows;
# Node refuses shell-less cmd-script spawns per CVE-2024-27980), which
# meant steps 2–7 (pnpm deploy, WiX, dotnet test, MSI harvest) had never
# executed on Windows at all. This workflow mirrors release.yml's
# build-windows job step-for-step (minus the tag-derived version — it
# uses package.json, which the release prepare job pins to the tag
# anyway), so a green run here is direct evidence for the release leg.
#
# METHOD NOTE (see windows-tls-diag.yml): continue-on-error steps report
# conclusion=success in the API even when they fail — this workflow uses
# hard-failing steps plus an explicit `VERDICT:` line, so read the log,
# not the step conclusions.
name: windows-msi-diag

on:
  workflow_dispatch:

jobs:
  msi:
    name: windows MSI lane — release build-windows rehearsal
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        run: node scripts/release/stamp-version.mjs --release

      - name: Build workspace
        run: pnpm build

      - name: Prepare release output directory
        shell: bash
        run: mkdir -p dist/release

      - name: build-msi.mjs (lane I3)
        shell: bash
        run: |
          set -euo pipefail
          LOOMBRE_VERSION="$(node -p "require('./package.json').version")"
          echo "version under test: $LOOMBRE_VERSION"
          node installers/windows/build-msi.mjs --version "$LOOMBRE_VERSION"

      - name: Stage the built MSI + bootstrapper into dist/release
        shell: bash
        run: |
          set -euo pipefail
          LOOMBRE_VERSION="$(node -p "require('./package.json').version")"
          for ext in msi exe; do
            src="installers/windows/out/loombre-${LOOMBRE_VERSION}-windows-x64.${ext}"
            if [ ! -f "$src" ]; then
              echo "VERDICT:MSI:FAIL (expected Windows artifact not found at $src)"
              exit 1
            fi
            cp "$src" dist/release/
          done
          ls -l dist/release
          echo "VERDICT:MSI:PASS"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi-diag
          path: dist/release/**
          if-no-files-found: error

      # Real install/uninstall smoke — the v0.9.0-rc.1 machine test found
      # two defects a green BUILD cannot catch (install landed in
      # Program Files (x86); payload.zip never extracted because
      # extraction was deferred to a service start that cannot happen
      # yet). Runner is admin, so exercise the actual msiexec paths:
      # install must materialize every extracted tree in the 64-BIT
      # Program Files, uninstall must leave zero residue (RemoveFolderEx).
      - name: Install/uninstall smoke (msiexec, real elevation)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi | Select-Object -First 1).FullName
          $proc = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "=== install.log: failing actions (Return value 3 / service errors, with context) ==="
            Select-String -Path install.log -Pattern "Return value 3","rror 19","could not be started","StartServices" -Context 8,2 |
              Select-Object -Last 50 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }
            Write-Host "=== ProgramData service-host logs (if any) ==="
            Get-ChildItem "C:\ProgramData\Loombre\logs" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "== $($_.Name) =="; Get-Content $_.FullName -Tail 40
            }
            Write-Host "=== install.log: every LoombreWeb mention with context ==="
            Select-String -Path install.log -Pattern "LoombreWeb" -Context 4,4 |
              Select-Object -Last 30 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext }
            Write-Host "=== svc-trace.log (pre-logger breadcrumbs) ==="
            Get-Content "C:\ProgramData\Loombre\logs\svc-trace.log" -ErrorAction SilentlyContinue
            Write-Host "=== Application event log: .NET / WER entries (last 15) ==="
            Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match "\.NET|Windows Error|Application Error" } |
              Select-Object -First 15 | ForEach-Object { Write-Host $_.TimeCreated $_.ProviderName $_.Message }
            Write-Host "=== SCM event log (last 25) ==="
            Get-WinEvent -LogName System -MaxEvents 200 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -eq "Service Control Manager" } |
              Select-Object -First 25 | ForEach-Object { Write-Host $_.TimeCreated $_.Id $_.Message }
            Write-Host "VERDICT:INSTALL:FAIL (msiexec exit $($proc.ExitCode))"
            exit 1
          }
          $root = "C:\Program Files\Loombre"
          foreach ($d in "server","worker","web","node","pg","ffmpeg","svc","tray","payload") {
            if (-not (Test-Path "$root\$d")) { Write-Host "VERDICT:INSTALL:FAIL (missing $root\$d)"; exit 1 }
          }
          if (-not (Test-Path "$root\server\dist\main.js")) { Write-Host "VERDICT:INSTALL:FAIL (extraction incomplete: server\dist\main.js missing)"; exit 1 }
          if (Test-Path "${env:ProgramFiles(x86)}\Loombre") { Write-Host "VERDICT:INSTALL:FAIL (32-bit Program Files folder present)"; exit 1 }
          foreach ($svc in "LoombreServer","LoombreWorker","LoombreWeb") {
            if (-not (Get-Service $svc -ErrorAction SilentlyContinue)) { Write-Host "VERDICT:INSTALL:FAIL (service $svc not installed)"; exit 1 }
          }
          # Import-graph proof with the RUNNER's node (fast static check —
          # the bundled node\node.exe is real now per the installer
          # completeness audit, but any Node resolves the same graph):
          # dynamic import resolves the server's ENTIRE module graph
          # without booting it (isDirectEntrypoint guard). Catches dead
          # node_modules links surviving the zip/extract hop — the class
          # that broke rc.1 on macOS. Worker has no import guard
          # (importing boots it), so server-only.
          # argv[1] is a DUMMY: main.ts's isDirectEntrypoint guard compares
          # import.meta.url against pathToFileURL(argv[1]) — passing the
          # script path there made this probe BOOT the server in the
          # runner's bare env (round 17: BinaryMissingError from the
          # provisioning path, misattributed as a broken import graph).
          node -e "const{pathToFileURL}=require('node:url');import(pathToFileURL(process.argv[2]).href).then(()=>console.log('server import graph resolves')).catch((e)=>{console.error(e);process.exit(1)})" guard-dummy "C:\Program Files\Loombre\server\dist\main.js"
          if ($LASTEXITCODE -ne 0) { Write-Host "VERDICT:INSTALL:FAIL (server import graph broken in extracted payload)"; exit 1 }
          # ---- Live-boot assertions (installer completeness audit) ----
          # Services are Start="auto" + ServiceControl Start="install" now,
          # so the MSI itself booted the stack during msiexec. First boot
          # does real work before /healthz can answer (payload self-heal
          # hash pass, embedded-PG initdb, migrations), so poll up to 240s
          # rather than asserting immediately. On ANY failure, print the
          # service log tails first — they are the only diagnostics a
          # runner teardown leaves behind.
          function Show-LogTails {
            foreach ($f in "server.log","worker.log","web.log") {
              $p = "C:\ProgramData\Loombre\logs\$f"
              if (Test-Path $p) { Write-Host "==== tail: $p ===="; Get-Content $p -Tail 100 }
              else { Write-Host "==== $p does not exist ====" }
            }
          }
          $deadline = (Get-Date).AddSeconds(240)
          $healthy = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:3001/healthz" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) { Show-LogTails; Write-Host "VERDICT:INSTALL:FAIL (server /healthz not 200 within 240s)"; exit 1 }
          Write-Host "server /healthz returned 200"
          try {
            $login = Invoke-WebRequest -Uri "http://127.0.0.1:3000/login" -UseBasicParsing -TimeoutSec 30
          } catch { Show-LogTails; Write-Host "VERDICT:INSTALL:FAIL (web /login request failed: $_)"; exit 1 }
          if ($login.StatusCode -ne 200) { Show-LogTails; Write-Host "VERDICT:INSTALL:FAIL (web /login returned $($login.StatusCode))"; exit 1 }
          Write-Host "web /login returned 200"
          # The IPC discovery file lands at the LOOMBRE_DATA_DIR root
          # (ProgramData\Loombre — Services.wxs) — the exact path the tray
          # reads; its presence proves the server's IPC listener came up.
          if (-not (Test-Path "C:\ProgramData\Loombre\controller-ipc.json")) { Show-LogTails; Write-Host "VERDICT:INSTALL:FAIL (C:\ProgramData\Loombre\controller-ipc.json missing)"; exit 1 }
          Write-Host "controller-ipc.json discovery file present"
          Write-Host "VERDICT:INSTALL:PASS"
          $un = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($un.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 120
            Write-Host "VERDICT:UNINSTALL:FAIL (msiexec exit $($un.ExitCode))"
            exit 1
          }
          if (Test-Path $root) {
            Get-ChildItem -Recurse $root | Select-Object -First 20 FullName
            Write-Host "VERDICT:UNINSTALL:FAIL (residue remains at $root)"
            exit 1
          }
          if (Get-Service LoombreServer -ErrorAction SilentlyContinue) { Write-Host "VERDICT:UNINSTALL:FAIL (LoombreServer service remains)"; exit 1 }
          Write-Host "VERDICT:UNINSTALL:PASS"

      # The Burn bootstrapper (loombre-<version>-windows-x64.exe), added
      # after the rc.1 VCRUNTIME140 field failure. This runner ALREADY has
      # the VC++ redistributable (Visual Studio is preinstalled), so what
      # this proves is the bundle's DETECT-AND-SKIP path plus its chaining
      # of the MSI — NOT the install-the-prerequisite path, which by
      # definition cannot be exercised on a machine that already has it.
      # Stated plainly rather than left to look like full coverage: the
      # missing-runtime path is provable only on a clean image, and that
      # is exactly the gap that let rc.1 ship broken.
      - name: Bootstrapper install/uninstall smoke (Burn .exe, real elevation)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./package.json').version"
          $exe = "dist/release/loombre-$version-windows-x64.exe"
          if (-not (Test-Path $exe)) { Write-Host "VERDICT:BUNDLE:FAIL (bootstrapper missing at $exe)"; exit 1 }
          Write-Host "bundle size: $([Math]::Round((Get-Item $exe).Length / 1MB, 1)) MiB"

          # /quiet /norestart: unattended. Burn logs to %TEMP%\Loombre_*.log.
          $proc = Start-Process $exe -ArgumentList "/quiet /norestart /log bundle-install.log" -Wait -PassThru
          # 3010 = success, reboot required (a serviced runtime in use).
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Get-Content bundle-install.log -Tail 120 -ErrorAction SilentlyContinue
            Get-ChildItem $env:TEMP -Filter "Loombre_*.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Write-Host "== $($_.Name) =="; Get-Content $_.FullName -Tail 120 }
            Write-Host "VERDICT:BUNDLE:FAIL (bootstrapper exit $($proc.ExitCode))"
            exit 1
          }
          $root = "C:\Program Files\Loombre"
          if (-not (Test-Path "$root\server\dist\main.js")) { Write-Host "VERDICT:BUNDLE:FAIL (chained MSI did not lay down the payload)"; exit 1 }
          foreach ($svc in "LoombreServer","LoombreWorker","LoombreWeb") {
            if (-not (Get-Service $svc -ErrorAction SilentlyContinue)) { Write-Host "VERDICT:BUNDLE:FAIL (service $svc not installed by the bundle)"; exit 1 }
          }
          # The bundle must register ONE Add/Remove Programs entry (its own,
          # with the brand icon) — the chained MSI's entry is hidden by Burn.
          Write-Host "VERDICT:BUNDLE_INSTALL:PASS"

          $un = Start-Process $exe -ArgumentList "/uninstall /quiet /norestart /log bundle-uninstall.log" -Wait -PassThru
          if ($un.ExitCode -ne 0 -and $un.ExitCode -ne 3010) {
            Get-Content bundle-uninstall.log -Tail 120 -ErrorAction SilentlyContinue
            Write-Host "VERDICT:BUNDLE_UNINSTALL:FAIL (exit $($un.ExitCode))"
            exit 1
          }
          if (Test-Path $root) {
            Get-ChildItem -Recurse $root | Select-Object -First 20 FullName
            Write-Host "VERDICT:BUNDLE_UNINSTALL:FAIL (residue remains at $root)"
            exit 1
          }
          # Permanent="yes" on the redistributable: uninstalling Loombre must
          # NEVER remove a shared C++ runtime other software may now depend on.
          $vc = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64" -ErrorAction SilentlyContinue
          if ($null -eq $vc -or $vc.Installed -ne 1) {
            Write-Host "VERDICT:BUNDLE_UNINSTALL:FAIL (the VC++ redistributable was removed — ExePackage Permanent=yes is not holding)"
            exit 1
          }
          Write-Host "VERDICT:BUNDLE_UNINSTALL:PASS"
