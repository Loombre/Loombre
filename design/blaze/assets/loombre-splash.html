<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Loombre — boot splash</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}
body{background:#07080A;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;overflow:hidden}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px);pointer-events:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:22px}
.mark{animation:flash 1.4s ease both}
.mark .rig{transform-box:view-box;transform-origin:50% 85%;animation:enter .9s cubic-bezier(.22,1,.36,1) both}
.mark .blaze{transform-box:view-box;transform-origin:50% 84%;animation:blaze 1.05s ease-in-out .9s infinite}
.mark .core{transform-box:view-box;transform-origin:50% 68%;animation:flicker .72s ease-in-out .9s infinite}
.word{color:#E9EBEE;font-stretch:125%;font-weight:800;font-size:28px;letter-spacing:.24em;padding-left:.24em;animation:up .7s cubic-bezier(.22,1,.36,1) .5s both}
.boot{display:flex;flex-direction:column;gap:4px;width:290px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#61666E}
.boot div{display:flex;justify-content:space-between;opacity:0;animation:up .5s ease both}
.boot span:last-child{color:#FFB454}
.boot div:nth-child(1){animation-delay:1.0s}.boot div:nth-child(2){animation-delay:1.35s}.boot div:nth-child(3){animation-delay:1.7s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blaze{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.94,1.07) rotate(-2.4deg)}45%{transform:scale(1.06,.92) rotate(1.6deg)}70%{transform:scale(.95,1.05) rotate(-1.2deg)}85%{transform:scale(1.03,.97) rotate(.8deg)}}
@keyframes flicker{0%,100%{transform:scale(1,1)}25%{transform:scale(.96,1.05) rotate(-1.5deg)}50%{transform:scale(1.04,.94)}75%{transform:scale(.97,1.03) rotate(1.2deg)}}
@keyframes flash{0%{filter:brightness(1) drop-shadow(0 0 0 rgba(255,180,84,0))}35%{filter:brightness(2.1) drop-shadow(0 0 26px rgba(255,180,84,.85))}100%{filter:brightness(1) drop-shadow(0 0 13px rgba(255,180,84,.4))}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;animation-delay:0s !important}}
</style></head>
<body>
<div class="scan"></div>
<div class="stack">
  <svg class="mark" width="120" height="120" viewBox="0 0 96 96">
    <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFD9A0"/><stop offset="0.5" stop-color="#FFB454"/><stop offset="1" stop-color="#E08F2E"/></linearGradient></defs>
    <g class="rig"><g class="blaze"><path d="M56 6 C50 12 44 20 41 30 C37 27 33 23 28 18 C26 28 21 34 19 44 C16 55 19 66 27 73 C34 79 41 83 48 84 C57 84 65 79 69 70 C72 63 72 55 68 46 C67 43 66 41 67 38 C70 36 74 33 77 28 C73 25 68 24 64 24 C59 18 57 12 56 6 Z" fill="url(#g)"/><path class="core" d="M50 34 C47 40 43 45 42 52 C40 49 38 47 36 46 C34 52 33 57 34 62 C36 71 42 77 49 78 C56 77 62 71 63 62 C63 54 58 47 54 41 C52 38 51 36 50 34 Z" fill="#07080A"/></g></g>
  </svg>
  <div class="word">LOOMBRE</div>
  <div class="boot">
    <div><span>LOOMBRE CORE 0.9.2</span><span>OK</span></div>
    <div><span>LIBRARY MOUNT /MNT/MEDIA</span><span>OK</span></div>
    <div><span>STREAM ENGINE</span><span>READY</span></div>
  </div>
</div>
</body></html>
