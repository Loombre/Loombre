      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me/restricted:
    get:
      operationId: getMyRestrictedSettings
      tags: [restricted]
      summary: >-
        Read the caller's OWN restricted-content state — opt-in, whether a
        PIN is set, and the live unlock window's expiry.
      description: >-
        The read side of PUT /users/me/restricted, for clients that need
        this state without mutating it (a fresh page load). `hasPin` is a
        boolean only — the PIN itself is never returned in any form.
        `unlockedUntilMs` is gate 5 as the server itself re-verifies it on
        every request (user_settings.restricted_unlocked_until_ms); an
        already-elapsed window reads as `null`, so a client can mirror the
        server's lock state exactly instead of guessing. Self-scoped by
        construction (no user-id param) — there is no admin path to another
        user's restricted state.
      responses:
        '200':
          description: The caller's restricted-content state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putMyRestrictedSettings
      tags: [restricted]
      summary: >-
        Self-service restricted-content opt-in and PIN management — the
        opt-in gate of the restricted-content model. Admins cannot perform
        this on behalf of
        another user — there is no admin path to this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictedSettingsUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-user current-password attempts)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

