      summary: List libraries visible to the current user (or, for an admin, every library)
      description: >-
        Defaults to the viewer-scoped listing: only libraries the caller
        holds a `library_permissions` grant on, and — for restricted
        libraries — only while their live unlock (§6.4 gate 5) holds.
        `scope=admin` is the administration-scoped listing (admin only,
        403 otherwise): every library that exists, including restricted
        ones nobody has been granted access to yet, so an admin can issue
        the grant that makes such a library reachable at all. Item counts
        are always computed through the CALLER'S OWN viewer context, so a
        library the caller cannot read reports 0 rather than a leaked
        total.
      parameters:
        - $ref: '#/components/parameters/LibraryListingScope'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
