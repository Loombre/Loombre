  /restricted/studios:
    get:
      operationId: listRestrictedStudios
      tags: [restricted]
      summary: List studios (kind=studio tags) visible within the zone
      description: >-
        404 for a viewer with NO restricted-library entitlement at all. An
        entitled-but-locked viewer gets 200 with an EMPTY page (same gate-5
        posture as GET /restricted/browse).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name.
          schema: { type: string }
      responses:
        '200':
          description: Page of zone studios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedStudioPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/studios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getRestrictedStudio
      tags: [restricted]
      summary: Restricted-zone studio detail
      description: >-
        Byte-identical 404 to an uncleared viewer, a nonexistent id, and a
        studio with zero scenes currently visible within the zone. Catalog
        (a studio's scenes) is reached via GET /restricted/browse's
        `studioTagIds` filter, not a dedicated sub-route.
      responses:
        '200':
          description: Studio detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedStudio' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/search:
    get:
      operationId: restrictedSearch
      tags: [restricted]
      summary: Restricted-zone-scoped search (title, performer, studio, tag)
      description: >-
        A SEPARATE guarded index from GET /search — zone titles must never
        surface through the general search surface, not even as a count/
        timing side-channel, and vice versa (design/phosphor README
        "Restricted content"). Entitlement is checked BEFORE `q` — a
        viewer with NO restricted-library entitlement at all gets 404
        regardless of whether `q` was supplied; an entitled viewer missing
        `q` then gets 422, matching GET /search's own validation. An
        entitled-but-locked viewer gets 200 with an EMPTY page.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of matching zone scenes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedBrowseItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────────── Admin: Stash SQLite metadata sync (STATE.md S1-S4/S8) ────────
  /admin/libraries/{id}/stash-connection:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getAdminLibraryStashConnection
      tags: [admin]
      summary: Read a library's Stash SQLite connection config (admin)
      description: >-
        `configured: false` (sqlitePath null, status never_connected) when
        no connection has ever been saved for this library — GET never
        404s for an otherwise-valid library id just because Stash hasn't
        been configured yet (mirrors GET /admin/libraries/{id}/provider-chain's
        `isDefault` precedent).
      responses:
        '200':
          description: The library's Stash connection config + last observed status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStashConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putAdminLibraryStashConnection
      tags: [admin]
      summary: Configure (or reconfigure) a library's Stash SQLite connection (admin)
      description: >-
        Writes sqlitePath/enabled, plus genreTagNames (K15 — see
        PutAdminStashConnectionRequest.genreTagNames for its omit/null/
        array tri-state). Enqueues a `stash-inventory` job on every
        successful save so the path-mapping preview has fresh data without
        a separate button. 404 if the library itself does not exist
        (checked before body validation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutAdminStashConnectionRequest' }
      responses:
        '200':
          description: The saved connection config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStashConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAdminLibraryStashConnection
      tags: [admin]
      summary: Forget a library's Stash SQLite connection entirely (admin)
      description: >-
        Stash OPEN ledger item 6 ("forget this connection entirely" — the
        prior surface was disable-only via PUT enabled:false). Deletes the
        library_stash_connections row (sqlite_path, enabled, status, and
        every other connection-config/outcome column) — there is no
        keyring-held secret to clear alongside it (S1: Stash is a
        first-party read-only SQLite-file provider, never an HTTP API with
        a credential). NEVER destructive to catalog content: previously
        synced metadata, matched catalog items, and stash_scene_links rows
        are untouched (S8's staleness law — synced facts are KEPT, never
        deleted, even when their source connection itself is forgotten),
        as are this library's stash-path-mappings (a future re-attach does
        not require re-entering them). A pending/scheduled sync is not
        separately cancelled: the periodic schedule loop and any in-flight
        `stash-sync` job both re-resolve the connection row fresh and treat
        its absence as an ordinary "unreachable" outcome (ends the job with
        a failed report; the schedule loop simply stops picking this
        library as due) — no zombie schedule, no code needed to reach into
        the job queue. 404s both when the library itself does not exist
        and when the library exists but has no Stash connection configured
        (nothing to forget). Emits `stash.provider.disconnected`
        (admin-only) in the same transaction as the delete.
      responses:
        '204': { description: Connection forgotten }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{id}/stash-path-mappings:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getAdminLibraryStashPathMappings
      tags: [admin]
      summary: Read a library's Stash path-mapping table (admin)
      responses:
        '200':
          description: The library's path mappings, in admin display order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStashPathMappings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putAdminLibraryStashPathMappings
      tags: [admin]
      summary: Replace a library's Stash path-mapping table wholesale (admin)
      description: >-
        `mappings` is the FULL replacement list — `position` is the array
        index, not supplied explicitly. An empty array clears every
        mapping (S4's oshash tier becomes the only match path). 404 if the
        library itself does not exist (checked before body validation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutAdminStashPathMappingsRequest' }
      responses:
        '200':
          description: The replaced path-mapping table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStashPathMappings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{id}/stash-path-mappings/preview:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: previewAdminLibraryStashPathMappings
      tags: [admin]
      summary: Preview match counts for a CANDIDATE (unsaved) mapping set (admin)
      description: >-
        Pure SQL over the last inventory/sync snapshot's stored Stash paths
        (K10) — never opens the Stash SQLite file itself, so this works as
        soon as one `stash-inventory` job has run. Reflects `mappings` AS
        SUBMITTED, not what is currently saved, so an admin can try a
        mapping before committing it via PUT. 404 if the library itself
        does not exist (checked before body validation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewAdminStashPathMappingsRequest' }
      responses:
        '200':
          description: Match preview against the candidate mapping set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStashPathMappingPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{id}/stash-sync:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: postAdminLibraryStashSync
      tags: [admin]
      summary: Enqueue a full or incremental Stash sync for a library (admin)
      description: >-
        Enqueues a `stash-sync` job (S8) and returns its id honestly — this
        endpoint does not wait for the sync to complete. 404 if the library
        itself does not exist (checked before body validation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostAdminStashSyncRequest' }
      responses:
        '202':
          description: Sync job enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ────────────────────────────── Data freedom ──────────────────────────────
  /export:
    get:
      operationId: exportData
      tags: [data-freedom]
      summary: >-
        Stream an open JSON archive of the caller's accessible data
        — no proprietary lock-in.
      responses:
        '200':
          description: Streamed JSON archive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportArchive' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /import:
    post:
      operationId: importData
      tags: [data-freedom]
      summary: >-
        Import a previously exported archive (admin). Long-running; runs
        through the job queue (long-running work is never performed inline
        on a request thread).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportArchive' }
      responses:
        '202':
          description: Import job enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────────────────────────────── Admin jobs ──────────────────────────────
  /admin/jobs:
    get:
      operationId: listJobs
      tags: [admin]
      summary: List job ledger entries (admin)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getJob
      tags: [admin]
      summary: Get a job ledger entry by id (admin)
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ────────────────────────── Admin sessions (P2.8) ─────────────────────────
  /admin/sessions:
    get:
      operationId: listAdminSessions
      tags: [admin]
      summary: List active playback sessions across all users (admin, now-playing presence)
      description: >-
        Admins are NOT exempt from restricted-
        content gating (the grant and session-unlock gates apply): item display fields on
        each session row are resolved through the REQUESTING ADMIN'S OWN
        ViewerContext, exactly like any other catalog read. A session on an
        item this admin isn't currently cleared to see is still listed (the
        session itself — id/user/device/status/timestamps — carries no
        restricted content), but `itemTitle` is `null` and `contentHidden`
        is `true` instead of leaking the title.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of active admin session rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────────────── Admin: capability report / crash files / logs ────────────
  /admin/capabilities:
    get:
      operationId: getAdminCapabilities
      tags: [admin]
      summary: The verified hardware-capability report (admin)
      description: >-
        The CURRENT
        hw_capability snapshot the plan() engine consumes — what this
        machine's ffmpeg build PROVED it can decode/encode/tone-map, per
        backend, in probe order. `report` is null when no probe has
        completed yet (fresh install before the first hwprobe job).
      responses:
        '200':
          description: Current verified capabilities (or null before first probe)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityReportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/crash-files:
    get:
      operationId: listCrashFiles
      tags: [admin]
      summary: List local crash files (admin)
      description: >-
        Crash handlers write REDACTED local files
        under the app-data crashes dir; this lists their metadata,
        newest-first. Deliberately NOT cursor-paginated (bounded set:
        the crash writer caps retention; a documented deviation from the
        cursor-everywhere rule for a bounded, small, admin-only list).
        Sharing remains entirely manual — nothing here transmits
        anything anywhere.
      responses:
        '200':
          description: Crash file metadata, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrashFileList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/crash-files/{name}:
    get:
      operationId: getCrashFile
      tags: [admin]
      summary: Read one redacted crash file's content (admin)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          description: >-
            Crash file basename exactly as returned by listCrashFiles.
            The strict pattern (no separators, no leading dot) makes path
            traversal structurally impossible — same posture as the HLS
            file-serving routes.
      responses:
        '200':
          description: Redacted crash file content
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/logs/tail:
    get:
      operationId: getAdminLogsTail
      tags: [admin]
      summary: Tail of the server's log file (admin)
      description: >-
        Reads the last N lines of the configured log file
        (LOOMBRE_LOG_FILE; installers point this at the service log).
        `source` is null with empty `lines` when no log file is
        configured — stdout-only dev setups have nothing to tail, and
        the surface says so honestly instead of pretending.
      parameters:
        - name: lines
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Log tail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogTail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────────── Admin: settings (STATE.md Addendum A, decision A6) ──────────
  /admin/filesystem/directories:
    get:
      operationId: browseDirectories
      tags: [admin]
      summary: List directories on the server, for picking library paths (admin)
      description: >-
        Backs the "Browse" affordance in the Add-library dialog. A library
        path names a directory on the SERVER's filesystem, and the browser
        cannot see that filesystem — the web client may not even be running
        on the same machine (Docker runs it in a separate container). An OS
        file dialog is therefore structurally unable to pick these paths;
        the server has to enumerate them.


        Returns DIRECTORY NAMES ONLY. It never lists files, never returns
        file contents, and never reveals sizes — everything it exposes is
        already implied by the paths an admin is about to configure. Omit
        `path` to list this machine's roots (drive letters on Windows, "/"
        plus common mount points on POSIX), then walk down one level at a
        time via the returned entries.


        Admin-only, and deliberately so: enumerating a server's directory
        tree is reconnaissance in the wrong hands. Free-text path entry
        stays supported alongside it, because headless and remote installs
        still need to type a path that this host cannot browse to.


        A permission-denied listing fails 403 with `code:
        "filesystem-permission-denied"` and a `detail` sentence tailored to
        the service account the server is actually running as (the
        macOS/Linux installers run a dedicated least-privilege account that
        cannot read personal home folders) — clients should surface that
        `detail` verbatim, it says what to do about the situation. On a
        platform with a scripted grant recipe (macOS service-account
        installs today), that same 403 body additionally carries a
        `remediation` extension member shaped like
        `FilesystemPermissionRemediation` — a short summary, the exact ACL
        grant command(s) pre-filled with the real requested path, and a
        verify command — which clients should render as an actionable grant
        flow instead of the bare `detail` paragraph. `remediation` is
        additive and absent on platforms without a scripted recipe
        (Linux/dev/container installs today); clients MUST fall back to
        rendering `detail` when it is absent.
      parameters:
        - name: path
          in: query
          required: false
          description: >-
            Absolute path whose immediate subdirectories to list. Must be
            absolute — a relative path is rejected rather than resolved
            against the server's working directory, which would be an
            unpredictable base an operator cannot see.
          schema: { type: string }
      responses:
        '200':
          description: The directory's immediate subdirectories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryListing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Authenticated but not permitted. On the filesystem-permission-
            denied case (`code: "filesystem-permission-denied"`), the body
            may additionally carry a `remediation` member
            (FilesystemPermissionRemediation) — a scripted grant recipe for
            platforms with one (macOS + `_loombre` service-account installs
            today). `remediation` is absent on platforms without a scripted
            recipe (Linux/dev/container installs), where clients fall back
            to rendering `detail`.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      remediation: { $ref: '#/components/schemas/FilesystemPermissionRemediation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Effective settings + provider-key statuses (admin)
      description: >-
        Every registered setting's CURRENT effective
        value (env-pin > database > registry default precedence),
        independent of scope —
        env-only entries are included read-only alongside ui-editable ones,
        so an operator can always see what's actually governing the running
        instance. `restartPendingKeys` lists requiresRestart:true keys whose
        effective value has changed since this server instance booted;
        non-empty means a restart is needed for those changes to fully take
        effect. `providerKeys` (A9) carries TMDB/TVDB key status only — the
        key value itself is never returned by any endpoint.
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/settings/schema:
    get:
      operationId: getAdminSettingsSchema
      tags: [admin]
      summary: Settings registry projection (admin) — the UI form renderer's sole input
      description: >-
        One JSON-schema-per-key projection
        (generated from the server's own settings registry)
        feeds this endpoint, the admin settings UI's dynamic
        widget renderer, and the generated operator/admin docs alike —
        nobody hand-writes a second copy of a setting's shape anywhere.
        Carries no live value (see AdminSettingsResponse for that) — pair
        with GET /admin/settings for the effective value alongside each
        entry's static metadata.
      responses:
        '200':
          description: Registry projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettingsSchemaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/settings/{key}:
    put:
      operationId: updateAdminSetting
      tags: [admin]
      summary: Update one UI-editable setting's value (admin)
      description: >-
        Re-verifies the caller's admin
        status with a FRESH database read at mutation time (never trusted
        from a possibly-stale access-token claim) before anything else,
        including before revealing whether `key` exists at all. Ordered
        checks: 403 (not currently an admin, live re-verify) -> 404 (unknown
        key, or a scope:'env-only' key — those are never writable through
        this surface — the lockout boundary) -> 409
        (an active env pin governs this key right now; the submitted value
        is discarded unconditionally, valid or not) -> 422 (schema
        validation, including the restricted.majorityAgeYears >=18 floor,
        which cannot be configured below it through any path).
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9]*)+$'
          description: >-
            A scope:'ui' registry key exactly as listed by GET
            /admin/settings/schema (e.g.
            "transcode.maxSimultaneousTranscodes"). Dotted
            category.entryName form, matching every entry in
            packages/shared/src/settings-registry.ts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateSettingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The key is currently pinned by its environment variable (A8) —
            env always wins; the submitted value cannot take effect while
            the pin is active, regardless of whether it would otherwise be
            valid on its own. The DB value underneath, if any, is preserved
            but left inert.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────── Admin: provider API keys (Addendum A, decisions A6/A9) ──────────
  # Deliberately NOT nested under /admin/settings/{key}: a
  # /admin/settings/provider-keys/{provider} path would sit one segment away
  # from being swallowed by the {key} param above — the same
  # /users/{id}-shadowed-by-/users/me class of trap (Phase 1). Keys are
  # secrets, never configuration (provider-keys.service.ts's header) — GET
  # never exists for a key VALUE anywhere in this contract; status rides on
  # GET /admin/settings's `providerKeys` only.
  /admin/provider-keys/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProviderName' }
    put:
      operationId: setAdminProviderKey
      tags: [admin]
      summary: Set (or replace) a provider API key (admin, write-only)
      description: >-
        A9: write-only — the submitted key is never echoed back, logged, or
        otherwise readable again through this API (status reads — GET
        /admin/settings — report set/source/lastSetMs only, never the
        value). Stored via the platform secret keyring (packages/secrets),
        never in server_settings (no encryption-at-rest story there). A10
        live-admin re-verify gates this exactly like updateAdminSetting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetProviderKeyRequest' }
      responses:
        '204': { description: Key stored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: clearAdminProviderKey
      tags: [admin]
      summary: Clear a provider API key (admin)
      description: >-
        Removes the stored keyring entry. A real env var for this provider
        (LOOMBRE_TMDB_API_KEY / LOOMBRE_TVDB_API_KEY), if set, still wins on
        the next status read regardless (A8 precedence) — this only clears
        the keyring-stored fallback.
      responses:
        '204': { description: Key cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────── Admin: mail (optional mail transport run, E5/E6/M10/M11) ────────
  # SMTP host/port/security/from-address/from-name live in the settings
  # registry (`mail` category, GET/PUT /admin/settings{,/{key}} above) —
  # this surface covers only the two things that registry deliberately does
  # NOT: the write-only credential pair (username/password, A9 keyring
  # pattern — never server_settings, no encryption-at-rest story there) and
  # the test-send action, which — same discipline as every other queued
  # side effect in this contract (CLAUDE.md invariant 6) — enqueues a real
  # job rather than sending inline on the request thread.
  /admin/mail/credentials:
    put:
      operationId: setAdminMailCredentials
      tags: [admin]
      summary: Set (or replace) the SMTP username/password (admin, write-only)
      description: >-
        Write-only, same posture as setAdminProviderKey: the submitted
        credentials are never echoed back, logged, or otherwise readable
        again through this API — status reads (GET /admin/settings's
        `mailCredentials`) report configured/setAtMs/source only, never the
        values. Stored as one keyring entry (packages/secrets), never in
        server_settings. Credentials are OPTIONAL overall — unauthenticated
        SMTP (a private-network relay) is a legal configuration; this
        endpoint exists for the common case of a real mail provider that
        requires them. A10 live-admin re-verify gates this exactly like
        setAdminProviderKey.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMailCredentialsRequest' }
      responses:
        '204': { description: Credentials stored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            LOOMBRE_SMTP_USERNAME/LOOMBRE_SMTP_PASSWORD are both set in the
            environment — env wins unconditionally (same precedence as
            every other env-pinned value in this contract); the submitted
            credentials cannot take effect while the pin is active.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: clearAdminMailCredentials
      tags: [admin]
      summary: Clear the stored SMTP username/password (admin)
      description: >-
        Removes the stored keyring entry. A real LOOMBRE_SMTP_USERNAME/
        LOOMBRE_SMTP_PASSWORD pair, if both set, still wins on the next
        status read regardless (env precedence) — this only clears the
        keyring-stored fallback. Idempotent: clearing when nothing is
        stored still returns 204.
      responses:
        '204': { description: Credentials cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/mail/test-send:
    post:
      operationId: testSendMail
      tags: [admin]
      summary: Send a real test email through the configured transport (admin)
      description: >-
        Enqueues a real `mail-send` job (template "test", no retries) —
        never sends inline on this request thread.
        The admin observes the outcome (delivered, or the real SMTP
        conversation error) via the existing admin-only job-update live
        feed and the job ledger's error detail for the returned `jobId`, the
        same surface every other queued job already reports through.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestSendMailRequest' }
      responses:
        '202':
          description: Test send enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSendMailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            Mail is not configured yet (`mail.smtpHost`, `mail.fromAddress`,
            and `network.publicUrl` must all be set) — nothing was enqueued.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────── Admin: plugins (LPP v1, Lane W5 — packages/plugin-protocol/spec/
  # lpp-v1.md is the frozen wire contract this surface administers;
  # apps/server/src/plugins/* holds the registration/lifecycle/health
  # services this is a thin admin API over). Every operation re-verifies
  # admin LIVE (A10 pattern) — plugins are a security surface (out-of-process
  # HTTP services holding a delivery-signing secret and, per capability,
  # visibility into library metadata or the activity feed). Response schemas
  # never carry a secret value: hmacSecret is returned exactly once, by
  # registerAdminPlugin and rotateAdminPluginHmac only; `config` on AdminPlugin
  # holds non-secret configSchema values only (LD1) — a plugin's own
  # manifest.configSchema tells the UI which field names are secret: true and
  # therefore keyring-only. ──────────
  /admin/plugins/preview:
    post:
      operationId: previewAdminPlugin
      tags: [admin]
      summary: Fetch and validate a plugin's manifest without registering it (admin)
      description: >-
        C4's confirmation-screen data source: fetches GET <url>/lpp/manifest
        through the same SSRF-guarded transport registration itself uses,
        runs it through the staged manifest parser, and returns a summary —
        every declared capability with its scope, the full configSchema, and
        the union of requested event types. Nothing is persisted; calling
        this twice for the same URL never conflicts with anything, and
        nothing here mints a secret. An unknown capability type in the
        manifest fails with 422 whose `detail` states plainly that this
        Loombre does not support that capability type yet (C2); a
        SSRF-rejected URL (private/loopback/disallowed address, unless
        `lanAllowlist` covers it) also fails 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewPluginRequest' }
      responses:
        '200':
          description: Validated manifest summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManifestPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins:
    get:
      operationId: listAdminPlugins
      tags: [admin]
      summary: List registered plugins, including health/breaker state (admin)
      description: >-
        Deliberately NOT cursor-paginated (mirrors listCrashFiles' documented
        deviation from the cursor-everywhere rule): a self-hosted instance's
        plugin registry is a small, admin-managed set, not an unbounded
        catalog collection.
      responses:
        '200':
          description: Registered plugins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPluginList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: registerAdminPlugin
      tags: [admin]
      summary: Register a plugin (admin)
      description: >-
        LD6's registration state machine: re-fetches and re-validates the
        manifest at `url` (never trusts a client-supplied preview payload),
        validates the submitted grants against it, validates `config`
        against the manifest's configSchema (secret fields route to the
        keyring, never to the stored plugin row), mints the delivery-signing
        HMAC, runs a health check, and commits the plugin enabled with the
        granted scope. `hmacSecret` in the response is shown EXACTLY ONCE —
        it is never retrievable again through any endpoint. A failed health
        check does NOT block registration: the row still commits, with
        `healthState: unhealthy`; the admin UI is expected to surface this
        and offer enable-anyway vs cancel (the plugin already exists at that
        point — cancel means the UI immediately calling removeAdminPlugin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPluginRequest' }
      responses:
        '201':
          description: Plugin registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterPluginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A plugin is already registered at this baseUrl
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getAdminPlugin
      tags: [admin]
      summary: Read one registered plugin (admin)
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeAdminPlugin
      tags: [admin]
      summary: Remove a plugin (admin)
      description: >-
        LD9: deletes the plugin row (plugin_event_grants CASCADE) and every
        keyring entry it owns — the HMAC and every secret config field.
        Nothing keyring-side survives.
      responses:
        '204': { description: Plugin removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/config:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      operationId: updateAdminPluginConfig
      tags: [admin]
      summary: Update a plugin's config values (admin)
      description: >-
        Validated against the plugin's stored manifest configSchema exactly
        like registration; secret fields route to the keyring, never to the
        plugin row's non-secret `config`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePluginConfigRequest' }
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/event-grants:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      operationId: updateAdminPluginEventGrants
      tags: [admin]
      summary: Update which requested event types this plugin is granted (admin)
      description: >-
        Full-replacement grant set for the plugin's already-GRANTED
        event-subscriber capability — every value must be a member of that
        capability's manifest-declared `eventTypes` request. Does not change
        which capability TYPES are granted (see reapproveAdminPlugin for
        that) and can never widen scope beyond what registration/reapproval
        already approved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePluginEventGrantsRequest' }
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This plugin's event-subscriber capability is not currently granted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/pseudonymization:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      operationId: updateAdminPluginPseudonymization
      tags: [admin]
      summary: Toggle whether this plugin receives pseudonymous or real actor ids (admin)
      description: >-
        LPP v1 mission §3.2 (Lane W5b): plugins.pseudonymize_actor_ids
        (migrations/0016_plugin_delivery_cursors.sql), default TRUE — every
        user-id-bearing field the outbox delivery loop's actor-field map
        names for a delivered event is replaced with a per-(plugin,user)
        stable pseudonym before signing and delivery. Setting `enabled:
        false` sends real account ids to this plugin instead, effective
        immediately for every batch delivered from that point on (already-
        delivered batches are unaffected — this is not retroactive).
        Requires this plugin to currently hold the event-subscriber
        capability grant (409 otherwise, same guard as
        updateAdminPluginEventGrants) — the setting has nothing to act on
        for a plugin that never receives the activity feed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePluginPseudonymizationRequest' }
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This plugin's event-subscriber capability is not currently granted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: enableAdminPlugin
      tags: [admin]
      summary: Re-enable a manually- or breaker-disabled plugin (admin)
      description: >-
        Resets the health breaker. A plugin currently disabled for
        `disabledReason: scope-change` cannot be re-enabled this way —
        reapproveAdminPlugin is the only door out of that state (a plain
        re-enable would skip the new grant validation that state exists to
        force).
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This plugin is disabled for a scope change and requires reapproveAdminPlugin
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: disableAdminPlugin
      tags: [admin]
      summary: Manually disable a plugin (admin)
      responses:
        '200':
          description: Updated plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: refreshAdminPlugin
      tags: [admin]
      summary: Re-fetch a plugin's manifest and apply/flag any scope change (admin)
      description: >-
        Any expansion (a new capability type, broader mediaKinds, a
        contentClass widened general -> restricted, a broader eventTypes
        request) auto-disables the plugin (`disabledReason: scope-change`)
        and leaves the previously-approved grants untouched pending
        reapproveAdminPlugin — `expanded: true` and `reasons` describe
        exactly what grew. A non-expanding refresh updates the stored
        manifest snapshot in place (grants only ever narrow automatically,
        never requiring re-approval).
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshPluginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/reapprove:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: reapproveAdminPlugin
      tags: [admin]
      summary: Re-approve a plugin after a scope-expanding refresh (admin)
      description: >-
        Only valid while `disabledReason: scope-change`. Re-fetches the
        manifest fresh (time may have passed since the expansion was
        detected), validates the submitted grant against it exactly like
        registration, and re-enables the plugin with the new grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReapprovePluginRequest' }
      responses:
        '200':
          description: Re-approved plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This plugin is not currently awaiting scope-change re-approval
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/plugins/{id}/rotate-hmac:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: rotateAdminPluginHmac
      tags: [admin]
      summary: Rotate a plugin's delivery-signing HMAC secret (admin)
      description: >-
        Mints a genuinely fresh secret, overwriting the stored one — the
        plugin must be reconfigured with the new value out-of-band. Returned
        EXACTLY ONCE, never retrievable again afterward.
      responses:
        '200':
          description: The new HMAC secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotatePluginHmacResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/libraries/{id}/provider-chain:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getAdminLibraryProviderChain
      tags: [admin]
      summary: Read a library's metadata-provider fallback chain (admin)
      description: >-
        LPP v1, Lane W3/W5b (migrations/0015_library_provider_chains.sql).
        `isDefault: true` means this library has ZERO
        library_provider_entries rows — `entries` then reflects the legacy
        hardcoded per-mediaKind default chain
        (apps/worker/src/metadata/provider-chain-defaults.ts), shown
        READ-ONLY for reference; putAdminLibraryProviderChain is the only
        way to customize it. `eligiblePlugins` is every registered plugin
        whose `contentClass` strictly EQUALS this library's `contentClass`
        (LPP C5 STRICT, apps/server/src/plugins/scope.ts) — the admin
        add-entry picker's plugin choice list. `builtinProviderNames` is the
        closed set of built-in provider names, always eligible regardless of
        `contentClass`.
      responses:
        '200':
          description: The library's provider chain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLibraryProviderChain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putAdminLibraryProviderChain
      tags: [admin]
      summary: Replace a library's metadata-provider fallback chain wholesale (admin)
      description: >-
        `entries` is the FULL replacement chain — `position` is the array
        index, not supplied explicitly. An empty `entries` array clears the
        chain, reverting the library to the inherited legacy default
        (isDefault flips back to true). Rejects the WHOLE call (no partial
        write) on: a malformed entry (wrong shape for its `providerKind`),
        an unrecognized `builtinName`, a `pluginId` that does not resolve to
        a registered plugin, or a `pluginId` whose plugin.contentClass does
        not EQUAL this library's contentClass exactly (422, LPP C5 STRICT —
        the error names both content classes involved). 404 if the library
        itself does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutAdminLibraryProviderChainRequest' }
      responses:
        '200':
          description: The library's replaced provider chain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLibraryProviderChain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────── Admin: Stash sync report (Stash SQLite metadata sync, S8/K14,
  # Lane C sync engine) ────────
  /admin/libraries/{id}/stash-sync-report:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getAdminStashSyncReport
      tags: [admin]
      summary: The latest Stash metadata-sync report for a library (admin)
      description: >-
        STATE.md S8/K14 (Stash SQLite metadata sync, Lane C sync engine).
        `report` is the most recently STARTED `stash-sync` job's counts
        (matched/updated/unmatched/stale/skipped) and status — null when no
        sync has ever run for this library yet, same honest-empty-shape
        precedent as GET /admin/capabilities's `{report: null}` before the
        first hwprobe. `unmatchedScenes`/`staleScenes` are NOT a frozen
        snapshot from the report row — both are LIVE, keyset-paginated
        queries over the current stash_scene_links table (K10/S4/S8), so
        they reflect fixes (a corrected path mapping, a scene reappearing
        in Stash) immediately, without waiting for the next sync run.
        `unmatchedLoombreFiles` (FX3 fix wave) is the Loombre-side twin —
        S4/S8 document BOTH unmatched sides as the report's job; this is
        also a live query, over media_files/catalog_items, never a report
        snapshot.
      parameters:
        - name: unmatchedCursor
          in: query
          required: false
          description: Opaque pagination cursor for `unmatchedScenes`, from a previous response's `unmatchedScenes.nextCursor`.
          schema: { type: string }
        - name: staleCursor
          in: query
          required: false
          description: Opaque pagination cursor for `staleScenes`, from a previous response's `staleScenes.nextCursor`.
          schema: { type: string }
        - name: unmatchedLoombreFilesCursor
          in: query
          required: false
          description: Opaque pagination cursor for `unmatchedLoombreFiles`, from a previous response's `unmatchedLoombreFiles.nextCursor`.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The library's latest Stash sync report, plus live unmatched/stale/unmatched-Loombre-file lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StashSyncReportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────────── Admin: Fix Match (Phosphor retheme Wave 2, Lane L2) ──────────
  /admin/libraries/{id}/unmatched:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: listUnmatchedLibraryItems
      tags: [admin]
      summary: List catalog items in a library with no provider metadata match (Fix Match, admin)
      description: >-
        Derived, never stored: an item of an enrichable type
        (movie/series/artist/album) with zero provider_ids rows. Cursor-
        paginated, most-recently-added first. Goes through the standard
        catalog guard (packages/db/src/query/guard.ts's applyGuard) with the
        REQUESTING ADMIN'S OWN ViewerContext — admins are not exempt from
        restricted-content gating or from needing their own library_permissions
        grant (docs/PLAN.md §6.4).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of unmatched items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnmatchedLibraryItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/items/{id}/match-search:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: searchItemMatchCandidates
      tags: [admin]
      summary: Enqueue a bounded metadata-provider candidate search for an item (Fix Match, admin)
      description: >-
        Nothing spawns provider I/O inline in a request path: enqueues a
        'metadata-search' job. The worker resolves
        the item's provider chain, searches every enabled provider, scores
        each result (apps/worker/src/metadata/match.ts's title/year scoring),
        and delivers the ranked candidate list as an admin-only
        `metadata.match-candidates` event over the existing events socket
        (GET /admin/jobs/{id} also reflects the job's own lifecycle).
      responses:
        '202':
          description: Candidate-search job enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/items/{id}/apply-match:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: applyItemMatch
      tags: [admin]
      summary: Apply a chosen provider match to an item (Fix Match, admin)
      description: >-
        Enqueues the EXISTING 'metadata' job with a forced provider ref —
        re-fetches provider details + artwork for exactly the chosen
        candidate (bypassing search/pickBestMatch) and merges them through
        the same field-precedence engine every scan-triggered metadata job
        already uses (existing nfo/tag-sourced fields keep their precedence
        unchanged). Never touches the original media file.
        `provider` is validated against the set this server can actually
        resolve BEFORE anything is enqueued: an unknown built-in name, or
        an `lpp:<pluginId>` whose plugin is missing or disabled, is a 422
        naming the field and leaves NO job behind (previously any string
        was accepted with a 202 and the resulting job completed having
        changed nothing). Item existence is checked first, so a
        nonexistent item 404s regardless of the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyMatchRequest' }
      responses:
        '202':
          description: Apply-match job enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ──────── Remote access — Loombre Remote / Tunnel / Direct (STATE.md
  # "Loombre Remote — embedded WireGuard + three-path wizard + reachability
  # proof + posture card", R1-R11/RG1-RG15) ────────────────────────────────
  # Wave 0 (lane/remote-base): this whole section lands as conforming 501
  # shells (RG15) — every op here is mounted, admin ops require
  # requireLiveAdmin (A10) THEN 501 (apps/server/src/remote/), the public
  # probe page returns the byte-identical enumeration-resistant 404 from
  # day one. Later lanes replace each 501 with real behavior against this
  # SAME frozen contract; nothing here is expected to change shape once a
  # lane lands, only its response body's actual content.
  /admin/remote/state:
    get:
      operationId: getRemoteState
      tags: [remote]
      summary: Wizard re-entry read — derived active path + per-path status (admin)
      description: >-
        `activePath` is DERIVED, never stored (RG15/RG5 refinement — there
        is no `remote.activePath` setting): computed from the three
        subsystems' own enabled state, at most one of which can be enabled
        at a time (the staged enable flows below 409 rather than allowing
        two paths live together). Lets the wizard re-enter mid-flow or land
        on the posture handoff without the client tracking step state
        itself (RG10 — the server persists only outcomes).
      responses:
        '200':
          description: Derived remote-access state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/wireguard/enable:
    post:
      operationId: enableRemoteWireguard
      tags: [remote]
      summary: Enable Loombre Remote — embedded userspace WireGuard (admin)
      description: >-
        R1: generates the server WG keypair (private key in the KEYRING,
        never server_settings) and opens the in-process userspace listener
        (wireguard-go + netstack, RG1/RG2) — no kernel module, no root, no
        routing-table changes, LAN never exposed. Staged validate→stage→
        commit (RG10, plugin-registration shape); 409 when a DIFFERENT path
        is already active (at most one active path, RG5/RG15).
      responses:
        '200':
          description: Wireguard enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWireguardStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A different remote-access path is already active.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/wireguard/disable:
    post:
      operationId: disableRemoteWireguard
      tags: [remote]
      summary: Disable Loombre Remote — verified teardown (admin)
      description: >-
        R8: revokes every enrolled peer and drops the listener, verified —
        not merely a flag flip. Idempotent: disabling an already-disabled
        listener still returns 200 with the (already-disabled) status.
      responses:
        '200':
          description: Wireguard disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWireguardStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/wireguard/status:
    get:
      operationId: getRemoteWireguardStatus
      tags: [remote]
      summary: Listener state, port, subnet, endpoint host, peer count (admin)
      responses:
        '200':
          description: Wireguard status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWireguardStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/wireguard/devices:
    get:
      operationId: listRemoteWireguardDevices
      tags: [remote]
      summary: List enrolled Remote (WireGuard) devices (admin)
      description: >-
        R2: these ARE rows in the existing devices list (kind: remote) —
        this is the WireGuard-scoped view of that same population (tunnel
        IP, enrollment/handshake timestamps) rather than a separate entity.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of enrolled devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWireguardDevicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: enrollRemoteWireguardDevice
      tags: [remote]
      summary: Enroll a device — one-time provisioning payload (admin)
      description: >-
        R2/R3: generates a fresh peer keypair server-side, allocates the
        next free tunnel IP (RG9, subnet default 10.82.146.0/24, server
        =.1, devices from .2), and returns the FULL wg-quick config text
        ONCE — the private key is not retained after this response (same
        posture as invite links). The config is split-tunnel ONLY
        (AllowedIPs scoped to the Loombre tunnel address, R3) and
        APP-AGNOSTIC standard WireGuard semantics (packages/shared/src/
        remote/provisioning.ts — today's official WireGuard app and
        tomorrow's native Loombre clients enroll through this identical
        shape). 409 when Wireguard is not enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRemoteWireguardDeviceRequest' }
      responses:
        '201':
          description: Enrolled — the one-time provisioning payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteWireguardEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown userId.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Wireguard is not enabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/wireguard/devices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    delete:
      operationId: revokeRemoteWireguardDevice
      tags: [remote]
      summary: Revoke an enrolled Remote device — removes the peer live (admin)
      description: >-
        R2/RG3: removes the live WG peer (handshake fails immediately after)
        AND revokes the underlying device row's refresh tokens (RG3's
        pre-existing-gap closure — WG2 wires this; this Wave-0 shell only
        reserves the operation's shape). Distinct from the self-service
        DELETE /devices/{id}: this is an ADMIN-scoped revoke of ANY user's
        enrolled device, not only the caller's own.
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/tunnel/token:
    post:
      operationId: setRemoteTunnelToken
      tags: [remote]
      summary: Set the BYO Cloudflare API token — write-only (admin)
      description: >-
        R4/R9: write-only, same posture as setAdminProviderKey/
        setAdminMailCredentials — the submitted token is never echoed back,
        logged, or otherwise readable again through this API; stored in the
        platform KEYRING (packages/secrets), never server_settings. Returns
        a VALIDATION RESULT (a real, bounded Cloudflare API call proving the
        token's scope is usable), not the token itself.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRemoteTunnelTokenRequest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteTunnelTokenValidation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: clearRemoteTunnelToken
      tags: [remote]
      summary: Clear the stored Cloudflare API token (admin)
      description: Removes the keyring entry. Idempotent — clearing when nothing is stored still returns 204.
      responses:
        '204': { description: Token cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/tunnel/enable:
    post:
      operationId: enableRemoteTunnel
      tags: [remote]
      summary: Enable the Tunnel path — creates the tunnel + DNS route, starts the connector (admin)
      description: >-
        R4: creates a Cloudflare tunnel + DNS route via the stored token,
        then runs cloudflared as a managed, supervised child process (RG7 —
        EmbeddedPostgres supervisor / spawnFfmpegRun shape: SIGTERM→timeout→
        SIGKILL, stderr ring buffer, full-jitter backoff). Staged
        validate→stage→commit (RG10); 409 when a different path is already
        active, or when no valid token is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableRemoteTunnelRequest' }
      responses:
        '200':
          description: Tunnel enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteTunnelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A different remote-access path is already active, or no valid tunnel token is stored.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/tunnel/disable:
    post:
      operationId: disableRemoteTunnel
      tags: [remote]
      summary: Disable the Tunnel path — verified connector teardown (admin)
      description: R8 — tears down the tunnel + DNS route and stops the connector process, verified. Idempotent.
      responses:
        '200':
          description: Tunnel disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteTunnelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/tunnel/status:
    get:
      operationId: getRemoteTunnelStatus
      tags: [remote]
      summary: Connector health, backoff, last error (admin)
      responses:
        '200':
          description: Tunnel status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteTunnelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/tunnel/logs:
    get:
      operationId: getRemoteTunnelLogs
      tags: [remote]
      summary: Bounded tail of the connector's stderr ring buffer (admin)
      description: RG7 — the supervised cloudflared child's in-memory stderr ring buffer, not a file (no LOOMBRE_LOG_FILE dependency).
      parameters:
        - name: lines
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Connector log tail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteTunnelLogs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/direct/acme-test:
    post:
      operationId: testRemoteDirectAcme
      tags: [remote]
      summary: Staged test certificate issuance before committing Direct/ACME (admin)
      description: >-
        RG12: runs a real STAGED test issuance through the existing
        issue-certificate.ts module BEFORE tls.mode is ever flipped
        (lockout-risk mitigation) — proves issuance is feasible for the
        given domain without touching live TLS config.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRemoteDirectAcmeRequest' }
      responses:
        '200':
          description: Test issuance result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDirectAcmeTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/direct/enable:
    post:
      operationId: enableRemoteDirect
      tags: [remote]
      summary: Enable the Direct path — ACME issuance or reverse-proxy mode (admin)
      description: >-
        R5: `mode: acme` commits tls.mode via the existing restart
        machinery (server-power UI) after a passing acme-test; `mode:
        reverse-proxy` records the trust-proxy configuration instead — the
        wizard never touches the router itself (HARD LINE: detect,
        instruct, verify, never auto-configure the network — no UPnP,
        ever). Staged validate→stage→commit (RG10); 409 when a different
        path is already active.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableRemoteDirectRequest' }
      responses:
        '200':
          description: Direct path enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDirectStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A different remote-access path is already active.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/direct/disable:
    post:
      operationId: disableRemoteDirect
      tags: [remote]
      summary: Disable the Direct path (admin)
      description: R8 — verified disable. Idempotent.
      responses:
        '200':
          description: Direct path disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDirectStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/diagnosis:
    post:
      operationId: diagnoseRemote
      tags: [remote]
      summary: Classify a failed reachability proof (admin)
      description: >-
        R5/R6/RG11 — pure WAN-classification decision function
        (packages/shared/src/remote/diagnosis.ts): RFC 6598 (100.64/10) WAN
        -> definite CGNAT; RFC1918 WAN -> double-NAT; WAN matches the
        DNS-resolved public endpoint but the probe never arrived -> a
        port/firewall block; WAN differs from the resolved endpoint ->
        CGNAT/dynamic-IP mismatch, routes the wizard to Tunnel. No
        third-party echo service and no router APIs — `wanAddress` is
        admin-supplied via a guided router-status-page instruction card.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnoseRemoteRequest' }
      responses:
        '200':
          description: Diagnosis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteDiagnosisResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/probes:
    post:
      operationId: createRemoteProbe
      tags: [remote]
      summary: Mint a one-time reachability-proof probe token (admin)
      description: >-
        R6: hashed at rest (SHA-256, house pattern M3/RG6 — constant-time by
        construction, argon2id deliberately NOT used on this unauth-reached
        token), 15-minute expiry, single-use, bound to `expectedEndpoint`.
        The raw token appears ONLY in THIS response, embedded in `probeUrl`
        (https://&lt;endpoint&gt;/probe/&lt;token&gt;) and `qrPayload` — never
        retrievable again. Scan `qrPayload` with a phone ON CELLULAR (the
        phone IS the external vantage; no third-party check service).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRemoteProbeRequest' }
      responses:
        '201':
          description: Probe minted — the one-time token, embedded in probeUrl/qrPayload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteProbeToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/remote/probes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getRemoteProbe
      tags: [remote]
      summary: Poll a probe's arrival state (admin)
      description: >-
        The wizard watches this to light the reachability proof green
        end-to-end. `diagnosis` is populated once the probe has definitively
        failed to arrive (RG11's decision function) — never speculative
        while still `pending`.
      responses:
        '200':
          description: Probe status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteProbeStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # DRIFT DECISION #1 (STATE.md, logged at Wave-0 freeze — S1's to land):
  # the frozen 20-op list above omitted a posture READ endpoint even though
  # R7's card (and U3, the web posture-card surface) need one. Additive,
  # landed with its real controller + conformance entries in the SAME
  # commit series as this contract change (no 501 interim — the op did not
  # exist at Wave 0, so there is nothing to replace).
  /admin/remote/posture:
    get:
      operationId: getRemotePosture
      tags: [remote]
      summary: Exposure-aware security posture card (admin)
      description: >-
        R7: evaluates every posture check applicable to the currently
        active remote-access path (packages/shared/src/remote/
        posture-model.ts's frozen POSTURE_CHECK_KEYS/applicableChecks —
        `checks` is empty when no path is enabled, since every active path
        always yields at least one check). Grades link to fix actions.
        Regressions/recoveries are separately reported via the admin-only
        outbox (`posture.regressed`/`posture.recovered`, RG4) by a
        background sweep — this endpoint itself is a stateless "evaluate
        now" read with no side effects.
      responses:
        '200':
          description: Current posture card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemotePostureCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────── Public probe-arrival page (R6/R9, M12 quartet) ───────────
  /probe/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: The raw one-time probe token (never the hash).
    get:
      operationId: getProbePage
      tags: [remote]
      summary: Reachability-proof arrival page — PUBLIC by necessity (R6/R9)
      description: >-
        R6/R9: one of only THREE new unauthenticated surfaces this
        subsystem introduces (alongside the WireGuard UDP listener itself
        and the tunnel connector's own inbound edge) — necessarily public
        because the whole point is an external phone-on-cellular request
        with no prior credentials. Rate-limited (`rateLimit.probe`,
        per-IP), token-gated, constant-time lookup (RG6's SHA-256 hash
        equality — same posture as invite-claim), and returns a STATIC
        success page with ZERO server info (no version, no instance name,
        nothing an unauthenticated prober could use for reconnaissance).
        Invalid, expired, already-consumed, or well-formed-but-unknown
        tokens ALL resolve to the SAME byte-identical 404 this operation
        shares with an unknown route at this same path (the shared
        not-found problem — a fixed generic `detail`, and an `instance`
        that is this route's TEMPLATE, never the submitted token — the
        same "invisible == nonexistent" posture as POST /setup/first-admin
        once configured and GET/POST /invites/claim/{token}) — the four
        cases are deliberately indistinguishable from the outside
        (enumeration-resistant). Wave 0: this shell IS the final behavior
        for every case except a genuinely-arrived probe (no probe tokens
        exist yet, so every request legitimately 404s); a later lane adds
        the real single-use lookup + arrival-marking without changing this
        response shape.
      security: []
      responses:
        '200':
          description: Static success page — no server info, nothing an unauthenticated caller can use for reconnaissance.
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Rate limited (unauthenticated surface)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access JWT; refreshed via per-device rotating refresh tokens.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous page's `nextCursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdPathParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LibraryIdFilter:
      name: libraryId
      in: query
      required: false
      schema: { type: string, format: uuid }
    # Gap-closure lane: browse Sort control. Additive on movies/series/
    # artists/albums/tracks (+ combines with LibraryIdFilter unchanged).
    # An unrecognized value is ignored (falls back to the default), same
    # lenient posture the `limit` param already has — no dedicated 422 path.
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Defaults to `added`. `order`'s default depends on which sort is
        active (title: asc; added/rating/year: desc) unless `order` is
        explicitly supplied. A cursor from a previous page is only valid
        for the SAME sort+order pair it was issued under.
      schema: { type: string, enum: [title, added, rating, year], default: added }
    Order:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [asc, desc] }
    # browser-admin-F7 follow-up (d3-d5): which SCOPE GET /libraries answers
    # in. `viewer` (the default, and the only behaviour before this existed)
    # is the guarded listing; `admin` is the administration-scoped one and
    # is refused 403 to a non-admin. An unrecognized value falls back to
    # `viewer` — the same lenient posture `limit`/`sort`/`order` already
    # have, and it fails CLOSED here (a typo can never widen the scope).
    LibraryListingScope:
      name: scope
      in: query
      required: false
      description: >-
        `viewer` (default): libraries this caller may see. `admin`:
        every library that exists, including restricted libraries with no
        grants yet — admin only (403 otherwise). Unrecognized values are
        treated as `viewer`.
      schema: { type: string, enum: [viewer, admin], default: viewer }

  responses:
    Problem:
      description: Unexpected error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: >-
        Resource not found (or not visible under the caller's
        ViewerContext). ALWAYS `urn:loombre:problem:not-found` with title
        `Not Found` and a FIXED `detail` — a per-entity-kind sentence on a
        contract-governed operation, one shared generic string on the
        enumeration-resistant family (unknown route, wrong method, and the
        deliberately opaque token/inert-endpoint lookups). `instance` is
        the request path (collapsed to the route template where the path
        carries a token) and is the ONLY member that varies with the
        request, so a hidden resource and a nonexistent route answer
        byte-identical bodies at any given path.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Request failed schema/business-rule validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ═══════════════════════════ Shared primitives ═══════════════════════════
    Problem:
      type: object
      description: RFC 9457 problem details. Extension members are additive.
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable machine-readable error code, additional to `type`.
      required: [title, status]
      additionalProperties: true

    ItemType:
      type: string
      enum: [movie, series, season, episode, artist, album, track]

    ContentClass:
      type: string
      enum: [general, restricted]
      description: Coarse restricted-content gate on libraries, inherited by items.

    MediaKind:
      type: string
      enum: [movie, tv, music]

    ImageEntityType:
      type: string
      enum: [movie, series, season, episode, artist, album, track, person, tag]
      description: >-
        Entity types a managed image can belong to. `person` images are
        guarded by the SAME leak rule listPeople/getPersonById use
        (content_class isolation AND credited-on->=1-visible-item), so a
        person invisible to the caller has no reachable images either.
        This value plus the server-side mapping
        fix close that gap so a Person page portrait
        (GET /images/person/{id}/thumb) can be served. `tag` (S9 — studio
        logos: studios are kind=studio tags, S6) is guarded the same way,
        via applyGuardToTags + applied-to->=1-visible-item.

    ImageKind:
      type: string
      enum: [poster, backdrop, logo, disc, thumb]

    ImageFormat:
      type: string
      enum: [webp, avif, jpeg]

    ProgressState:
      type: string
      enum: [unplayed, in-progress, played]

    ItemTagKind:
      type: string
      enum: [genre, tag]

    ImageDescriptor:
      type: object
      description: >-
        One pre-scaled managed image variant. Never computed on
        request (Tier-0 rule) — width/height/blurhash/dominantColor mirror
        the `images` table row an ingest-time worker_thread wrote.
      additionalProperties: false
      required: [kind, width, height, blurhash]
      properties:
        kind: { $ref: '#/components/schemas/ImageKind' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        blurhash: { type: [string, 'null'] }
        dominantColor:
          type: [string, 'null']
          description: >-
            Hex '#rrggbb' dominant colour extracted worker-side at ingest.
            Null when
            not yet computed/unavailable.

    # ═══════════════════════════════ Auth / devices ═══════════════════════════
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password, deviceName, deviceProfile]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string, format: password, minLength: 1 }
        deviceName: { type: string }
        deviceProfile: { $ref: '#/components/schemas/DeviceProfile' }
        deviceId:
          type: string
          format: uuid
          description: >-
            Reuse an existing device row owned by the authenticating user:
            its refresh-token chain is rotated and
            profile/last-seen refreshed instead of a new row being created.
            Omitted, unknown, or owned by a different user -> a new device
            is registered; device existence is never
            leaked either way.

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceId]
      properties:
        refreshToken: { type: string }
        deviceId: { type: string, format: uuid }

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        deviceId: { type: string, format: uuid }

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessTokenExpiresAtMs, deviceId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAtMs:
          type: integer
          format: int64
          description: Epoch milliseconds; access tokens are 15-minute lived.
        deviceId: { type: string, format: uuid }
        mustChangePassword:
          type: boolean
          description: >-
            E3a/M14 — true iff an admin/CLI temporary-password reset is
            still pending a real password change. Additive; always sent
            by authLogin and authRefresh (never omitted, even when false)
            so older clients that ignore it are unaffected. While true, the
            server restricts this account to auth login/refresh/logout,
            GET /users/me, and PATCH /users/me (403 on everything else) —
            enforced server-side, not merely advisory.
        emailApplied:
          type: boolean
          description: >-
            LD-13c (STATE.md "Mail posture trio"): additive; sent ONLY by
            claimInvite (never authLogin/authRefresh/first-admin — a fresh
            claim is the only TokenPair-returning op where an email can
            silently fail to apply). `false` iff the claim's intended email
            (submitted or preset-inherited) collided with another account's
            and was therefore silently dropped (F3/G6's existing E8-safe
            silent-no-op — this field is the honest signal that behavior
            already existed without). `true` whenever the email ended up
            applied as intended, INCLUDING when no email was ever
            submitted/preset (nothing to drop) and when the claimant
            explicitly opted out via ClaimInviteRequest's `email: null`
            (LD-13b — intent achieved, not a drop). Deliberately POST-AUTH
            ONLY (never surfaced pre-account-creation, e.g. GET
            /invites/claim/{token} or any pre-creation error path): a
            caller can only read this field by completing a real, rate-
            limited account creation, not by a free repeatable probe — see
            docs/PLAN.md/STATE.md for the enumeration-safety reasoning.

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          description: Username or email — resolved the same way authLogin resolves either.

    ForgotPasswordResponse:
      type: object
      additionalProperties: false
      description: >-
        Deliberately empty — the fixed, content-free 202 body every call
        returns regardless of outcome (E3b/E8 anti-enumeration).

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        # F8 (fix wave): aligned with POST /setup/first-admin's own
        # minLength:8 — a deliberate tightening (this used to accept a
        # 1-char password); createUser/PATCH /users/me stay minLength:1,
        # out of scope.
        password: { type: string, format: password, minLength: 8 }

    AdminResetPasswordRequest:
      type: object
      additionalProperties: false
      description: >-
        R-F3 (opus adversarial review, fix wave): `currentPassword` is
        required ONLY when the path `id` equals the caller's own userId —
        a condition the schema itself cannot express (there is no
        same-as-caller relational operator in JSON Schema), so it is an
        optional property here and enforced server-side by the same
        requireCurrentPassword helper UpdateMeRequest/
        RestrictedSettingsUpdate use (target-agnostic 422/403, the shared
        per-user rate limiter). Ignored entirely when resetting ANOTHER
        user's password.
      properties:
        currentPassword:
          type: string
          format: password
          description: >-
            Current-password re-authentication for a SELF-reset. Deliberately
            UNCONSTRAINED, same reasoning as UpdateMeRequest.currentPassword:
            it proves an already-stored secret and is only ever compared
            against a stored hash, never itself stored.

    AdminResetPasswordResponse:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          description: Shown exactly once; the server retains only its hash.

    DeviceProfile:
      type: object
      description: >-
        Client-declared at login, server-validated against this schema.
        Never "best-guessed" when invalid — a
        malformed profile is rejected with 422, not patched inside plan().
      additionalProperties: false
      required:
        - profileId
        - directPlayContainers
        - hls
        - video
        - hdr
        - audio
        - subtitles
        - maxStreamBitrateBps
      properties:
        profileId: { type: string, description: "e.g. 'web-chrome', 'web-safari'" }
        directPlayContainers:
          type: array
          items: { $ref: '#/components/schemas/Container' }
        hls:
          type: object
          additionalProperties: false
          required: [container, supportsFmp4, lowLatency]
          properties:
            container: { type: string, enum: [fmp4, ts] }
            supportsFmp4: { type: boolean }
            lowLatency: { type: boolean }
        video:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - codec
              - maxProfile
              - maxLevel
              - maxBitDepth
              - maxWidth
              - maxHeight
              - maxFrameRate
              - maxBitrateBps
            properties:
              codec: { $ref: '#/components/schemas/VideoCodec' }
              maxProfile: { type: [string, 'null'] }
              maxLevel: { type: [number, 'null'] }
              maxBitDepth: { type: integer, enum: [8, 10] }
              maxWidth: { type: integer, minimum: 1 }
              maxHeight: { type: integer, minimum: 1 }
              maxFrameRate: { type: number, minimum: 0 }
              maxBitrateBps: { type: [integer, 'null'] }
        hdr:
          type: object
          additionalProperties: false
          required: [hdr10, hlg, dolbyVision]
          properties:
            hdr10: { type: boolean }
            hlg: { type: boolean }
            dolbyVision: { type: boolean }
        audio:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [codec, maxChannels, passthrough]
            properties:
              codec: { $ref: '#/components/schemas/AudioCodec' }
              maxChannels: { type: integer, minimum: 1 }
              passthrough:
                type: boolean
                description: Bitstream passthrough support (TrueHD/DTS-HD).
        subtitles:
          type: object
          additionalProperties: false
          required: [renderText, hlsVtt, renderImage]
          properties:
            renderText:
              type: array
              items: { $ref: '#/components/schemas/SubtitleCodec' }
            hlsVtt: { type: boolean }
            renderImage: { type: boolean }
        maxStreamBitrateBps:
          type: [integer, 'null']
          description: Device hard cap (e.g. TV SoC limits).

    DeviceKind:
      type: string
      enum: [app, remote]
      description: >-
        STATE.md "Loombre Remote", lane WG2, R2/RG3: 'app' (default —
        every login-created device) or 'remote' (admin-initiated WireGuard
        enrollment ONLY, POST /admin/remote/wireguard/devices — never the
        login path). ADDITIVE field on the devices-list Device schema
        (R2's "enrolled devices appear in the existing devices list
        (kind: remote)").

    Device:
      type: object
      additionalProperties: false
      required: [id, userId, name, kind, profileId, capabilityProfile, lastSeenAtMs, createdAtMs]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        profileId: { type: string }
        capabilityProfile:
          oneOf:
            - { $ref: '#/components/schemas/DeviceProfile' }
            - type: 'null'
        lastSeenAtMs: { type: integer, format: int64 }
        createdAtMs: { type: integer, format: int64 }

    DevicePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        nextCursor: { type: [string, 'null'] }

    # ═══════════════════════════════════ System ════════════════════════════════
    CapabilityFlag:
      type: string
      enum:
        - music
        - restricted-content
        - hls-ll
        - hw-transcode
        - remote-access
        - data-export
        - data-import

    CapabilityDetail:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        description: { type: [string, 'null'] }

    Capabilities:
      type: object
      additionalProperties: false
      required: [flags, details]
      properties:
        flags:
          type: array
          description: >-
            The enabled subset of `details`, compacted. Auth-scoped the same
            way: `restricted-content` never appears here for an
            unauthenticated caller, whatever the instance's live setting is.
          items: { $ref: '#/components/schemas/CapabilityFlag' }
        details:
          type: object
          description: >-
            Map of CapabilityFlag to its detail object. Every known flag is
            present for an authenticated caller. `restricted-content` is
            OPTIONAL: it is omitted entirely for an unauthenticated caller
            (see the operation description), so a client must read a missing
            key as "not disclosed to me", never as "disabled". Every other
            flag is always present.
          additionalProperties: { $ref: '#/components/schemas/CapabilityDetail' }
        passwordResetAvailable:
          type: boolean
          description: >-
            M8 — true iff self-service "forgot password" (authForgotPassword/
            authResetPassword) is usable on this instance: mail is
            configured (a generic SMTP transport with host/from-address/
            public-URL all set — credentials optional). Additive; always
            sent (never omitted). The login screen shows a "forgot
            password" affordance only when this is true.

    ServerPowerActionResponse:
      type: object
      additionalProperties: false
      required: [accepted, action]
      properties:
        # Mirrors the controller-IPC lifecycle response shape ({accepted,
        # state}) in spirit; `accepted: true` is the only value a 2xx ever
        # carries — refusals are RFC 9457 problems, never accepted:false.
        accepted: { type: boolean, enum: [true] }
        action: { type: string, enum: [restart, shutdown] }

    SystemInfo:
      type: object
      additionalProperties: false
      required: [version, os, tier]
      properties:
        version: { type: string }
        os: { type: string, enum: [linux, macos, windows] }
        tier: { type: integer, enum: [0, 1, 2] }
        nodeVersion: { type: [string, 'null'] }
        uptimeMs: { type: [integer, 'null'], format: int64 }
        # Wave 1c addition (STATE.md Phosphor retheme, contract enablers
        # lane), NOT in `required` above — additive-only, older clients
        # ignore it safely; getSystemInfo always sends this key regardless
        # (same posture as the LPP W5b AdminPlugin additions), never omits
        # it. Sidebar "POOL" meter (design/phosphor README Shell spec).
        # Cheap fs.statfs syscalls only (CLAUDE.md invariant 9, Tier-0
        # rule) — one per DISTINCT filesystem a library root lives on,
        # deduped by device id, never one per library. Null when there are
        # no libraries yet, or every probe failed (missing mount,
        # permission denied) — the client hides the meter rather than
        # rendering fabricated zeros (U9).
        storagePool:
          oneOf:
            - { $ref: '#/components/schemas/StoragePoolStats' }
            - { type: 'null' }

    StoragePoolStats:
      type: object
      additionalProperties: false
      required: [usedBytes, totalBytes]
      properties:
        usedBytes: { type: integer, format: int64, minimum: 0 }
        totalBytes: { type: integer, format: int64, minimum: 0 }

    SystemUpdateVerification:
      type: string
      description: >-
        `verified`: the fetched manifest's minisign signature checked out
        against the pinned public key and `latestVersion`/
        `notesUrl` reflect it. `signature-invalid`: a manifest was fetched
        but its signature did not verify (tampered, wrong key, or an
        unsupported prehashed-'ED' minisig — @loombre/release-manifest's
        closed failure-reason set collapses to this one contract value).
        `unreachable`: the manifest mirror could not be reached, returned a
        non-2xx status, or returned a response that wasn't a well-formed
        manifest for this server's channel. `disabled`:
        LOOMBRE_UPDATE_CHECK=off — no network request was made.
      enum: [verified, signature-invalid, unreachable, disabled]

    SystemUpdateInfo:
      type: object
      additionalProperties: false
      required: [currentVersion, channel, latestVersion, updateAvailable, notesUrl, checkedAtMs, verification]
      properties:
        currentVersion: { type: string, description: This server build's own version (matches SystemInfo.version). }
        channel: { type: string, description: 'Release channel this server tracks (single member today: "stable").' }
        latestVersion:
          type: [string, 'null']
          description: Null unless verification is "verified" and the manifest lists at least one release.
        updateAvailable: { type: boolean }
        notesUrl:
          type: [string, 'null']
          description: The latest release's notes URL; null under the same conditions as latestVersion.
        checkedAtMs:
          type: [integer, 'null']
          format: int64
          description: When this result was produced; null only when verification is "disabled" (no check ever ran).
        verification: { $ref: '#/components/schemas/SystemUpdateVerification' }

    # ═══════════════════ First-boot setup (P4.6/P4.10) ═══════════════════════
    SetupState:
      type: object
      additionalProperties: false
      required: [needsSetup]
      properties:
        needsSetup:
          type: boolean
          description: True iff the users table is empty (first boot / restored-empty instance).

    FirstAdminRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: [string, 'null'] }

    FirstAdminResponse:
      type: object
      additionalProperties: false
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    # ═══════════ Admin: capability report / crash files / logs (P4.5/D) ══════
    CapabilityBackend:
      type: object
      additionalProperties: false
      required: [name, position, decode, encode, toneMap]
      properties:
        name:
          type: string
          description: Backend identifier as probed (videotoolbox, nvenc, qsv, vaapi, amf, d3d11va, software — closed set enforced by the DB CHECK, mirrored not re-enumerated here so a new backend is additive).
        position:
          type: integer
          minimum: 0
          description: Probe order (docs/PLAYBACK.md §8.2 — array order is load-bearing for the plan engine).
        decode: { type: array, items: { type: string } }
        encode: { type: array, items: { type: string } }
        toneMap: { type: array, items: { type: string } }

    CapabilityReport:
      type: object
      additionalProperties: false
      required: [platform, ffmpegBuildHash, gpuFingerprint, verifiedAtMs, backends]
      properties:
        platform: { type: string, enum: [linux, macos, windows] }
        ffmpegBuildHash:
          type: string
          description: sha256 of the resolved ffmpeg's -version output (the capability report's invalidation key).
        gpuFingerprint:
          type: [string, 'null']
          description: Best-effort GPU identity hash; null when the per-platform probe command failed.
        verifiedAtMs: { type: integer, format: int64 }
        backends:
          type: array
          items: { $ref: '#/components/schemas/CapabilityBackend' }

    CapabilityReportEnvelope:
      type: object
      additionalProperties: false
      required: [report, probe]
      properties:
        report:
          oneOf:
            - { $ref: '#/components/schemas/CapabilityReport' }
            - { type: 'null' }
          description: >-
            Null until a self-test snapshot exists — probe.status distinguishes
            never-ran / pending / failed. A non-null report whose backends
            verified zero capabilities is a VALID software-everything state
            (software decode/encode/tone-mapping), not an error.
        probe:
          $ref: '#/components/schemas/CapabilityProbeStatus'

    CapabilityProbeStatus:
      type: object
      additionalProperties: false
      required: [status, lastError, updatedAtMs]
      properties:
        status:
          type: string
          enum: [never-ran, pending, failed, completed]
          description: >-
            Lifecycle of the worker's hardware-capability self-test.
            completed = the report reflects the latest self-test — including
            the valid zero-accelerated-backends outcome (software
            everything). pending = a self-test job is queued or running; a
            previous report may still be present alongside it (re-probe
            after an ffmpeg/GPU change). failed = the most recent self-test
            job failed (lastError carries the job error); any report shown
            is from an earlier successful run. never-ran = no snapshot and
            no self-test job on record.
        lastError:
          type: ['string', 'null']
          description: >-
            The failed self-test job's error message; null unless status is
            'failed'.
        updatedAtMs:
          type: ['integer', 'null']
          format: int64
          description: >-
            When the underlying signal last changed (self-test job ledger row,
            or the snapshot's verifiedAtMs once completed); null when status
            is 'never-ran'.

    CrashFile:
      type: object
      additionalProperties: false
      required: [name, sizeBytes, mtimeMs]
      properties:
        name:
          type: string
          description: Basename only — pass verbatim to getCrashFile; never a path.
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        mtimeMs: { type: integer, format: int64 }

    DirectoryEntry:
      type: object
      additionalProperties: false
      required: [name, path, readable]
      properties:
        name:
          type: string
          description: The directory's own name (its last path segment).
        path:
          type: string
          description: >-
            Absolute path, ready to pass straight back as this endpoint's
            `path` parameter or to use as a library path. Built by the
            server so the client never has to join path segments itself and
            get the separator wrong on the other platform.
        readable:
          type: boolean
          description: >-
            Whether the server itself can descend into this directory.
            False means a follow-up listing of `path` will fail with 403 —
            the service account lacks read permission (the normal state of
            personal home folders under the macOS/Linux installers, whose
            services run as a dedicated least-privilege account). Clients
            should render such entries dimmed/marked rather than hiding
            them, so an operator can see the folder exists and either fix
            its permissions or choose another location.

    DirectoryListing:
      type: object
      additionalProperties: false
      required: [path, parent, entries]
      properties:
        path:
          type: [string, 'null']
          description: >-
            The directory that was listed, or null for the roots listing
            (no `path` parameter was supplied).
        parent:
          type: [string, 'null']
          description: >-
            Absolute path one level up, or null when already at a root.
            Supplied by the server because "the parent of this path" is a
            platform-specific question the client should not answer.
        entries:
          type: array
          items: { $ref: '#/components/schemas/DirectoryEntry' }
          description: >-
            Immediate subdirectories, name-sorted. Entries that cannot even
            be identified as directories (broken symlinks, un-statable link
            targets) are omitted; directories the server can see but not
            open are included with `readable: false` — one unreadable
            system directory must not make a browsable parent
            un-browsable, and hiding it would misrepresent the filesystem.

    FilesystemPermissionRemediation:
      type: object
      description: >-
        Optional `remediation` extension member on the Problem body returned
        by GET /admin/filesystem/directories when `code:
        "filesystem-permission-denied"` AND the server has a scripted grant
        recipe for the platform it's actually running on (macOS
        service-account installs today; Linux/dev/container installs have
        none yet — chown-based advice is too destructive to script blindly).
        When present, clients should render this instead of the bare
        `detail` paragraph: `summary` as a one-line message, `commands` as a
        copyable, ordered command block pre-filled with the real path, and
        `verify` as the command that proves the grant worked. Clients MUST
        fall back to rendering `detail` verbatim when `remediation` is
        absent — this member is an additive RFC 9457 extension (`Problem`
        already declares `additionalProperties: true`), never a replacement
        for `detail`.
      additionalProperties: false
      required: [summary, commands, verify]
      properties:
        summary:
          type: string
          description: >-
            One short sentence naming the blocked service account (e.g.
            "Loombre's service account (_loombre) can't read this folder.").
        commands:
          type: array
          items: { type: string }
          description: >-
            Shell commands to run, in order, pre-filled with the real
            requested path — paste-ready, nothing left for the operator to
            fill in.
        verify:
          type: string
          description: >-
            A single command that proves the grant worked (re-lists the same
            path as the service account).

    CrashFileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CrashFile' }
          description: Newest first; bounded by the crash writer's retention cap.

    LogTail:
      type: object
      additionalProperties: false
      required: [source, lines]
      properties:
        source:
          type: [string, 'null']
          description: Basename of the tailed file; null when LOOMBRE_LOG_FILE is unconfigured (lines is then empty).
        lines:
          type: array
          items: { type: string }

    # ═══════════════════════════════════ Users ═════════════════════════════════
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - isAdmin
        - birthDate
        - maxContentRating
        - createdAtMs
        - updatedAtMs
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: >-
            M1: optional login identifier — an additive LOOSENING (the
            column was CITEXT NOT NULL UNIQUE before; still CITEXT UNIQUE,
            just nullable now). Null = no email on file; the user
            authenticates by username only.
        displayName: { type: [string, 'null'] }
        isAdmin: { type: boolean }
        birthDate:
          type: [string, 'null']
          format: date
          description: Basis for age-rating limits (docs/PLAN.md §6.3); null = not set.
        maxContentRating:
          type: [string, 'null']
          description: Admin-set ceiling on servable content rating (e.g. a kid profile capped at PG).
        createdAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }
        mustChangePassword:
          type: boolean
          description: >-
            E3a/M14, admin visibility — true iff an admin/CLI temporary-
            password reset is pending a real password change. Additive;
            always sent (never omitted).

    UserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        nextCursor: { type: [string, 'null'] }

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: 'M1: optional (was required) — an admin may create an email-less user.'
        password: { type: string, format: password, minLength: 1 }
        displayName: { type: [string, 'null'] }
        isAdmin: { type: boolean, default: false }
        maxContentRating: { type: [string, 'null'] }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      description: Admin update of another user. Partial; only present fields change.
      properties:
        email:
          type: [string, 'null']
          format: email
          description: 'M1: null clears the email, matching displayName''s own null-to-clear shape below.'
        displayName: { type: [string, 'null'] }
        isAdmin: { type: boolean }
        maxContentRating: { type: [string, 'null'] }

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: Self-service profile update; cannot change isAdmin or maxContentRating.
      properties:
        displayName: { type: [string, 'null'] }
        email:
          type: [string, 'null']
          format: email
          description: 'M1: null-to-clear (birthDate precedent below).'
        birthDate: { type: [string, 'null'], format: date }
        password: { type: string, format: password, minLength: 1 }
        currentPassword:
          type: string
          format: password
          description: >-
            Current-password re-authentication (G2/G3, STATE.md
            "Current-password re-auth on self-changes"). Required
            (`dependentRequired` below) whenever this request's body
            contains `password` and/or `email` — ANY value, including an
            explicit `null` to clear email — since both are account-
            critical self-service changes; a bare displayName/birthDate-
            only profile save needs no re-auth. Deliberately UNCONSTRAINED,
            same reasoning as RestrictedSettingsUpdate.currentPin below: it
            proves an ALREADY-STORED secret and is only ever compared
            against a stored hash, never itself stored, so a shape
            constraint would add nothing. A wrong value 403s with the same
            fixed detail regardless of which field (password or email) was
            being changed (F2: never confirms which target value was the
            problem).
      dependentRequired:
        password: [currentPassword]
        email: [currentPassword]

    UserSettings:
      type: object
      additionalProperties: false
      required:
        - restrictedOptIn
        - locale
        - theme
        - subtitlePreferredLanguage
        - audioPreferredLanguage
        - autoplayNextEpisode
        - updatedAtMs
      properties:
        restrictedOptIn:
          type: boolean
          description: Read-only mirror here; changed only via PUT /users/me/restricted.
          readOnly: true
        locale: { type: string, minLength: 1, maxLength: 35 }
        theme: { type: string, enum: [light, dark, system] }
        subtitlePreferredLanguage:
          type: [string, 'null']
          minLength: 3
          maxLength: 3
          pattern: '^[a-z]{3}$'
          description: >-
            ISO 639-2 (lowercase 3-letter code, e.g. "eng"), or null for no
            preference. Server-side membership in the known-language list
            is validated beyond this
            shape (the shape alone cannot
            express "a real language code").
        audioPreferredLanguage:
          type: [string, 'null']
          minLength: 3
          maxLength: 3
          pattern: '^[a-z]{3}$'
          description: >-
            ISO 639-2 (lowercase 3-letter code, e.g. "eng"), or null for no
            preference. Same known-language-list validation as
            subtitlePreferredLanguage above.
        autoplayNextEpisode: { type: boolean }
        updatedAtMs: { type: integer, format: int64 }

    # ═══════════════════════════════════ Invites (E2) ══════════════════════════
    InviteStatus:
      type: string
      enum: [pending, claimed, revoked, expired]
      description: Derived at read time from claimedAtMs/revokedAtMs/expiresAtMs — never stored.

    Invite:
      type: object
      additionalProperties: false
      description: Admin-facing invite record. NEVER carries token material.
      required:
        - id
        - createdByUserId
        - createdAtMs
        - expiresAtMs
        - usernamePreset
        - displayNamePreset
        - email
        - libraryIds
        - status
        - claimedByUserId
        - claimedAtMs
        - revokedAtMs
      properties:
        id: { type: string, format: uuid }
        createdByUserId: { type: string, format: uuid }
        createdAtMs: { type: integer, format: int64 }
        expiresAtMs: { type: integer, format: int64 }
        usernamePreset: { type: [string, 'null'] }
        displayNamePreset: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        libraryIds:
          type: array
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InviteStatus' }
        claimedByUserId: { type: [string, 'null'], format: uuid }
        claimedAtMs: { type: [integer, 'null'], format: int64 }
        revokedAtMs: { type: [integer, 'null'], format: int64 }

    InvitePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invite' }
        nextCursor: { type: [string, 'null'] }

    CreateInviteRequest:
      type: object
      additionalProperties: false
      required: [libraryIds]
      properties:
        username: { type: string, minLength: 1, description: Username preset — authoritative at claim time (preset wins). }
        displayName: { type: [string, 'null'] }
        email:
          type: string
          format: email
          description: Send-to address AND claim-time email default. If mail is configured, the invite email is sent here.
        expiresInMs:
          type: integer
          format: int64
          minimum: 3600000
          maximum: 2592000000
          default: 259200000
          description: Bounds 1h-30d; default 72h.
        libraryIds:
          type: array
          items: { type: string, format: uuid }
          description: >-
            General-class libraries only (M4) — a restricted-class or
            unknown library id 422s the whole request; may be empty.

    CreateInviteResponse:
      type: object
      additionalProperties: false
      description: claimToken is returned EXACTLY ONCE — never retrievable again, never logged, never in any event payload (M3).
      required: [invite, claimToken, claimUrl]
      properties:
        invite: { $ref: '#/components/schemas/Invite' }
        claimToken: { type: string }
        claimUrl:
          type: [string, 'null']
          description: >-
            publicUrl-derived claim link, or null when the public URL
            setting is unset (M9) — the web composes a browser-origin
            fallback in that case.

    ClaimState:
      type: object
      additionalProperties: false
      required: [usernamePreset, displayNamePreset, emailPreset]
      properties:
        usernamePreset: { type: [string, 'null'] }
        displayNamePreset: { type: [string, 'null'] }
        emailPreset: { type: [string, 'null'] }

    ClaimInviteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        username:
          type: string
          minLength: 1
          description: Required iff the invite has no usernamePreset; the preset wins if both are present.
        # F8 (fix wave): aligned with POST /setup/first-admin's own
        # minLength:8 — a deliberate tightening (claim used to accept a
        # 1-char password); createUser/PATCH /users/me stay minLength:1,
        # out of scope.
        password: { type: string, format: password, minLength: 8 }
        email:
          type: [string, 'null']
          format: email
          description: >-
            Defaults to the invite's own emailPreset when this member is
            ABSENT. LD-13b (STATE.md "Mail posture trio"): an explicit
            `null` opts OUT of the preset outright — the new account gets
            no email at all, even when the invite carries a preset —
            distinct from omitting the member. A submitted string is used
            verbatim (trimmed, then format-validated).
        displayName: { type: string, description: Defaults to the invite's own displayNamePreset when omitted. }
        deviceName: { type: string }
        deviceProfile: { $ref: '#/components/schemas/DeviceProfile' }

    RestrictedSettingsUpdate:
      type: object
      additionalProperties: false
      required: [optIn, currentPassword]
      properties:
        optIn: { type: boolean }
        pin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^[0-9]{4}$'
          description: >-
            New PIN to set (required when enabling opt-in or changing PIN).
            Exactly 4 digits: the unlock prompt is a fixed 4-digit buffer,
            so a PIN of any other length could never be entered again and
            would lock the user out of restricted content permanently.
        currentPin:
          type: string
          description: >-
            Required to change an existing PIN or to opt out. Proves an
            ALREADY-STORED PIN and is therefore DELIBERATELY not length- or
            pattern-constrained: an install predating the 4-digit rule above
            may hold a PIN of some other length, and this field is that
            user's only recovery path (prove the old PIN, set a conforming
            new one, or opt out). It is only ever compared against a stored
            hash, never stored, so the looser shape widens nothing.
        currentPassword:
          type: string
          format: password
          description: >-
            Current-password re-authentication (G2/G3, STATE.md
            "Current-password re-auth on self-changes"). ALWAYS required —
            every call to this endpoint is account-critical (PIN set/change
            AND opt-in/out are one operation, F1). Deliberately
            UNCONSTRAINED, same reasoning as currentPin above: it proves an
            already-stored secret and is only ever compared against a
            stored hash, never itself stored. Distinct from currentPin —
            proving the account password does not replace proving the PIN
            where the PIN itself is also required (F4: "currentPassword is
            additional, not a PIN replacement").

    RestrictedSettings:
      type: object
      additionalProperties: false
      required: [optIn, hasPin, unlockedUntilMs]
      properties:
        optIn: { type: boolean }
        hasPin: { type: boolean }
        unlockedUntilMs: { type: [integer, 'null'], format: int64 }

    # ═══════════════════ System notices (admin broadcast) ═════════════════════
    NoticeSeverity:
      type: string
      enum: [info, warning, critical]
      description: >-
        info -> auto-dismiss toast; warning -> persistent, per-session-
        dismissible banner; critical -> persistent, NOT dismissible banner.
        Governs the expiry defaults on POST /system/notices (see that
        operation's own description).

    SystemNotice:
      type: object
      additionalProperties: false
      description: >-
        The all-user broadcast shape — delivered as notice.published's
        payload AND as GET /notices/active's `notice` field. Deliberately
        excludes createdBy/any admin-identity field (plain-content
        posture: every user sees this, never who published it).
      required: [id, message, severity, effectiveAtMs, expiresAtMs, createdAtMs]
      properties:
        id: { type: string, format: uuid }
        message: { type: string, maxLength: 500 }
        severity: { $ref: '#/components/schemas/NoticeSeverity' }
        effectiveAtMs:
          type: [integer, 'null']
          format: int64
          description: >-
            The countdown target ("restarting at this time"), absolute ms.
            Null when this notice carries no scheduled moment.
        expiresAtMs:
          type: [integer, 'null']
          format: int64
          description: Absolute ms this notice stops being active. Null means "until cancelled" (legal only for severity=critical).
        createdAtMs: { type: integer, format: int64 }

    SystemNoticeAdmin:
      type: object
      additionalProperties: false
      description: The all-user SystemNotice shape plus admin-only history fields.
      required:
        - id
        - message
        - severity
        - effectiveAtMs
        - expiresAtMs
        - createdAtMs
        - createdBy
        - cancelledAtMs
        - status
      properties:
        id: { type: string, format: uuid }
        message: { type: string, maxLength: 500 }
        severity: { $ref: '#/components/schemas/NoticeSeverity' }
        effectiveAtMs: { type: [integer, 'null'], format: int64 }
        expiresAtMs: { type: [integer, 'null'], format: int64 }
        createdAtMs: { type: integer, format: int64 }
        createdBy: { type: [string, 'null'], format: uuid }
        cancelledAtMs: { type: [integer, 'null'], format: int64 }
        status:
          type: string
          enum: [active, cancelled, expired]
          description: Derived at read time from cancelledAtMs/expiresAtMs — never stored.

    SystemNoticePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemNoticeAdmin' }
        nextCursor: { type: [string, 'null'] }

    PublishSystemNoticeRequest:
      type: object
      additionalProperties: false
      required: [message, severity]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        severity: { $ref: '#/components/schemas/NoticeSeverity' }
        effectiveInMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000000
          description: >-
            RELATIVE ms from now (NOT an absolute timestamp) — the server
            anchors it to its own clock. Omit for a notice with no
            scheduled countdown moment. Capped at 365 days
            (31536000000 ms) — a notice scheduled further out than that
            is a mistake, not a plan.
        expiresInMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000000
          description: >-
            RELATIVE ms from now. Required for severity=warning (422 when
            absent). Optional for severity=info (defaults to 1 hour).
            Optional for severity=critical (omitted = until cancelled).
            Capped at 365 days (31536000000 ms).

    ActiveSystemNoticeResponse:
      type: object
      additionalProperties: false
      required: [notice, serverNowMs]
      properties:
        notice:
          oneOf:
            - { $ref: '#/components/schemas/SystemNotice' }
            - type: 'null'
        serverNowMs:
          type: integer
          format: int64
          description: >-
            The server's clock at response time (NG3's anchor) — clients
            compute `offset = serverNowMs - Date.now()` at receipt and
            render any countdown against `effectiveAtMs - (Date.now() +
            offset)`, never their own wall clock alone.

    # ═══════════════════════════════ Libraries ═══════════════════════════════
    Library:
      type: object
      additionalProperties: false
      required: [id, name, mediaKind, paths, contentClass, createdAtMs, updatedAtMs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mediaKind: { $ref: '#/components/schemas/MediaKind' }
        paths:
          type: array
          items: { type: string }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        createdAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }
        # Wave 1c addition (STATE.md Phosphor retheme, contract enablers
        # lane), NOT in `required` above — additive-only, older clients
        # ignore it safely; every route that returns Library always sends
        # it regardless, never omits it (same posture as the LPP W5b
        # AdminPlugin additions). Derived, never stored (U9): the "headline"
        # item count for this library's mediaKind (movie->movie count,
        # tv->series count, music->album count), computed per-request
        # through packages/db's ViewerContext guard — a general viewer's
        # count for a general library never includes restricted-zone
        # titles, and this field is simply absent from the response for any
        # library row a viewer's guard would already exclude from the list/
        # get response in the first place (restricted libraries stay
        # governed by the existing gate-5 visibility rule on GET
        # /libraries[/{id}] itself).
        itemCount: { type: integer, format: int64, minimum: 0 }

    LibraryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Library' }
        nextCursor: { type: [string, 'null'] }

    CreateLibraryRequest:
      type: object
      additionalProperties: false
      required: [name, mediaKind, paths]
      properties:
        name: { type: string }
        mediaKind: { $ref: '#/components/schemas/MediaKind' }
        paths:
          type: array
          items: { type: string }
          minItems: 1
        contentClass: { $ref: '#/components/schemas/ContentClass' }

    UpdateLibraryRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        paths:
          type: array
          items: { type: string }
          minItems: 1

    ScanLibraryRequest:
      type: object
      additionalProperties: false
      properties:
        full:
          type: boolean
          default: false
          description: Full rescan vs. incremental (default).

    LibraryPermission:
      type: object
      additionalProperties: false
      required: [userId, granted]
      properties:
        userId: { type: string, format: uuid }
        granted: { type: boolean }

    LibraryPermissionSet:
      type: object
      additionalProperties: false
      required: [libraryId, permissions]
      properties:
        libraryId: { type: string, format: uuid }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/LibraryPermission' }

    # ═══════════════════════════ Catalog: shared base ══════════════════════════
    CatalogItemBase:
      type: object
      required:
        - id
        - libraryId
        - itemType
        - title
        - sortTitle
        - year
        - communityRating
        - contentClass
        - addedAtMs
        - updatedAtMs
      properties:
        id: { type: string, format: uuid }
        libraryId: { type: string, format: uuid }
        itemType: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        sortTitle: { type: string }
        year: { type: [integer, 'null'] }
        communityRating: { type: [number, 'null'], minimum: 0, maximum: 10 }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        addedAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }

    # Gap-closure lane (deliverable D: "Item detail: metadata, people,
    # versions, play") — mirrors packages/db's item_people/media_files rows.
    # Both PersonRole/PersonCredit and MediaFileSummary are additive: an
    # optional `people`/`mediaFiles` array is added to the relevant item
    # schemas below (movie/series/episode/artist for people; movie/episode/
    # track for mediaFiles), only ever populated by the single-item GET
    # (getMovie/getSeries/... — see packages/db/src/query/catalog-detail.ts's
    # includeDetail param), omitted (not null) on list responses to keep
    # Tier-0 list-page cost unchanged.
    PersonRole:
      type: string
      enum: [actor, director, writer, artist, album_artist, performer, guest]

    PersonCredit:
      description: >-
        Mirrors item_people/people (packages/db/migrations/0001_init.sql):
        `id` is the credited PERSON's id (not the item_people join-row id),
        so a client can link straight to GET /people/{id}. Restricted-class
        people are never credited on a visible general item's response —
        the same content_class join-guard search.ts/catalog-detail.ts
        already use for tags applies here.
      type: object
      additionalProperties: false
      required: [id, name, role, order]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/PersonRole' }
        credit: { type: [string, 'null'], description: 'e.g. character name ("as Batman").' }
        order: { type: integer, minimum: 0 }

    MediaFileAudioTrack:
      description: >-
        One probed audio stream on a MediaFileSummary (what the
        movie-detail METADATA "Audio" row displays).
      type: object
      additionalProperties: false
      required: [codec, channels, language, isDefault]
      properties:
        codec: { $ref: '#/components/schemas/AudioCodec' }
        channels: { type: [integer, 'null'], minimum: 1 }
        language: { type: [string, 'null'], description: ISO 639-2 }
        isDefault: { type: boolean }

    MediaFileSubtitleTrack:
      description: >-
        One media_streams subtitle row on a MediaFileSummary (movie-detail
        METADATA "Subtitles" row — packages/db's
        MediaFileSubtitleTrackSummary).
      type: object
      additionalProperties: false
      required: [language, isForced]
      properties:
        language: { type: [string, 'null'] }
        isForced: { type: boolean }

    MediaFileSummary:
      description: >-
        One media_files row (packages/db/migrations/0001_init.sql), for the
        version/edition picker (multi-version/multi-part items, §8.1) and
        diagnosability. `width`/`height` come from that file's primary video
        stream (media_streams) and are null for audio-only files or files
        not yet probed. `path`/`isDefault`/`videoCodec`/`bitDepth`/`hdr`/
        `audioTracks`/`subtitleTracks` (the movie-detail VERSIONS
        + METADATA cards) are the same additive, already-probed columns —
        real columns already written by the scanner, newly exposed, nothing
        derived or invented. Deliberately NOT in `required`, unlike the
        original seven fields: this schema doubles as POST /import's
        ExportArchive request body (data-freedom.controller.ts), and an
        archive written by an older Loombre version won't carry them —
        making them required would be a breaking contract change for that
        import path (oasdiff-caught). GET /movies|episodes|tracks/{id}
        always populates every one of them; only a foreign/older import
        payload may omit them.
      type: object
      additionalProperties: false
      required: [id, versionLabel, container, width, height, sizeBytes, durationMs]
      properties:
        id: { type: string, format: uuid }
        versionLabel: { type: [string, 'null'] }
        container:
          type: [string, 'null']
          enum: [mp4, mkv, webm, avi, ts, mov, flac, mp3, ogg, m4a, wav, asf, mpeg, flv, aac, aiff, null]
          description: Null until the file has been probed.
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        sizeBytes: { type: [integer, 'null'], format: int64 }
        durationMs: { type: [integer, 'null'], format: int64 }
        path:
          type: string
          description: >-
            Full on-disk path (media_files.path). Read-only diagnosability
            (docs/PLAN.md §8.4's MediaInfo precedent), same visibility level
            as the rest of this object — never a write target.
        isDefault:
          type: boolean
          description: >-
            True for the item's primary/default file — the unlabelled row
            if one exists, else the earliest-ingested (lowest id) among the
            item's files. Derived per request, not a stored column (no
            multi-version item exists that would make it ambiguous today).
        videoCodec:
          oneOf:
            - $ref: '#/components/schemas/VideoCodec'
            - type: 'null'
          description: Null for audio-only files or files not yet probed.
        bitDepth:
          type: [integer, 'null']
          enum: [8, 10, 12, null]
        hdr:
          oneOf:
            - $ref: '#/components/schemas/HdrType'
            - type: 'null'
          description: Null alongside videoCodec/bitDepth for the same files.
        audioTracks:
          type: array
          items: { $ref: '#/components/schemas/MediaFileAudioTrack' }
        subtitleTracks:
          type: array
          items: { $ref: '#/components/schemas/MediaFileSubtitleTrack' }

    Movie:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, contentRating, runtimeMs, overview, genres]
          properties:
            itemType: { type: string, const: movie }
            contentRating: { type: [string, 'null'] }
            # Nullable: derived from the media file probe; null until probed.
            runtimeMs: { type: [integer, 'null'], format: int64 }
            overview: { type: [string, 'null'] }
            tagline: { type: [string, 'null'] }
            genres:
              type: array
              items: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
            people:
              type: array
              items: { $ref: '#/components/schemas/PersonCredit' }
              description: Only populated by GET /movies/{id}; absent on list responses.
            mediaFiles:
              type: array
              items: { $ref: '#/components/schemas/MediaFileSummary' }
              description: Only populated by GET /movies/{id}; absent on list responses.
      unevaluatedProperties: false

    MoviePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Movie' }
        nextCursor: { type: [string, 'null'] }

    Series:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, contentRating, overview, status, genres]
          properties:
            itemType: { type: string, const: series }
            contentRating: { type: [string, 'null'] }
            overview: { type: [string, 'null'] }
            # Nullable: from the metadata provider; null until known.
            status: { type: [string, 'null'], enum: [continuing, ended, cancelled, null] }
            genres:
              type: array
              items: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
            people:
              type: array
              items: { $ref: '#/components/schemas/PersonCredit' }
              description: Only populated by GET /series/{id}; absent on list responses.
      unevaluatedProperties: false

    SeriesPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Series' }
        nextCursor: { type: [string, 'null'] }

    Season:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, seriesId, seasonNumber]
          properties:
            itemType: { type: string, const: season }
            seriesId: { type: string, format: uuid }
            seasonNumber: { type: integer, minimum: 0 }
            episodeCount: { type: [integer, 'null'] }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
      unevaluatedProperties: false

    SeasonPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Season' }
        nextCursor: { type: [string, 'null'] }

    Episode:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, seasonId, seriesId, episodeNumber, runtimeMs, overview]
          properties:
            itemType: { type: string, const: episode }
            seasonId: { type: string, format: uuid }
            seriesId: { type: string, format: uuid }
            episodeNumber: { type: integer, minimum: 0 }
            # Nullable: derived from the media file probe; null until probed.
            runtimeMs: { type: [integer, 'null'], format: int64 }
            overview: { type: [string, 'null'] }
            airDateMs: { type: [integer, 'null'], format: int64 }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
            people:
              type: array
              items: { $ref: '#/components/schemas/PersonCredit' }
              description: Only populated by GET /episodes/{id}; absent on list responses.
            mediaFiles:
              type: array
              items: { $ref: '#/components/schemas/MediaFileSummary' }
              description: Only populated by GET /episodes/{id}; absent on list responses.
      unevaluatedProperties: false

    EpisodePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Episode' }
        nextCursor: { type: [string, 'null'] }

    ChapterMarker:
      description: >-
        One chapter_markers row (migrations/0019, S7/K9) — GET
        /items/{id}/chapters and RestrictedSceneDetail.chapters both use
        this exact shape.
      type: object
      additionalProperties: false
      required: [title, startMs, source]
      properties:
        title: { type: string }
        startMs: { type: integer, format: int64, minimum: 0 }
        source:
          type: string
          enum: [stash]
          description: The producer that wrote this marker (chapter_markers.source).

    ItemChapters:
      description: >-
        GET /items/{id}/chapters — a small, complete, already-ordered list
        (never large enough to need cursor pagination, unlike this
        contract's other list endpoints).
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChapterMarker' }
          description: Ordered by startMs ascending.

    Artist:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, overview, genres]
          properties:
            itemType: { type: string, const: artist }
            overview: { type: [string, 'null'] }
            genres:
              type: array
              items: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
            people:
              type: array
              items: { $ref: '#/components/schemas/PersonCredit' }
              description: Only populated by GET /artists/{id}; absent on list responses.
      unevaluatedProperties: false

    ArtistPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Artist' }
        nextCursor: { type: [string, 'null'] }

    Album:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, artistId, genres]
          properties:
            itemType: { type: string, const: album }
            artistId: { type: string, format: uuid }
            trackCount: { type: [integer, 'null'] }
            genres:
              type: array
              items: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
      unevaluatedProperties: false

    AlbumPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Album' }
        nextCursor: { type: [string, 'null'] }

    Track:
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, albumId, artistId, trackNumber, durationMs]
          properties:
            itemType: { type: string, const: track }
            albumId: { type: string, format: uuid }
            artistId: { type: string, format: uuid }
            # Nullable: from embedded tags; may be absent on untagged files.
            trackNumber: { type: [integer, 'null'], minimum: 1 }
            discNumber: { type: [integer, 'null'], minimum: 1 }
            # Nullable: derived from the media file probe; null until probed.
            durationMs: { type: [integer, 'null'], format: int64 }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
              description: >-
                Always present; empty array when no images have been ingested
                yet (Tier-0 rule — never computed on request). Not
                request-required (additive-only: POST /import's ExportArchive
                reuses these same entity schemas as a request body).
            mediaFiles:
              type: array
              items: { $ref: '#/components/schemas/MediaFileSummary' }
              description: Only populated by GET /tracks/{id}; absent on list responses.
      unevaluatedProperties: false

    TrackPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        nextCursor: { type: [string, 'null'] }

    # ═══════════════════════════ People / tags (P1.17) ═════════════════════════
    Person:
      description: >-
        Fields mirror packages/db's guarded PersonRow exactly (id, name,
        contentClass, creditCount) — see packages/db/src/query/people.ts.
        creditCount is DISTINCT items visible to the caller this person is
        credited on, never a raw credit-row count.
      type: object
      additionalProperties: false
      required: [id, name, contentClass, creditCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        creditCount: { type: integer, minimum: 0 }

    PersonPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Person' }
        nextCursor: { type: [string, 'null'] }

    # Phosphor Wave 2 lane L3 (/people/[id] route) — gap-closure: Person
    # above (getPersonById) only ever carried creditCount, never the actual
    # credited items a filmography grid needs. itemType is restricted to
    # movie/series/episode/artist — the only types PersonCredit is ever
    # attached to on the item side (packages/contract/openapi.yaml's own
    # Movie/Series/Episode/Artist `people` fields); Season/Album/Track never
    # carry a `people` array and so never appear here either.
    PersonItemEntry:
      type: object
      additionalProperties: false
      required: [itemType, item]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        item:
          oneOf:
            - { $ref: '#/components/schemas/Movie' }
            - { $ref: '#/components/schemas/Series' }
            - { $ref: '#/components/schemas/Episode' }
            - { $ref: '#/components/schemas/Artist' }
          discriminator:
            propertyName: itemType
            mapping:
              movie: '#/components/schemas/Movie'
              series: '#/components/schemas/Series'
              episode: '#/components/schemas/Episode'
              artist: '#/components/schemas/Artist'

    PersonItemPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonItemEntry' }
        nextCursor: { type: [string, 'null'] }

    Tag:
      description: >-
        Fields mirror packages/db's guarded TagRow exactly (id, name,
        contentClass, itemCount) — see packages/db/src/query/tags.ts. A tag
        row carries no single `kind` of its own (kind lives on the item_tags
        edge); itemCount is scoped to the `kind` query param when supplied,
        otherwise counts DISTINCT visible items across both kinds.
      type: object
      additionalProperties: false
      required: [id, name, contentClass, itemCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        itemCount: { type: integer, minimum: 0 }

    TagPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        nextCursor: { type: [string, 'null'] }

    # ═══════════════════════════════ Cross-type ════════════════════════════════
    SearchResult:
      type: object
      additionalProperties: false
      required: [itemType, item]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        item:
          description: One of the catalog entity schemas, discriminated by itemType.
          oneOf:
            - { $ref: '#/components/schemas/Movie' }
            - { $ref: '#/components/schemas/Series' }
            - { $ref: '#/components/schemas/Artist' }
            - { $ref: '#/components/schemas/Album' }
            - { $ref: '#/components/schemas/Track' }
          discriminator:
            propertyName: itemType
            mapping:
              movie: '#/components/schemas/Movie'
              series: '#/components/schemas/Series'
              artist: '#/components/schemas/Artist'
              album: '#/components/schemas/Album'
              track: '#/components/schemas/Track'

    SearchResultPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        nextCursor: { type: [string, 'null'] }

    ContinueWatchingEntry:
      type: object
      additionalProperties: false
      required: [itemType, item, progress]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        item:
          oneOf:
            - { $ref: '#/components/schemas/Movie' }
            - { $ref: '#/components/schemas/Episode' }
            - { $ref: '#/components/schemas/Track' }
          discriminator:
            propertyName: itemType
            mapping:
              movie: '#/components/schemas/Movie'
              episode: '#/components/schemas/Episode'
              track: '#/components/schemas/Track'
        progress: { $ref: '#/components/schemas/Progress' }

    ContinueWatchingPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContinueWatchingEntry' }
        nextCursor: { type: [string, 'null'] }

    RecentlyAddedEntry:
      type: object
      additionalProperties: false
      required: [itemType, item]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        item:
          oneOf:
            - { $ref: '#/components/schemas/Movie' }
            - { $ref: '#/components/schemas/Series' }
            - { $ref: '#/components/schemas/Album' }
          discriminator:
            propertyName: itemType
            mapping:
              movie: '#/components/schemas/Movie'
              series: '#/components/schemas/Series'
              album: '#/components/schemas/Album'

    RecentlyAddedPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecentlyAddedEntry' }
        nextCursor: { type: [string, 'null'] }

    # ═══════════════════════════════ Watchlist ═════════════════════════════════
    # Phosphor Wave 2 lane L3 (design/phosphor README.md's /watchlist route,
    # Home "Your Watchlist" rail, and the movie/series/album detail-screen
    # toggle). itemType is restricted to movie/series/album, mirroring
    # RecentlyAddedEntry exactly — the only types the toggle can ever add
    # (see packages/db/src/query/watchlist.ts's header for why the
    # UNDERLYING table itself is not type-restricted, only this mapped
    # response).
    WatchlistEntry:
      type: object
      additionalProperties: false
      required: [itemType, item, addedAtMs]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        item:
          oneOf:
            - { $ref: '#/components/schemas/Movie' }
            - { $ref: '#/components/schemas/Series' }
            - { $ref: '#/components/schemas/Album' }
          discriminator:
            propertyName: itemType
            mapping:
              movie: '#/components/schemas/Movie'
              series: '#/components/schemas/Series'
              album: '#/components/schemas/Album'
        addedAtMs: { type: integer, format: int64 }

    WatchlistPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WatchlistEntry' }
        nextCursor: { type: [string, 'null'] }

    # ═══════════════════════════════ Progress ══════════════════════════════════
    Progress:
      type: object
      additionalProperties: false
      required: [itemId, positionMs, state, playCount, updatedAtMs]
      properties:
        itemId: { type: string, format: uuid }
        positionMs: { type: integer, format: int64, minimum: 0 }
        durationMs: { type: [integer, 'null'], format: int64 }
        state: { $ref: '#/components/schemas/ProgressState' }
        playCount: { type: integer, minimum: 0 }
        updatedAtMs: { type: integer, format: int64 }

    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [positionMs, state]
      properties:
        positionMs: { type: integer, format: int64, minimum: 0 }
        durationMs: { type: [integer, 'null'], format: int64 }
        state: { $ref: '#/components/schemas/ProgressState' }
        sessionId:
          type: string
          format: uuid
          description: >-
            Optional playback session id. When present, this
            write also heartbeats that session (docs/PLAYBACK.md §9): "the
            client progress PUT doubles as heartbeat".

    ProgressPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Progress' }
        nextCursor: { type: [string, 'null'] }

    # ══════════════════════════ Playback engine (docs/PLAYBACK.md) ═════════════
    Container:
      type: string
      description: >-
        Source container (docs/PLAYBACK.md §2.1). Since v1.1,
        asf/mpeg/flv/aac/aiff admit legacy-format ingestion
        (wmv/wma->asf, mpg/mpeg/vob->mpeg) — never direct-playable.
      enum: [mp4, mkv, webm, avi, ts, mov, flac, mp3, ogg, m4a, wav, asf, mpeg, flv, aac, aiff]

    VideoCodec:
      type: string
      enum: [h264, hevc, av1, vp9, mpeg2, vc1, mpeg4, unknown]

    AudioCodec:
      type: string
      enum: [aac, ac3, eac3, truehd, dts, dtshd, flac, opus, mp3, vorbis, pcm, unknown]

    SubtitleCodec:
      type: string
      enum: [subrip, ass, webvtt, mov_text, pgs, vobsub, dvbsub, unknown]

    HdrType:
      type: string
      enum: [none, hdr10, hlg, dv]

    VideoStream:
      type: object
      additionalProperties: false
      required:
        - index
        - codec
        - profile
        - level
        - width
        - height
        - bitDepth
        - frameRate
        - bitrateBps
        - hdr
        - dvProfile
        - dvBlCompatId
        - interlaced
        - openGop
      properties:
        index: { type: integer, minimum: 0 }
        codec: { $ref: '#/components/schemas/VideoCodec' }
        profile: { type: [string, 'null'] }
        level: { type: [number, 'null'] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bitDepth: { type: integer, enum: [8, 10, 12] }
        frameRate: { type: number, minimum: 0 }
        bitrateBps: { type: [integer, 'null'] }
        hdr: { $ref: '#/components/schemas/HdrType' }
        dvProfile: { type: [integer, 'null'], enum: [5, 7, 8, null] }
        dvBlCompatId: { type: [integer, 'null'] }
        interlaced: { type: boolean }
        openGop:
          type: boolean
          description: >-
            docs/PLAYBACK.md §2.1 (added 2026-08-10). REQUIRED, never
            optional — a DB NULL collapses to false at extraction
            boundaries (the conservative default).

    AudioStream:
      type: object
      additionalProperties: false
      required: [index, codec, channels, sampleRate, bitrateBps, language, isDefault, hasAtmos]
      properties:
        index: { type: integer, minimum: 0 }
        codec: { $ref: '#/components/schemas/AudioCodec' }
        channels: { type: integer, minimum: 1 }
        sampleRate: { type: integer, minimum: 1 }
        bitrateBps: { type: [integer, 'null'] }
        language: { type: [string, 'null'], description: ISO 639-2 }
        isDefault: { type: boolean }
        hasAtmos: { type: boolean, description: TrueHD/EAC3 JOC side data. }

    SubtitleStream:
      type: object
      additionalProperties: false
      required: [index, codec, language, isForced, isDefault, isExternal, externalPath]
      properties:
        index: { type: integer, minimum: 0 }
        codec: { $ref: '#/components/schemas/SubtitleCodec' }
        language: { type: [string, 'null'] }
        isForced: { type: boolean }
        isDefault: { type: boolean }
        isExternal: { type: boolean }
        externalPath: { type: [string, 'null'] }

    MediaInfo:
      description: >-
        Probed media file description (docs/PLAYBACK.md §2.1), derived
        server-side from `media_files`/`media_streams` rows. Not client
        input; exposed read-only for diagnosability (product principle #1 —
        a plan's "why" must be inspectable), e.g. on PlaybackSession.
      type: object
      additionalProperties: false
      required:
        - fileId
        - container
        - durationMs
        - sizeBytes
        - overallBitrateBps
        - video
        - audio
        - subtitle
      properties:
        fileId: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/Container' }
        durationMs: { type: integer, format: int64 }
        sizeBytes: { type: integer, format: int64 }
        overallBitrateBps: { type: integer }
        video:
          type: array
          items: { $ref: '#/components/schemas/VideoStream' }
        audio:
          type: array
          items: { $ref: '#/components/schemas/AudioStream' }
        subtitle:
          type: array
          items: { $ref: '#/components/schemas/SubtitleStream' }

    NetworkConditions:
      type: object
      additionalProperties: false
      required: [maxBitrateBps, isLocal]
      properties:
        maxBitrateBps:
          type: integer
          format: int64
          description: min(user setting, measured estimate, device cap).
        isLocal:
          type: boolean
          description: RFC1918/loopback source; relaxes the bitrate rung cap only.

    TrackSelection:
      type: object
      description: >-
        Resolved by the session service before plan() is invoked
        (docs/PLAYBACK.md §2.6). Emits no reasons; pure input.
      additionalProperties: false
      properties:
        videoStreamIndex: { type: [integer, 'null'] }
        audioStreamIndex: { type: [integer, 'null'] }
        subtitleStreamIndex: { type: [integer, 'null'] }

    PlanRequest:
      type: object
      additionalProperties: false
      required: [itemId, device, network, mode]
      properties:
        itemId: { type: string, format: uuid }
        mediaFileId:
          type: [string, 'null']
          format: uuid
          description: Defaults to the item's primary media_files row when omitted.
        device: { $ref: '#/components/schemas/DeviceProfile' }
        network: { $ref: '#/components/schemas/NetworkConditions' }
        mode: { type: string, enum: [stream, download] }
        selection: { $ref: '#/components/schemas/TrackSelection' }

    SeekRequest:
      type: object
      additionalProperties: false
      required: [targetMs]
      properties:
        targetMs:
          type: integer
          format: int64
          minimum: 0
          description: >-
            SOURCE-timeline target, in milliseconds (invariant 5). Clamped
            server-side to `[0, durationMs]`; the 202 body echoes the
            clamped value.
        rungIndex:
          type: integer
          minimum: 0
          description: >-
            Optional coincident quality switch (docs/PLAYBACK.md §9.1.7):
            the ladder rung the client's quality selector holds pinned at
            hard-seek time. Must name a rung of the session's stored
            ladder (422 otherwise). Naming the already-active rung absorbs
            the switch half only — the seek half always lands.

    SeekAccepted:
      type: object
      additionalProperties: false
      required: [targetMs]
      properties:
        targetMs:
          type: integer
          format: int64
          description: >-
            The CLAMPED target actually recorded — what the restarted
            run's `source_origin_ms` (and its first segments'
            `EXT-X-PROGRAM-DATE-TIME`) will carry, modulo the input-seek
            keyframe snap (≤ one GOP, §9.1.5 rule 7).

    PlanReasonCode:
      description: >-
        Closed enum plus two pattern-typed families
        (docs/PLAYBACK.md §4). Additions to the fixed list are contract PRs.
      oneOf:
        - type: string
          enum:
            # Blocking-class
            - container-not-direct-playable
            - video-codec-unsupported
            - video-profile-unsupported
            - video-level-exceeds-device
            - video-bitdepth-unsupported
            - video-resolution-exceeds-device
            - video-framerate-exceeds-device
            - video-interlaced
            - hdr-tone-map-required
            - dv-profile5-requires-tonemap
            - tone-map-refused-by-policy
            - audio-codec-unsupported
            - audio-channels-exceed-device
            - audio-passthrough-unsupported
            - subtitle-format-requires-burn-in
            - subtitle-burn-in-for-styling
            - video-transcode-for-subtitle-burn-in
            - bitrate-exceeds-network
            - subtitle-codec-unknown
            - transcode-disabled-by-policy
            # Informational-class (fixed members)
            - dv-stripped-to-hdr10
            - subtitle-styling-lost
            - audio-atmos-lost
            - gapless-degraded
            - open-gop-leading-pictures-stripped
            # LD-7 / owner-decision D1 (docs/PLAYBACK.md §4/§7.4): fires
            # once per ladder rung whose configured/selected av1 codec was
            # demoted to hevc/h264. detail is
            # `cause=<tier0-no-hw-av1|device-no-av1|no-av1-encoder|tier0-software-route>
            # demotedTo=<hevc|h264> heightPx=<n>`.
            - av1-rung-demoted
            # LD-6 under LD-16 / owner-decision V2 (docs/PLAYBACK.md
            # §4/§7.5): fires AT MOST ONCE per plan when a Tier-0 ladder
            # was trimmed to the advertised-variant cap
            # (TIER0_MAX_ADVERTISED_VARIANTS = 3, a tier law rather than a
            # settings knob). detail is
            # `cap=<n> dropped=<heightPx>p@<videoBitrateBps>[,...]`, naming
            # every dropped rung in table order — the master playlist
            # advertises plan.ladder verbatim, so a silent trim would leave
            # "where did my rungs go?" unanswerable from the stored plan.
            - ladder-variant-capped
        - type: string
          description: 'hw-encoder-selected:<backend> informational reason.'
          pattern: '^hw-encoder-selected:(videotoolbox|qsv|vaapi|nvenc|amf|d3d11va|software)$'
        - type: string
          description: 'software-fallback:<cause> informational reason.'
          pattern: '^software-fallback:(decode|encode|tier-capped)$'

    PlanReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/PlanReasonCode' }
        streamIndex: { type: [integer, 'null'] }
        detail: { type: [string, 'null'] }

    ToneMapMethod:
      type: string
      description: >-
        Method used for HDR->SDR tone mapping (docs/PLAYBACK.md §5/§8.3) —
        MUST match @loombre/playback-engine's ToneMapMethod exactly.
        `toneMap` is OPTIONAL (absent means "no tone-map"), never present
        with a literal `'none'` value.
      enum: [opencl, vulkan, videotoolbox, cuda, cpu-zscale]

    PlanContainer:
      type: string
      enum: [source, fmp4-hls, ts-hls, mp4]

    VideoAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [copy, transcode, none] }
        # LD-7 / owner-decision D2 (docs/PLAYBACK.md §5/§7.4): the ENCODE
        # target ranges over LadderCodec, not VideoCodec — a NARROWING to
        # the exactly-emittable set. VideoCodec had admitted vp9/mpeg2/vc1/
        # mpeg4/unknown as targets no engine version has ever produced.
        targetCodec: { $ref: '#/components/schemas/LadderCodec' }
        encoder:
          type: string
          description: Selected hardware backend or 'software' (docs/PLAYBACK.md §8.3).
        toneMap: { $ref: '#/components/schemas/ToneMapMethod' }
        openGop:
          type: boolean
          description: >-
            Set (true) only when a video COPY into a repackaged HLS
            container strips open-GOP HEVC leading pictures on a
            seek-restart (docs/PLAYBACK.md §5/§6); omitted when not
            applicable. Never emitted false.

    AudioAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [copy, transcode, none] }
        targetCodec: { $ref: '#/components/schemas/AudioCodec' }
        targetChannels: { type: integer, minimum: 1 }
        targetBitrateBps: { type: integer, minimum: 1 }

    SubtitleAction:
      type: object
      additionalProperties: false
      required: [strategy]
      properties:
        strategy: { type: string, enum: [none, embed, hls-vtt, burn-in] }
        streamIndex: { type: integer, minimum: 0 }

    LadderCodec:
      type: string
      description: >-
        The closed set of codecs a ladder rung may ENCODE to
        (docs/PLAYBACK.md §7/§7.1) — deliberately narrower than VideoCodec,
        which is the SOURCE-fact union. av1 landed with LD-7 (Wave C1).
      enum: [h264, hevc, av1]

    LadderRung:
      type: object
      additionalProperties: false
      required: [heightPx, videoBitrateBps, audioBitrateBps, codec]
      properties:
        heightPx: { type: integer, minimum: 1 }
        videoBitrateBps: { type: integer, minimum: 1 }
        audioBitrateBps: { type: integer, minimum: 1 }
        codec: { $ref: '#/components/schemas/LadderCodec' }

    PlaybackPlan:
      description: >-
        MUST match docs/PLAYBACK.md §5 exactly. Deterministic given identical
        inputs (stable key ordering, docs/PLAYBACK.md §0 law 1).
      type: object
      additionalProperties: false
      required:
        - decision
        - reasons
        - container
        - video
        - audio
        - subtitle
        - ladder
        - ffmpegArgs
        - engineVersion
      properties:
        decision: { type: string, enum: [direct-play, direct-stream, remux, transcode] }
        reasons:
          type: array
          description: REQUIRED; may be empty only when decision === direct-play.
          items: { $ref: '#/components/schemas/PlanReason' }
        container: { $ref: '#/components/schemas/PlanContainer' }
        video: { $ref: '#/components/schemas/VideoAction' }
        audio: { $ref: '#/components/schemas/AudioAction' }
        subtitle: { $ref: '#/components/schemas/SubtitleAction' }
        ladder:
          type: array
          items: { $ref: '#/components/schemas/LadderRung' }
        ffmpegArgs:
          type: array
          items: { type: string }
          description: Ordered deterministic tokens (docs/PLAYBACK.md §6); empty for direct-play.
        engineVersion:
          type: string
          description: Semver of the decision ruleset, for audit rows.

    PlaybackSessionStatus:
      type: string
      enum: [created, starting, active, suspended, seeking, ended, failed]

    PlaybackSession:
      type: object
      additionalProperties: false
      required: [id, itemId, userId, deviceId, plan, status, errorCode, createdAtMs, updatedAtMs]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        plan: { $ref: '#/components/schemas/PlaybackPlan' }
        media: { $ref: '#/components/schemas/MediaInfo' }
        status: { $ref: '#/components/schemas/PlaybackSessionStatus' }
        errorCode: { type: [string, 'null'] }
        manifestUrl:
          type: [string, 'null']
          description: >-
            Relative URL to GET .../hls/master.m3u8 — the MULTI-VARIANT
            master playlist (docs/PLAYBACK.md §9.1, owner-decision V5), for
            EVERY HLS session including ladder-empty ones, which render a
            single-variant master so the client has ONE path and no branch.
            Its variant URIs are `v{K}/media.m3u8`, K being the rung's index
            in `plan.ladder`; every variant serves the same playlist bytes,
            and the `v{K}` prefix is how a client's ABR switch reaches the
            server (§9.1.1). Still null for direct-play sessions
            (docs/PLAYBACK.md §9 — direct-play bypasses HLS packaging
            entirely).
        createdAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }

    # ═══════════════════════════════ Restricted ════════════════════════════════
    UnlockRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^[0-9]{4}$'
          description: >-
            Exactly 4 digits, the same shape RestrictedSettingsUpdate.pin
            accepts. A value of any other length is a 422 (request shape),
            NOT the 401 a well-formed but incorrect PIN gets.

    UnlockResponse:
      type: object
      additionalProperties: false
      required: [unlockedUntilMs]
      properties:
        unlockedUntilMs: { type: integer, format: int64 }

    RestrictedCount:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Aggregate item count of the restricted zone — count only, never
            titles/artwork (design/phosphor README "Restricted content").

    RestrictedZoneItemQuality:
      description: >-
        Per-item 4K/HDR/resolution-band signal for the zone's own filter
        chips — not part of Movie/Series (list responses there carry no
        mediaFiles/streams data, Tier-0), so this is scoped to the zone's
        own dedicated reads (RestrictedBrowseItem/RestrictedScene).
      type: object
      additionalProperties: false
      required: [is4k, hdr, resolution]
      properties:
        is4k:
          type: boolean
          description: Primary video stream >= 3840x2160 on any non-missing media file.
        hdr: { $ref: '#/components/schemas/HdrType' }
        resolution:
          description: >-
            Derived from the primary probed video stream's height (S5's
            technical authority) — null when no video stream has been
            probed yet.
          oneOf:
            - { $ref: '#/components/schemas/RestrictedResolutionBand' }
            - type: 'null'

    RestrictedResolutionBand:
      type: string
      enum: [SD, HD, FHD, UHD]
      description: >-
        SD < 720p <= HD < 1080p <= FHD < 2160p <= UHD, by primary video
        stream height (S9/S10).

    RestrictedBrowseSort:
      type: string
      enum: [added, date, title, rating, duration]
      description: >-
        `added` (catalog_items.added_at_ms), `date` (movie_details.
        premiere_at_ms, falling back to catalog_items.year — K1), `title`,
        `rating` (community_rating), `duration` (probed media_files.
        duration_ms).

    RestrictedStudioRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    RestrictedPerformerRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    RestrictedTagChip:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    RestrictedBrowseItem:
      description: >-
        One restricted-zone scene row (GET /restricted/browse, GET
        /restricted/search, GET /restricted/performers/{id}/scenes) —
        itemType is always `movie` (K1: scenes are item_type='movie' rows
        in restricted libraries).
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required: [itemType, premiereAtMs, durationMs, genres, images, quality, studio]
          properties:
            itemType: { type: string, const: movie }
            premiereAtMs:
              type: [integer, 'null']
              format: int64
              description: K1 editorial premiere date; null falls back to `year`.
            durationMs:
              type: [integer, 'null']
              format: int64
              description: Probed primary-file duration; null until the file is probed.
            genres:
              type: array
              items: { type: string }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
            quality: { $ref: '#/components/schemas/RestrictedZoneItemQuality' }
            studio:
              oneOf:
                - { $ref: '#/components/schemas/RestrictedStudioRef' }
                - type: 'null'
      unevaluatedProperties: false

    RestrictedBrowseItemPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RestrictedBrowseItem' }
        nextCursor: { type: [string, 'null'] }

    RestrictedSceneMarker:
      description: One chapter_markers row (migrations/0019, K9/S7) for this scene.
      type: object
      additionalProperties: false
      required: [id, title, startMs]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startMs: { type: integer, format: int64, minimum: 0 }

    RestrictedSceneProgress:
      description: >-
        The caller's OWN progress on this scene — a lighter twin of
        Progress without `itemId` (redundant: this object only ever
        appears nested inside the scene it belongs to).
      type: object
      additionalProperties: false
      required: [positionMs, durationMs, state, playCount, updatedAtMs]
      properties:
        positionMs: { type: integer, format: int64, minimum: 0 }
        durationMs: { type: [integer, 'null'], format: int64 }
        state: { $ref: '#/components/schemas/ProgressState' }
        playCount: { type: integer, minimum: 0 }
        updatedAtMs: { type: integer, format: int64 }

    RestrictedScene:
      description: GET /restricted/scenes/{id} — full scene detail.
      allOf:
        - { $ref: '#/components/schemas/CatalogItemBase' }
        - type: object
          required:
            - itemType
            - premiereAtMs
            - contentRating
            - runtimeMs
            - durationMs
            - overview
            - tags
            - studio
            - performers
            - images
            - markers
            - progress
            - quality
          properties:
            itemType: { type: string, const: movie }
            premiereAtMs:
              type: [integer, 'null']
              format: int64
              description: K1 editorial premiere date (movie_details.premiere_at_ms); null falls back to `year`.
            contentRating: { type: [string, 'null'] }
            runtimeMs:
              type: [integer, 'null']
              format: int64
              description: >-
                Editorial runtime (movie_details.runtime_ms) — provider/
                admin-set, not necessarily populated for Stash-sourced
                scenes (S5: Stash supplies editorial facts, never technical
                ones). Prefer `durationMs` (the PROBED primary-file
                duration) for display; this is kept for parity with
                Movie/Episode/Track's own `runtimeMs` field.
            durationMs:
              type: [integer, 'null']
              format: int64
              description: >-
                Probed primary-file duration (S5 "Loombre ffprobe
                authoritative for technical facts") — the same field
                RestrictedBrowseItem carries; null until the file is probed.
            overview: { type: [string, 'null'] }
            tagline: { type: [string, 'null'] }
            tags:
              type: array
              items: { $ref: '#/components/schemas/RestrictedTagChip' }
              description: >-
                Genre AND general item_tags (kind IN (genre,tag)) together
                as one id/name chip list — the design's "tag chips", not
                split from a separate genre list the way browse cards'
                `genres` are (scene detail has no card-level genre badge to
                keep separate).
            studio:
              oneOf:
                - { $ref: '#/components/schemas/RestrictedStudioRef' }
                - type: 'null'
            performers:
              type: array
              items: { $ref: '#/components/schemas/RestrictedPerformerRef' }
            images:
              type: array
              items: { $ref: '#/components/schemas/ImageDescriptor' }
            markers:
              type: array
              items: { $ref: '#/components/schemas/RestrictedSceneMarker' }
              description: Ordered by startMs ascending.
            progress:
              oneOf:
                - { $ref: '#/components/schemas/RestrictedSceneProgress' }
                - type: 'null'
              description: Null if the caller has never played this scene.
            quality: { $ref: '#/components/schemas/RestrictedZoneItemQuality' }
      unevaluatedProperties: false

    RestrictedPerformer:
      description: >-
        GET /restricted/performers row/detail — role=performer people
        credited on >=1 scene visible within the zone. Mirrors Person's
        shape (packages/db/src/query/people.ts's guard model) with a
        zone-scoped `sceneCount` in place of Person's general `creditCount`.
        FX2 fix wave: `images` mirrors RestrictedStudio's own field exactly
        (same shape, same guard posture) — B ingests performer portraits
        (images entity_type='person', kind='thumb') but this field was
        missing here until now.
      type: object
      additionalProperties: false
      required: [id, name, contentClass, sceneCount, images]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        sceneCount: { type: integer, minimum: 0 }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageDescriptor' }
          description: The performer's portrait, ingested from Stash (entity_type=person, kind=thumb).

    RestrictedPerformerPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RestrictedPerformer' }
        nextCursor: { type: [string, 'null'] }

    RestrictedStudio:
      description: >-
        GET /restricted/studios row/detail — kind=studio tags (S6: studios
        are first-class VIA tags, no dedicated entity table).
      type: object
      additionalProperties: false
      required: [id, name, contentClass, sceneCount, images]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        sceneCount: { type: integer, minimum: 0 }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageDescriptor' }
          description: The studio's logo, ingested from Stash (entity_type=tag).

    RestrictedStudioPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RestrictedStudio' }
        nextCursor: { type: [string, 'null'] }

    RestrictedHomeContinueWatchingEntry:
      type: object
      additionalProperties: false
      required: [item, progress]
      properties:
        item: { $ref: '#/components/schemas/RestrictedBrowseItem' }
        progress: { $ref: '#/components/schemas/Progress' }

    RestrictedHome:
      description: >-
        GET /restricted/home — zone home rails (S9). Rail UI itself is
        Lane E's scope; this endpoint + shape land here (K4/S9).
      type: object
      additionalProperties: false
      required: [continueWatchingInZone, recentlyAddedInZone, studios, performers]
      properties:
        continueWatchingInZone:
          type: array
          items: { $ref: '#/components/schemas/RestrictedHomeContinueWatchingEntry' }
        recentlyAddedInZone:
          type: array
          items: { $ref: '#/components/schemas/RestrictedBrowseItem' }
        studios:
          type: array
          items: { $ref: '#/components/schemas/RestrictedStudio' }
          description: Top-N studios by scene count.
        performers:
          type: array
          items: { $ref: '#/components/schemas/RestrictedPerformer' }
          description: Top-N performers by scene count.

    # ──────────── Admin: Stash SQLite metadata sync (STATE.md S1-S4/S8) ────────
    AdminStashConnectionStatus:
      type: string
      enum: [never_connected, ok, unsupported_schema, unreachable]

    AdminStashConnection:
      description: >-
        GET/PUT /admin/libraries/{id}/stash-connection — packages/db's
        library_stash_connections row (migrations/0018 + 0019's additive
        genre_tag_names), config fields admin-written, status fields
        worker-written at connect time (S2/S3).
      type: object
      additionalProperties: false
      required:
        - libraryId
        - configured
        - sqlitePath
        - enabled
        - genreTagNames
        - blobsPath
        - status
        - statusDetail
        - lastSeenSchemaVersion
        - lastConnectedAtMs
        - lastCheckedAtMs
      properties:
        libraryId: { type: string, format: uuid }
        configured:
          type: boolean
          description: False when no connection has ever been saved for this library.
        sqlitePath: { type: [string, 'null'] }
        enabled: { type: boolean }
        genreTagNames:
          type: [array, 'null']
          items: { type: string }
          description: >-
            S6/K15: which Stash tag names map to Loombre genre rather than
            general tags. `null` (the default, including before any
            connection has ever been saved) means the mapper's documented
            heuristic applies — a Stash tag with NO parent tag maps to
            genre, a child tag maps to a plain tag; explicit tag names here
            override that heuristic wholesale, case-insensitively.
        blobsPath:
          type: [string, 'null']
          description: >-
            Filesystem path to Stash's on-disk blob store, when Stash uses
            Filesystem (not Database) blob storage. `null` (the default)
            means art is read only from database-stored blobs — a
            Filesystem-mode Stash then syncs no covers. A path opts into
            reading cover/portrait/logo bytes from Stash's sharded on-disk
            store. Worker-side path; the server never opens it.
        status: { $ref: '#/components/schemas/AdminStashConnectionStatus' }
        statusDetail:
          type: [string, 'null']
          description: The exact S3 admin notice when status=unsupported_schema; null otherwise.
        lastSeenSchemaVersion: { type: [integer, 'null'] }
        lastConnectedAtMs: { type: [integer, 'null'], format: int64 }
        lastCheckedAtMs: { type: [integer, 'null'], format: int64 }

    PutAdminStashConnectionRequest:
      type: object
      additionalProperties: false
      required: [sqlitePath]
      properties:
        sqlitePath: { type: string, minLength: 1 }
        enabled: { type: boolean, description: Defaults to true when omitted on first configure. }
        genreTagNames:
          type: [array, 'null']
          items: { type: string }
          description: >-
            Omit this field to leave the saved genreTagNames untouched.
            Send `null` to explicitly clear it back to the default
            heuristic (see AdminStashConnection.genreTagNames). Send a
            (possibly empty) array to replace it wholesale.
        blobsPath:
          type: [string, 'null']
          description: >-
            Omit to leave the saved blobsPath untouched. Send `null` to
            clear it (back to DB-only art). Send a path to read covers from
            Stash's filesystem blob store (see AdminStashConnection.blobsPath).

    AdminStashPathMapping:
      type: object
      additionalProperties: false
      required: [stashPrefix, loombrePrefix]
      properties:
        stashPrefix: { type: string, minLength: 1 }
        loombrePrefix: { type: string, minLength: 1 }

    AdminStashPathMappings:
      type: object
      additionalProperties: false
      required: [mappings]
      properties:
        mappings:
          type: array
          items: { $ref: '#/components/schemas/AdminStashPathMapping' }
          description: Admin display order (position ASC) — matching is longest-prefix-wins, independent of this order.

    PutAdminStashPathMappingsRequest:
      type: object
      additionalProperties: false
      required: [mappings]
      properties:
        mappings:
          type: array
          items: { $ref: '#/components/schemas/AdminStashPathMapping' }

    PreviewAdminStashPathMappingsRequest:
      type: object
      additionalProperties: false
      required: [mappings]
      properties:
        mappings:
          type: array
          items: { $ref: '#/components/schemas/AdminStashPathMapping' }

    AdminStashPathMappingPreviewUnmatchedScene:
      type: object
      additionalProperties: false
      required: [stashSceneId, stashPath, rewrittenPath]
      properties:
        stashSceneId: { type: string }
        stashPath: { type: string }
        rewrittenPath:
          type: [string, 'null']
          description: Null when no candidate mapping's prefix matches this scene's raw Stash path at all.

    AdminStashPathMappingPreview:
      type: object
      additionalProperties: false
      required: [totalStashScenes, candidateMatchCount, unmatchedCount, unmatchedScenes]
      properties:
        totalStashScenes: { type: integer, minimum: 0 }
        candidateMatchCount: { type: integer, minimum: 0 }
        unmatchedCount: { type: integer, minimum: 0 }
        unmatchedScenes:
          type: array
          items: { $ref: '#/components/schemas/AdminStashPathMappingPreviewUnmatchedScene' }
          description: Capped list for admin display — unmatchedCount above is always the true total.

    PostAdminStashSyncRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [full, incremental] }

    # ═════════════════════════════ Data freedom ════════════════════════════════
    ExportUser:
      type: object
      description: >-
        A user record sans secrets (no password hash, no PIN hash, no
        tokens). This schema is reused BOTH as GET /export's response shape
        AND (nested under Archive) as POST /import's request shape —
        `displayName` is deliberately NOT in `required` despite always
        being present on export, so an archive written before M2 (which
        never had this key at all) still validates as an import request;
        the import path treats a missing key exactly like an explicit null
        (apps/worker/src/import/validate.ts).
      additionalProperties: false
      required: [id, username, email, isAdmin, createdAtMs]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email, description: 'M1: nullable, an email-less user exports/imports as null.' }
        displayName: { type: [string, 'null'], description: 'M2 (E4 archive check). Optional key: absent on a pre-M2 archive.' }
        isAdmin: { type: boolean }
        createdAtMs: { type: integer, format: int64 }

    ExportPlaylist:
      type: object
      additionalProperties: false
      required: [id, userId, name, itemIds, createdAtMs]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        itemIds:
          type: array
          items: { type: string, format: uuid }
        createdAtMs: { type: integer, format: int64 }

    ExportArchive:
      type: object
      description: >-
        Open JSON archive per docs/PLAN.md §8.4 (P12) — data freedom without
        API compatibility. Import accepts the same shape.
      additionalProperties: false
      required: [exportedAtMs, users, libraries, items, progress, playlists]
      properties:
        exportedAtMs: { type: integer, format: int64 }
        users:
          type: array
          items: { $ref: '#/components/schemas/ExportUser' }
        libraries:
          type: array
          items: { $ref: '#/components/schemas/Library' }
        items:
          type: array
          description: >-
            Catalog items across all types with their provider ids; kept as a
            loose envelope here (concrete per-type shapes are Movie/Series/
            Season/Episode/Artist/Album/Track).
          items:
            oneOf:
              - { $ref: '#/components/schemas/Movie' }
              - { $ref: '#/components/schemas/Series' }
              - { $ref: '#/components/schemas/Season' }
              - { $ref: '#/components/schemas/Episode' }
              - { $ref: '#/components/schemas/Artist' }
              - { $ref: '#/components/schemas/Album' }
              - { $ref: '#/components/schemas/Track' }
        progress:
          type: array
          items: { $ref: '#/components/schemas/Progress' }
        playlists:
          type: array
          items: { $ref: '#/components/schemas/ExportPlaylist' }

    # ═══════════════════════════════ Admin jobs ════════════════════════════════
    JobRef:
      type: object
      additionalProperties: false
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }

    JobStatus:
      type: string
      enum: [queued, active, completed, failed, cancelled]

    Job:
      type: object
      description: >-
        Job ledger row, typed fields matching the server's
        `jobs` table exactly (pg-boss driver + ledger mirror).
      additionalProperties: false
      required:
        - id
        - type
        - status
        - priority
        - attempts
        - lastError
        - subjectItemId
        - createdAtMs
        - updatedAtMs
        - startedAtMs
        - finishedAtMs
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: "Closed job-type registry key (@loombre/jobs), e.g. 'scan', 'probe', 'image', 'metadata', 'import'." }
        status: { $ref: '#/components/schemas/JobStatus' }
        priority: { type: integer }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: [string, 'null'] }
        subjectItemId: { type: [string, 'null'], format: uuid }
        createdAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }
        startedAtMs: { type: [integer, 'null'], format: int64 }
        finishedAtMs: { type: [integer, 'null'], format: int64 }

    JobPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        nextCursor: { type: [string, 'null'] }

    AdminSession:
      type: object
      description: >-
        GET /admin/sessions row. Item display
        fields are gated through the requesting admin's OWN ViewerContext
        (see the operation description); a session whose item this admin
        cannot currently see keeps itemTitle null and contentHidden true
        rather than being omitted from the page.
      additionalProperties: false
      required:
        - id
        - userId
        - username
        - deviceId
        - deviceName
        - itemId
        - itemTitle
        - contentHidden
        - status
        - startedAtMs
        - updatedAtMs
        - lastHeartbeatMs
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        username: { type: string }
        deviceId: { type: [string, 'null'], format: uuid }
        deviceName: { type: [string, 'null'] }
        itemId: { type: [string, 'null'], format: uuid }
        itemTitle:
          type: [string, 'null']
          description: Null when contentHidden is true, or when there is no recoverable item at all.
        contentHidden:
          type: boolean
          description: True iff this session's item exists but is not visible to the requesting admin's own ViewerContext (plan §6.4 — admins are not exempt).
        status: { $ref: '#/components/schemas/PlaybackSessionStatus' }
        startedAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }
        lastHeartbeatMs: { type: [integer, 'null'], format: int64 }
        plan:
          type: [object, 'null']
          additionalProperties: true
          description: >-
            The session's STORED plan (the §6.3-whitelisted serialized-plan
            JSONB: the docs/PLAYBACK.md §5 shape as produced by the
            engineVersion below, possibly carrying the selection sidecar the
            worker's seek-restart path requires) — the admin "why is this
            transcoding" panel's data. Deliberately a free-form object, NOT
            a $ref to PlaybackPlan: stored plans are engine-versioned
            historical artifacts and must remain readable across engine
            upgrades. REDACTED like itemTitle: null when contentHidden is
            true (codec/resolution/bitrate choices can indirectly describe a
            restricted item), null only if
            the row predates plan storage. Additive field.
        engineVersion:
          type: [string, 'null']
          description: ENGINE_VERSION that produced the stored plan; redacted with it. Additive field.

    AdminSessionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminSession' }
        nextCursor: { type: [string, 'null'] }

    # ═════════ Admin: Fix Match (Phosphor retheme Wave 2, Lane L2) ═════════════
    UnmatchedLibraryItem:
      type: object
      description: >-
        GET /admin/libraries/{id}/unmatched row. Derived, never stored (U9):
        an enrichable-type catalog item (movie/series/artist/album) with zero
        provider_ids rows for it. Standard guarded-read posture (docs/PLAN.md
        §6.4, packages/db/src/query/guard.ts's applyGuard) — admins are NOT
        exempt from restricted-content gating or from needing their own
        library_permissions grant; an item this admin's own ViewerContext
        does not currently clear is simply absent from the page, the same as
        every other viewer-scoped catalog list in this API (unlike GET
        /admin/sessions' redact-in-place posture, which exists specifically
        to prove a restricted PLAYBACK SESSION is happening at all — there is
        no equivalent "something is happening" fact to preserve here).
      additionalProperties: false
      required: [itemId, itemType, title, year, filePath]
      properties:
        itemId: { type: string, format: uuid }
        itemType: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        year:
          type: [integer, 'null']
          description: Null when the item genuinely has no known year.
        filePath:
          type: [string, 'null']
          description: >-
            A representative on-disk path for this item (the movie's own
            file, or one file discovered beneath a series/artist/album's
            hierarchy). Null when this item type has no resolvable file yet
            — never fabricated (U9).

    UnmatchedLibraryItemPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UnmatchedLibraryItem' }
        nextCursor: { type: [string, 'null'] }

    ApplyMatchRequest:
      type: object
      additionalProperties: false
      required: [provider, externalId]
      properties:
        provider:
          type: string
          description: >-
            A metadata-provider name this server can actually resolve, in
            one of exactly two forms (matched EXACTLY, case-sensitively —
            the worker's ProviderRegistry lookup is a case-sensitive map,
            so `TMDB` is a miss): a built-in provider name (`tmdb`, `tvdb`,
            `musicbrainz`, `stash` — the names registered in
            apps/worker/src/metadata/registry.ts; GET
            /admin/libraries/{id}/provider-chain reports the same closed
            set as `builtinProviderNames`), or the stable `lpp:<pluginId>`
            LPP adapter id of a plugin that is REGISTERED on this server
            and currently ENABLED
            (apps/worker/src/metadata/plugin-provider.ts). Anything else is
            a 422 naming this field —
            it is deliberately NOT the `ProviderName` enum, which is a
            different, smaller closed set (the providers with an
            admin-manageable API key, A9). The name need not appear in this
            item's own library provider chain: a forced ref bypasses chain
            resolution by design.
        externalId:
          type: string
          description: That provider's own id for the chosen candidate (ProviderRef.externalId, apps/worker/src/metadata/provider.ts).

    # ═══════════════════ Admin settings (STATE.md Addendum A) ═════════════════
    SettingsValueSource:
      type: string
      enum: [environment, database, default]
      description: Which input actually determined a setting's current effective value (A8 precedence order).

    SettingsScope:
      type: string
      enum: [ui, env-only]
      description: >-
        'ui' entries are admin-editable (PUT /admin/settings/{key}, subject
        to an env pin winning if present); 'env-only' entries are the
        bootstrap/lockout boundary (docs/PLAN.md) — always env-or-default,
        read-only through this API.

    SettingsCategory:
      type: string
      enum:
        - transcode
        - scanner
        - images
        - restricted
        - sessions
        - updateCheck
        - security
        - rateLimit
        - database
        - network
        - tls
        - paths
        - ffmpeg
        # `stash` (STATE.md "Stash SQLite metadata sync" run): used by
        # packages/shared/src/settings-registry.ts's stash.sync.scheduleIntervalMs
        # entry since that run landed, but never added to this contract enum
        # — a pre-existing gap fixed here (optional mail transport run, M10)
        # alongside this run's own new `mail` category.
        - stash
        # Optional mail transport run (E5/M10): the generic SMTP transport
        # settings (mail.smtpHost/smtpPort/smtpSecurity/fromAddress/fromName).
        - mail
        # `remote` (Loombre Remote — embedded WireGuard + three-path wizard):
        # used by packages/shared/src/settings-registry.ts's five
        # remote.wireguardPort/subnet/wireguardEndpointHost/cloudflaredPath/
        # tunnelHostname entries since that run landed, but never added to
        # this contract enum — the same drift class as `stash` above
        # (audit fafa47f AUD-A8a-001, Fix Wave 4).
        - remote

    ProviderName:
      type: string
      enum: [tmdb, tvdb]
      description: Closed set of metadata providers with an admin-manageable API key (A9).

    AdminSettingValue:
      type: object
      description: One GET /admin/settings entry — the per-key EFFECTIVE value, independent of scope.
      additionalProperties: false
      required: [key, value, source, requiresRestart, locked]
      properties:
        key: { type: string }
        value: {}
        source: { $ref: '#/components/schemas/SettingsValueSource' }
        requiresRestart:
          type: boolean
          description: Whether a change to this key only takes effect at next server boot.
        locked:
          type: boolean
          description: >-
            True iff an env pin is active RIGHT NOW (A8) — `value` above is
            always the env value in that case, and any stored database value
            is preserved but inert.
        lockedBy:
          type: string
          description: The environment variable currently pinning this key. Present only when `locked` is true.

    AdminSettingsResponse:
      type: object
      additionalProperties: false
      required: [settings, restartPendingKeys, providerKeys]
      properties:
        settings:
          type: array
          items: { $ref: '#/components/schemas/AdminSettingValue' }
        restartPendingKeys:
          type: array
          items: { type: string }
          description: >-
            requiresRestart:true keys whose current effective value differs
            from what it was at this server instance's boot (A5). Non-empty
            means a restart is needed for those changes to fully apply.
        providerKeys:
          type: array
          items: { $ref: '#/components/schemas/ProviderKeyStatus' }
        mailCredentials:
          description: >-
            Optional mail transport run (E5/M10) — ADDITIVE field: the SMTP
            username/password keyring entry's status (never the values
            themselves; see MailCredentialsStatus). Absent on an older
            client's cached shape is never load-bearing — mail credentials
            are optional overall (unauthenticated SMTP relays are legal).
          allOf:
            - $ref: '#/components/schemas/MailCredentialsStatus'

    AdminSettingSchemaEntry:
      type: object
      description: >-
        One GET /admin/settings/schema entry — the pure registry
        projection (no live value): what the admin UI's dynamic widget
        renderer and the generated operator/admin docs both build from.
      additionalProperties: false
      required: [key, category, description, scope, requiresRestart, default, valueSchema, locked]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SettingsCategory' }
        description: { type: string }
        caution:
          type: string
          description: Operator-facing caution for a setting whose misconfiguration degrades behavior but never locks the instance out.
        technicalDetails:
          type: string
          description: >-
            ADDITIVE field (W13b, decision D-7's second copy layer): precise
            technical detail (protocol notes, format specifics, behavioral
            caveats) `description` deliberately leaves out of its
            plain-language register. Rendered by the admin settings screen in
            an on-demand info tooltip beside the key name, alongside that
            entry's own env-pin name when it has one. Absent on an older
            cached client shape is never load-bearing — every field this
            entry needs to render or validate a setting is elsewhere.
        scope: { $ref: '#/components/schemas/SettingsScope' }
        requiresRestart: { type: boolean }
        envVar:
          type: string
          description: The real environment variable this entry is pinnable by (scope 'ui') or exclusively sourced from (scope 'env-only').
        default: {}
        valueSchema:
          type: object
          description: >-
            The JSON Schema describing
            this key's value shape. The UI widget renderer's sole input for
            choosing a control: boolean -> toggle, number (with
            minimum/maximum) -> numeric input, enum -> segmented/select,
            string -> text input, array/object -> a structured editor.
        locked:
          type: boolean
          description: Mirrors AdminSettingValue.locked for the SAME key (A8), without a second round trip to GET /admin/settings.
        lockedBy: { type: string }

    AdminSettingsSchemaResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AdminSettingSchemaEntry' }

    UpdateSettingRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {}

    UpdateSettingResponse:
      type: object
      additionalProperties: false
      required: [key, value, source, requiresRestart, restartPending]
      properties:
        key: { type: string }
        value: {}
        source: { $ref: '#/components/schemas/SettingsValueSource' }
        requiresRestart: { type: boolean }
        restartPending:
          type: boolean
          description: Whether THIS key now appears in restartPendingKeys after this write — lets the UI show "restart required" inline without a second GET.

    ProviderKeyStatus:
      type: object
      description: >-
        A9: the ENTIRE shape any provider-key read ever returns — never the
        key value itself, by construction.
      additionalProperties: false
      required: [provider, set, source]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        set: { type: boolean }
        source:
          type: [string, 'null']
          enum: [env, keyring, null]
          description: Null when `set` is false.
        lastSetMs:
          type: integer
          format: int64
          description: Present only when source is 'keyring' — an env-sourced key has no "when was it set" concept this server can observe.

    SetProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          description: The raw provider API key. Write-only — never returned by any endpoint.

    # ═══════════ Admin: mail (optional mail transport run, E5/E6/M10/M11) ═══════════
    MailCredentialsStatus:
      type: object
      description: >-
        GET /admin/settings' additive `mailCredentials` field — the ENTIRE
        shape a mail-credentials status read ever returns, same discipline
        as ProviderKeyStatus: never the username/password themselves.
      additionalProperties: false
      required: [configured, setAtMs, source]
      properties:
        configured: { type: boolean }
        setAtMs:
          type: [integer, 'null']
          format: int64
          description: Null when not configured, or when sourced from the environment (which has no "when was it set" concept this server can observe).
        source:
          type: [string, 'null']
          enum: [keyring, env, null]
          description: Null when `configured` is false.

    SetMailCredentialsRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          description: Write-only — never returned by any endpoint.
        password:
          type: string
          minLength: 1
          description: Write-only — never returned by any endpoint.

    TestSendMailRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          type: string
          format: email
          description: The address to send the test message to.

    TestSendMailResponse:
      type: object
      additionalProperties: false
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid
          description: The enqueued `mail-send` job's id — poll GET /admin/jobs/{id} or watch the admin-only job.updated live feed for the outcome.

    # ═══════════════════ Admin: plugins (LPP v1, Lane W5) ═══════════════════
    PluginHealthState:
      type: string
      enum: [unknown, healthy, unhealthy]
      description: One aggregate health value per plugin (LD7) — envelope reachability plus every GRANTED capability's static check.

    PluginDisabledReason:
      type: string
      enum: [admin, breaker, scope-change]
      description: >-
        Why an enabled:false plugin is disabled. 'admin' — an admin turned
        it off. 'breaker' — 5 consecutive failed calls auto-disabled it
        (LD8). 'scope-change' — a manifest re-fetch found the plugin now
        asks for more than was approved; only reapproveAdminPlugin re-enables
        this one.

    PluginMetadataProviderCapability:
      type: object
      description: >-
        A metadata-provider capability entry, as declared by a plugin's
        manifest. Scope in plain language: this plugin can see the title,
        year, and other identifying details of items in any library it is
        attached to, and returns matched metadata/artwork for them — nothing
        else about your library or its viewers.
      additionalProperties: false
      required: [type, mediaKinds, contentClass]
      properties:
        type: { type: string, enum: [metadata-provider] }
        mediaKinds:
          type: array
          items: { $ref: '#/components/schemas/MediaKind' }
        contentClass: { $ref: '#/components/schemas/ContentClass' }

    PluginEventSubscriberCapability:
      type: object
      description: >-
        An event-subscriber capability entry, as declared by a plugin's
        manifest. Scope in plain language: this plugin receives the activity
        feed events an admin selects (see eventTypeGrants) — never more than
        it asks for here, and never anything an admin hasn't granted.
      additionalProperties: false
      required: [type, eventTypes, contentClass]
      properties:
        type: { type: string, enum: [event-subscriber] }
        eventTypes:
          type: array
          items: { type: string }
          description: The event types this capability REQUESTS. An admin grants a possibly smaller subset — see eventTypeGrants on RegisterPluginRequest / UpdatePluginEventGrantsRequest.
        contentClass: { $ref: '#/components/schemas/ContentClass' }

    PluginCapability:
      description: One manifest-declared capability, discriminated by `type`. Additive (C8) — a future LPP capability type is a new union member here, never a shape change to the existing ones.
      oneOf:
        - { $ref: '#/components/schemas/PluginMetadataProviderCapability' }
        - { $ref: '#/components/schemas/PluginEventSubscriberCapability' }
      discriminator:
        propertyName: type
        mapping:
          metadata-provider: '#/components/schemas/PluginMetadataProviderCapability'
          event-subscriber: '#/components/schemas/PluginEventSubscriberCapability'

    PluginManifestPreview:
      type: object
      description: >-
        previewAdminPlugin's result — a validated read of the plugin's
        manifest for the C4 confirmation screen. Nothing is persisted by
        that call.
      additionalProperties: false
      required: [name, version, protocolVersion, publisher, description, capabilities, configSchema, requestedEventTypes, manifestDigest]
      properties:
        name: { type: string }
        version: { type: string, description: The plugin's own version string — distinct from protocolVersion. }
        protocolVersion: { type: integer }
        publisher: { type: string }
        description: { type: string }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/PluginCapability' }
        # No `type: object` (mirrors AdminSettingSchemaEntry.default's bare
        # `{}` precedent): a real JSON-Schema document, opaque to this
        # contract, walked client-side by lib/plugin-manifest.ts.
        configSchema:
          description: >-
            The plugin's manifest configSchema verbatim (LPP §3's JSON-Schema
            subset) — the admin config form's sole input, auto-rendered by
            the same schema-driven widget renderer admin settings uses. A
            string field with `secret: true` is entered write-only and
            stored in the keyring, never echoed back.
        requestedEventTypes:
          type: array
          items: { type: string }
          description: Union of every event-subscriber capability's requested eventTypes (empty if the manifest declares none).
        manifestDigest:
          type: string
          description: >-
            C-2 fix wave (adversarial-review): a sha256 hex digest of the
            EXACT manifest content this preview validated. The client MUST
            round-trip this value back as `manifestDigest` on
            registerAdminPlugin / reapproveAdminPlugin — the server re-fetches
            the manifest at that point (as it always did) and 409s if the
            fresh fetch's digest no longer matches, closing the TOCTOU where
            a plugin could serve a broader/differently-scoped manifest to the
            registration call than the one this preview actually showed the
            admin.

    PreviewPluginRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The plugin's base HTTP(S) origin — GET <url>/lpp/manifest is fetched.
        lanAllowlist:
          type: array
          items: { type: string }
          description: Explicit LAN hostnames/IPs to permit for this preview fetch even if they land in a private/loopback address range (LD5).

    PluginEventGrant:
      type: object
      additionalProperties: false
      required: [eventType, grantedAtMs]
      properties:
        eventType: { type: string }
        grantedAtMs: { type: integer, format: int64 }

    AdminPlugin:
      type: object
      description: >-
        A registered LPP plugin's admin-facing state (migrations/0014_plugins.sql).
        Never carries the HMAC secret or any config secret value (LD1/LD9) —
        those exist only in the keyring and are returned exactly once, by
        registerAdminPlugin / rotateAdminPluginHmac.
      additionalProperties: false
      required:
        - id
        - name
        - baseUrl
        - version
        - protocolVersion
        - enabled
        - contentClass
        - grantedCapabilityTypes
        - healthState
        - consecutiveFailures
        - lastHealthCheckMs
        - lastOkMs
        - disabledReason
        - lanAllowlist
        - manifest
        - config
        - eventGrants
        - createdAtMs
        - updatedAtMs
        - approvedAtMs
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string }
        version: { type: string }
        protocolVersion: { type: integer }
        enabled: { type: boolean }
        contentClass: { $ref: '#/components/schemas/ContentClass' }
        grantedCapabilityTypes:
          type: array
          items: { type: string }
          description: Subset of the manifest's declared capability `type` values this plugin is approved to use (LD6 "capability set <= declared").
        healthState: { $ref: '#/components/schemas/PluginHealthState' }
        consecutiveFailures: { type: integer }
        lastHealthCheckMs: { type: [integer, 'null'], format: int64 }
        lastOkMs: { type: [integer, 'null'], format: int64 }
        disabledReason:
          oneOf:
            - { $ref: '#/components/schemas/PluginDisabledReason' }
            - { type: 'null' }
        lanAllowlist:
          type: array
          items: { type: string }
          description: Explicit hostnames/IPs this plugin may target even in a private/loopback address range (LD5) — an admin opts a plugin into a specific address, never a subnet.
        # No `type: object` on manifest/config (see PluginManifestPreview.
        # configSchema's own comment) — both are opaque JSON blobs.
        manifest:
          description: Verbatim last-fetched manifest snapshot (opaque) — the admin UI derives its capability/config display from this.
        config:
          description: Non-secret configSchema field values only — secret fields are never included here (LD1); manifest.configSchema's `secret:true` flags tell the UI which field names are keyring-only.
        eventGrants:
          type: array
          items: { $ref: '#/components/schemas/PluginEventGrant' }
        createdAtMs: { type: integer, format: int64 }
        updatedAtMs: { type: integer, format: int64 }
        approvedAtMs: { type: integer, format: int64 }
        # Lane W5b additions, both additive-only (NOT in `required` above —
        # older clients ignore them safely; every route that returns
        # AdminPlugin always sends BOTH keys regardless, never omits them).
        pseudonymizeActorIds:
          type: boolean
          description: >-
            plugins.pseudonymize_actor_ids (migrations/0016_plugin_delivery_cursors.sql)
            — default true. updateAdminPluginPseudonymization is the only
            way to change it; every other AdminPlugin-returning route
            reports its current stored value unchanged.
        deliveryStatus:
          description: >-
            Outbox delivery-loop stats for this plugin's event-subscriber
            capability (migrations/0016_plugin_delivery_cursors.sql via
            packages/db's getDeliveryCursor) — null when this plugin has
            never been through the delivery loop (no event-subscriber grant,
            or granted but zero delivery attempts yet).
          oneOf:
            - { $ref: '#/components/schemas/PluginDeliveryStatus' }
            - { type: 'null' }

    PluginDeliveryStatus:
      type: object
      description: >-
        One plugin_delivery_cursors row, admin-facing. `lastAttemptMs`/
        `lastSuccessMs` are separate fields (migration column comment) so a
        plugin that is failing every attempt is distinguishable from one
        with nothing new to deliver: `now - lastSuccessMs` grows while
        `lastAttemptMs` keeps advancing.
      additionalProperties: false
      required: [lastAttemptMs, lastSuccessMs, consecutiveFailures, deliveredBatches, deliveredEvents, gapReportedThroughMs]
      properties:
        lastAttemptMs:
          type: [integer, 'null']
          format: int64
          description: Epoch ms of the most recent delivery attempt, success or failure. Null if never attempted.
        lastSuccessMs:
          type: [integer, 'null']
          format: int64
          description: Epoch ms of the most recent 2xx-acknowledged batch. Does NOT advance on failure.
        consecutiveFailures:
          type: integer
          description: Non-2xx delivery outcomes since the last success, reset to 0 on every success. Drives the delivery loop's backoff pacing — DELIBERATELY SEPARATE from AdminPlugin.consecutiveFailures (the durable cross-capability breaker-trip counter).
        deliveredBatches:
          type: integer
          format: int64
          description: Lifetime count of 2xx-acknowledged batches. Monotonic, never reset.
        deliveredEvents:
          type: integer
          format: int64
          description: Lifetime count of individual events acknowledged (sum of every acknowledged batch's event count). Monotonic, never reset. Always >= deliveredBatches.
        gapReportedThroughMs:
          type: [integer, 'null']
          format: int64
          description: High-water mark through which a retention-window gap has already been reported to this plugin. Null if no gap has ever been reported.

    UpdatePluginPseudonymizationRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: The new plugins.pseudonymize_actor_ids posture — true (default) sends per-(plugin,user) anonymous ids, false sends real account ids.

    AdminPluginList:
      type: object
      description: listAdminPlugins' result. Deliberately NOT cursor-paginated — see that operation's description.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPlugin' }

    RegisterPluginRequest:
      type: object
      additionalProperties: false
      required: [url, grantedCapabilityTypes, eventTypeGrants, config]
      properties:
        url: { type: string, format: uri }
        grantedCapabilityTypes:
          type: array
          items: { type: string }
          description: Subset of the manifest's declared capability `type` values to enable (LD6 "capability set <= declared").
        eventTypeGrants:
          type: array
          items: { type: string }
          description: Subset of the union of every event-subscriber capability's requested eventTypes to grant (LD6 "event grants <= requested").
        config:
          description: Raw submitted values keyed by configSchema property name — both secret and non-secret fields together (split server-side; secret values are never echoed back).
        lanAllowlist:
          type: array
          items: { type: string }
          description: Explicit LAN hostnames/IPs to permit for this plugin (LD5). Defaults to none.
        manifestDigest:
          type: string
          description: >-
            C-2 fix wave: the `manifestDigest` a prior previewAdminPlugin
            call returned for this exact plugin. Schema-optional (kept
            additive), but ENFORCED as required server-side — omitting it is
            a 422 ("preview this plugin first"), and a value that no longer
            matches a fresh re-fetch is a 409 (the manifest changed since it
            was previewed).

    RegisterPluginResponse:
      type: object
      description: >-
        hmacSecret is returned EXACTLY ONCE — it is never retrievable again
        through any endpoint (LD1). The admin UI must surface it immediately
        with a copy affordance and a "this will not be shown again" notice.
      additionalProperties: false
      required: [plugin, hmacSecret]
      properties:
        plugin: { $ref: '#/components/schemas/AdminPlugin' }
        hmacSecret: { type: string }

    UpdatePluginConfigRequest:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config:
          description: Full replacement set of raw submitted configSchema values (secret + non-secret together, split server-side).

    UpdatePluginEventGrantsRequest:
      type: object
      additionalProperties: false
      required: [eventTypeGrants]
      properties:
        eventTypeGrants:
          type: array
          items: { type: string }
          description: Full replacement grant set — every value must be a member of the currently-stored manifest's requested eventTypes for the granted event-subscriber capability.

    ReapprovePluginRequest:
      type: object
      additionalProperties: false
      required: [grantedCapabilityTypes, eventTypeGrants]
      properties:
        grantedCapabilityTypes:
          type: array
          items: { type: string }
          description: Subset of the freshly re-fetched manifest's declared capability `type` values to enable, exactly like registration.
        eventTypeGrants:
          type: array
          items: { type: string }
        manifestDigest:
          type: string
          description: >-
            C-2 fix wave — see RegisterPluginRequest.manifestDigest's
            description; the identical pin/409 rule applies to the
            re-approval flow's own preview.

    RefreshPluginResponse:
      type: object
      additionalProperties: false
      required: [plugin, expanded, reasons]
      properties:
        plugin: { $ref: '#/components/schemas/AdminPlugin' }
        expanded:
          type: boolean
          description: True iff the re-fetched manifest expanded scope beyond what was previously approved — the plugin was just auto-disabled (disabledReason 'scope-change') and needs reapproveAdminPlugin.
        reasons:
          type: array
          items: { type: string }
          description: Human-readable reasons for the expansion (empty iff !expanded).

    RotatePluginHmacResponse:
      type: object
      description: The new HMAC is returned EXACTLY ONCE, exactly like registerAdminPlugin's hmacSecret — never retrievable again afterward.
      additionalProperties: false
      required: [hmacSecret]
      properties:
        hmacSecret: { type: string }

    # ═══════════════ LPP v1, Lane W5b: library provider chains ═══════════════

    LibraryProviderKind:
      type: string
      enum: [builtin, plugin]
      description: migrations/0015_library_provider_chains.sql's library_provider_kind enum.

    LibraryProviderChainEntryInput:
      type: object
      description: >-
        One chain slot on putAdminLibraryProviderChain — XOR-shaped exactly
        like packages/db's LibraryProviderChainEntryInput: `builtinName`
        required and ONLY legal when providerKind='builtin'; `pluginId`
        required and ONLY legal when providerKind='plugin'. `position` is
        NOT supplied — the array index at request time.
      additionalProperties: false
      required: [providerKind]
      properties:
        providerKind: { $ref: '#/components/schemas/LibraryProviderKind' }
        builtinName: { type: string }
        pluginId: { type: string, format: uuid }

    AdminLibraryProviderChainPluginRef:
      type: object
      description: Resolved display data for a plugin referenced by a chain entry or offered as an eligible choice.
      additionalProperties: false
      required: [id, name, enabled, healthState, contentClass]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        healthState: { $ref: '#/components/schemas/PluginHealthState' }
        contentClass: { $ref: '#/components/schemas/ContentClass' }

    AdminLibraryProviderChainEntry:
      type: object
      description: One resolved slot, read time — a library_provider_entries row (or, when isDefault, a synthesized legacy-default slot) plus resolved plugin display data.
      additionalProperties: false
      required: [position, providerKind, builtinName, pluginId, plugin]
      properties:
        position: { type: integer, minimum: 0 }
        providerKind: { $ref: '#/components/schemas/LibraryProviderKind' }
        builtinName: { type: ['string', 'null'] }
        pluginId: { type: ['string', 'null'], format: uuid }
        plugin:
          description: Resolved display data for a providerKind='plugin' entry — always null for a providerKind='builtin' entry.
          oneOf:
            - { $ref: '#/components/schemas/AdminLibraryProviderChainPluginRef' }
            - { type: 'null' }

    AdminLibraryProviderChain:
      type: object
      description: getAdminLibraryProviderChain / putAdminLibraryProviderChain's shared response shape — see either operation's description for isDefault/eligiblePlugins semantics.
      additionalProperties: false
      required: [libraryId, isDefault, entries, eligiblePlugins, builtinProviderNames]
      properties:
        libraryId: { type: string, format: uuid }
        isDefault:
          type: boolean
          description: True iff this library has zero library_provider_entries rows — `entries` then shows the legacy default chain, read-only.
        entries:
          type: array
          items: { $ref: '#/components/schemas/AdminLibraryProviderChainEntry' }
        eligiblePlugins:
          type: array
          items: { $ref: '#/components/schemas/AdminLibraryProviderChainPluginRef' }
          description: Every registered plugin whose contentClass strictly equals this library's contentClass (LPP C5 STRICT) — the add-entry picker's plugin choices.
        builtinProviderNames:
          type: array
          items: { type: string }
          description: Known built-in provider names (apps/worker/src/metadata/registry.ts) — always eligible for any library regardless of contentClass.

    PutAdminLibraryProviderChainRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/LibraryProviderChainEntryInput' }

    # ──────── Stash sync report (S8/K14, Lane C sync engine) ────────

    StashSyncReport:
      type: object
      description: One migrations/0020_stash_sync_reports.sql row — the most recently STARTED stash-sync run for a library. Counts are a point-in-time snapshot recorded when the run finished (or failed), never a live query.
      additionalProperties: false
      required: [jobId, mode, status, matchedCount, updatedCount, unmatchedCount, staleCount, skippedCount, startedAtMs, finishedAtMs, usedSnapshotFallback]
      properties:
        jobId: { type: string, format: uuid }
        mode: { type: string, enum: [full, incremental] }
        status:
          type: string
          enum: [running, succeeded, failed, partial]
          description: '''running'' means the job is still in flight (or crashed before its terminal-failure hook ran) — finishedAtMs is null in that case.'
        matchedCount: { type: integer, minimum: 0 }
        updatedCount: { type: integer, minimum: 0 }
        unmatchedCount: { type: integer, minimum: 0 }
        staleCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
        startedAtMs: { type: integer, format: int64 }
        finishedAtMs:
          type: [integer, 'null']
          format: int64
          description: Null while status='running'.
        usedSnapshotFallback:
          type: ['boolean', 'null']
          description: >-
            FX4 fix wave (S2): whether this run's Stash connection had to
            fall back to a snapshot copy (apps/worker/src/stash/adapter.ts's
            readingFrom === 'snapshot' — the WAL-locked-past-retry-budget
            path) rather than reading the source database file directly.
            Null when unknown — a run finalized by the terminal-failure
            hook never learns the answer (no access to the failed attempt's
            connection), and rows written before this field existed are
            also null, never a false claim of 'read from source'.

    StashSyncSceneRef:
      type: object
      description: One stash_scene_links row, live-read (never a report snapshot) — see getAdminStashSyncReport's own description.
      additionalProperties: false
      required: [stashSceneId, stashPath, stashUpdatedAtMs]
      properties:
        stashSceneId: { type: string, description: "Stash's own scene identifier, as a string (never assumed numeric)." }
        stashPath: { type: string, description: "The Stash-reported file path for this scene, UNMAPPED (raw, before any library path-mapping rewrite)." }
        stashUpdatedAtMs:
          type: [integer, 'null']
          format: int64
          description: Stash's own updated_at for this scene, converted to epoch ms; null when Stash never recorded one for it.

    StashSyncSceneRefPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StashSyncSceneRef' }
        nextCursor: { type: [string, 'null'] }

    StashSyncLoombreFileRef:
      type: object
      description: >-
        FX3 fix wave (S4/S8 "both unmatched sides" law): one media_files row
        in the connected library with NO stash_scene_links row pointing at
        its item — the Loombre-side half of S4's matching set-difference
        (apps/worker/src/stash/matching.ts documents this as the caller's
        responsibility; nothing computed it until now). Live-read, same
        posture as StashSyncSceneRef (never a report snapshot).
      additionalProperties: false
      required: [mediaFileId, itemId, itemTitle, path, sizeBytes]
      properties:
        mediaFileId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemTitle: { type: string, description: "The catalog item's title — what an admin needs to recognize the file." }
        path: { type: string, description: 'The Loombre-side media_files.path.' }
        sizeBytes: { type: [integer, 'null'], format: int64 }

    StashSyncLoombreFileRefPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StashSyncLoombreFileRef' }
        nextCursor: { type: [string, 'null'] }

    StashSyncReportEnvelope:
      type: object
      additionalProperties: false
      required: [report, unmatchedScenes, staleScenes, unmatchedLoombreFiles]
      properties:
        report:
          oneOf:
            - { $ref: '#/components/schemas/StashSyncReport' }
            - { type: 'null' }
          description: Null when no stash-sync job has ever run for this library.
        unmatchedScenes: { $ref: '#/components/schemas/StashSyncSceneRefPage' }
        staleScenes: { $ref: '#/components/schemas/StashSyncSceneRefPage' }
        unmatchedLoombreFiles: { $ref: '#/components/schemas/StashSyncLoombreFileRefPage' }

    # ═══════════ Remote access — Loombre Remote / Tunnel / Direct ═══════════
    # STATE.md "Loombre Remote — embedded WireGuard + three-path wizard +
    # reachability proof + posture card", Wave 0 (lane/remote-base).
    RemotePathId:
      type: string
      enum: [none, remote, tunnel, direct]
      description: >-
        DERIVED, never a stored setting (RG15 — RG5's activePath wording
        refined at Wave-0 freeze): `none` when no path is enabled; at most
        one of `remote`/`tunnel`/`direct` can be enabled at a time, enforced
        by each path's staged enable flow returning 409 against another
        active path.

    RemoteState:
      type: object
      additionalProperties: false
      required: [activePath, wireguard, tunnel, direct]
      properties:
        activePath: { $ref: '#/components/schemas/RemotePathId' }
        wireguard: { $ref: '#/components/schemas/RemoteWireguardStatus' }
        tunnel: { $ref: '#/components/schemas/RemoteTunnelStatus' }
        direct: { $ref: '#/components/schemas/RemoteDirectStatus' }

    RemoteWireguardStatus:
      type: object
      additionalProperties: false
      required: [enabled, listening, listenPort, subnet, endpointHost, peerCount]
      properties:
        enabled: { type: boolean, description: 'Configured on (a server keypair exists and enrollment is possible).' }
        listening: { type: boolean, description: 'The in-process userspace UDP listener is actually live right now (RG1/RG2).' }
        listenPort: { type: integer, minimum: 1, maximum: 65535, description: 'remote.wireguardPort effective value.' }
        subnet: { type: string, description: 'remote.subnet effective value, CIDR (RG9).' }
        endpointHost:
          type: [string, 'null']
          description: remote.wireguardEndpointHost effective value; null when unset.
        peerCount: { type: integer, minimum: 0 }

    RemoteWireguardDevice:
      type: object
      additionalProperties: false
      required: [id, userId, name, tunnelIp, createdAtMs, lastHandshakeAtMs]
      properties:
        id:
          type: string
          format: uuid
          description: Same id as the underlying devices row (kind='remote', R2) — this IS that row, not a separate entity.
        userId: { type: string, format: uuid }
        name: { type: string }
        tunnelIp: { type: string, description: 'Stable address from the tunnel subnet (RG9), e.g. 10.82.146.2.' }
        createdAtMs: { type: integer, format: int64 }
        lastHandshakeAtMs: { type: [integer, 'null'], format: int64, description: 'Null until the peer has ever completed a WireGuard handshake.' }

    RemoteWireguardDevicePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RemoteWireguardDevice' }
        nextCursor: { type: [string, 'null'] }

    EnrollRemoteWireguardDeviceRequest:
      type: object
      additionalProperties: false
      required: [userId, name]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, minLength: 1, description: 'Device label, e.g. "Alex''s iPhone".' }

    RemoteWireguardEnrollment:
      type: object
      additionalProperties: false
      description: >-
        The one-time provisioning payload (R2/R3) — configText is shown
        exactly once and never retrievable again through this API (same
        posture as invite links); the server does not retain the private
        key after this response.
      required: [device, configText]
      properties:
        device: { $ref: '#/components/schemas/RemoteWireguardDevice' }
        configText:
          type: string
          description: >-
            Standard wg-quick config text (packages/shared/src/remote/
            provisioning.ts, PROVISIONING_FORMAT_VERSION), split-tunnel
            only (AllowedIPs = the server tunnel IP/32, R3). Render this as
            a QR for mobile import or offer it as a downloadable .conf for
            desktop WireGuard clients.

    SetRemoteTunnelTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: The scoped Cloudflare API token. Write-only — never returned by any endpoint.

    RemoteTunnelTokenValidation:
      type: object
      additionalProperties: false
      required: [valid, detail]
      properties:
        valid: { type: boolean }
        detail: { type: [string, 'null'], description: 'Human-readable validation detail (e.g. why an invalid token failed). Never echoes the token itself.' }

    EnableRemoteTunnelRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname:
          type: string
          minLength: 1
          description: The public hostname to route through the tunnel (a DNS route is created for it, R4).

    RemoteTunnelStatus:
      type: object
      additionalProperties: false
      required: [enabled, connectorState, hostname, backoffMs, lastErrorMessage, tokenConfigured, tokenSetAtMs, tokenScopesOk]
      properties:
        enabled: { type: boolean }
        connectorState:
          type: string
          enum: [stopped, starting, running, degraded, error]
          description: The supervised cloudflared child process's current lifecycle state (RG7).
        hostname: { type: [string, 'null'] }
        backoffMs: { type: [integer, 'null'], format: int64, description: 'Current restart backoff (full jitter, RG7); null when not backing off.' }
        lastErrorMessage: { type: [string, 'null'] }
        tokenConfigured:
          type: boolean
          description: >-
            Whether a Cloudflare API token is currently stored in the
            keyring (write-only, R4/R9 — this field NEVER carries the token
            itself, by construction). ADDITIVE T1 extension to the Wave-0
            frozen shape: the 6-op Tunnel surface has no other place a
            standing "is a token configured" read can live (setRemoteTunnelToken's
            200 is an ephemeral validation-at-write-time response, not an
            ongoing status).
        tokenSetAtMs:
          type: [integer, 'null']
          format: int64
          description: When the currently-stored token was set; null when none is configured.
        tokenScopesOk:
          type: [boolean, 'null']
          description: >-
            Whether the stored token's Cloudflare permissions were
            sufficient the last time they were actually checked (at set
            time, or at the most recent enable attempt) — null when no
            token is configured. NOT re-validated live on every status
            read (Tier-0 rule: status reads do no live network work); a
            token whose Cloudflare-
            side scopes are revoked after being stored keeps reporting
            true here until re-set or until a real provisioning call
            surfaces the truth.

    RemoteTunnelLogs:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          items: { type: string }

    TestRemoteDirectAcmeRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: { type: string, minLength: 1 }

    RemoteDirectAcmeTestResult:
      type: object
      additionalProperties: false
      required: [success, detail]
      properties:
        success: { type: boolean }
        detail: { type: [string, 'null'] }

    EnableRemoteDirectRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [acme, reverse-proxy] }
        domain: { type: [string, 'null'], description: 'Required in effect for mode=acme (422 when absent); ignored for mode=reverse-proxy.' }

    RemoteDirectStatus:
      type: object
      additionalProperties: false
      required: [enabled, mode, domain, certValid, certExpiresAtMs]
      properties:
        enabled: { type: boolean }
        mode: { type: [string, 'null'], enum: [acme, 'reverse-proxy', null] }
        domain: { type: [string, 'null'] }
        certValid: { type: [boolean, 'null'], description: 'Null when mode is not acme, or no issuance has completed yet.' }
        certExpiresAtMs: { type: [integer, 'null'], format: int64 }

    DiagnosisCode:
      type: string
      enum: [portBlocked, cgnat, doubleNat, dnsMismatch, tunnelDown, connectorUnhealthy, unknown]
      description: packages/shared/src/remote/diagnosis.ts's closed classification union (R5/R6/RG11).

    DiagnoseRemoteRequest:
      type: object
      additionalProperties: false
      description: >-
        P1 ADJUDICATION (flagged, no R/RG number covers it exactly — logged
        at integration): `path` was added to this Wave-0-frozen schema
        (additive, D23-class precedent: F2's currentPassword/R-F3's
        maximum bound both landed the same way) because the Tunnel-path
        connector-health short-circuit (the freeze's own diagnosis note)
        and the per-path guidance mapping (packages/shared/src/remote/
        diagnosis-guidance.ts) both need to know which path is being
        diagnosed, and nothing server-side can safely infer it —
        RemotePathId's activePath is cross-lane DERIVED state this lane's
        isolated worktree cannot read. The wizard already knows its own
        current flow, so it supplies it explicitly.
      required: [expectedEndpoint, path]
      properties:
        expectedEndpoint: { type: string, minLength: 1, description: 'The public endpoint the reachability proof was bound to.' }
        wanAddress:
          type: [string, 'null']
          description: Admin-supplied WAN address from a guided router-status-page instruction card (RG11 — no third-party echo service, no router APIs).
        path:
          $ref: '#/components/schemas/RemotePathId'
          description: >-
            Which path is being diagnosed (P1 adjudication, see this
            schema's own description). Must be remote/tunnel/direct —
            'none' is rejected with 422 (there is nothing to diagnose when
            no path is even being set up).

    RemoteDiagnosisResult:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code: { $ref: '#/components/schemas/DiagnosisCode' }
        detail: { type: string }

    CreateRemoteProbeRequest:
      type: object
      additionalProperties: false
      description: >-
        P1 ADJUDICATION (flagged — same reasoning as DiagnoseRemoteRequest's
        own description): `path` was added to this Wave-0-frozen schema so
        `probe_tokens.path` (migrations/0031_probe_tokens.sql — "which
        remote path is being proven") has somewhere to come from; a probe
        is always minted for one specific path's setup flow.
      required: [expectedEndpoint, path]
      properties:
        expectedEndpoint: { type: string, minLength: 1 }
        path:
          $ref: '#/components/schemas/RemotePathId'
          description: 'Which path this probe proves. Must be remote/tunnel/direct — ''none'' is rejected with 422.'

    RemoteProbeToken:
      type: object
      additionalProperties: false
      description: The raw token appears ONLY here (R6) — embedded in probeUrl/qrPayload, never retrievable again.
      required: [id, probeUrl, qrPayload, expiresAtMs]
      properties:
        id: { type: string, format: uuid }
        probeUrl: { type: string, description: 'https://<endpoint>/probe/<token> — the exact URL GET /probe/{token} serves.' }
        qrPayload: { type: string, description: 'The payload to render as a QR code (probeUrl, R6/RG8).' }
        expiresAtMs: { type: integer, format: int64, description: '15-minute expiry from mint time (R6).' }

    RemoteProbeStatus:
      type: object
      additionalProperties: false
      required: [id, status, arrivedAtMs, diagnosis]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, arrived, expired] }
        arrivedAtMs: { type: [integer, 'null'], format: int64 }
        diagnosis:
          oneOf:
            - { $ref: '#/components/schemas/RemoteDiagnosisResult' }
            - { type: 'null' }
          description: Populated once the probe has definitively failed to arrive; null while still pending or once arrived.

    # DRIFT DECISION #1 (S1 lane, logged at Wave-0 freeze): GET /admin/
    # remote/posture's response schemas. Mirrors packages/shared/src/
    # remote/posture-model.ts's frozen closed unions (POSTURE_CHECK_KEYS,
    # PostureGrade) exactly — this contract enum and that TS union are
    # pinned to stay identical by apps/server/src/remote/posture/checks/*
    # (every grading function returns a PostureGrade) and by the shared
    # module's own test suite; there is no separate cross-check test for
    # contract-vs-TS-union drift here, the same posture DiagnosisCode above
    # already takes with packages/shared/src/remote/diagnosis.ts.
    RemotePostureCheckKey:
      type: string
      enum: [tlsValidity, rateLimitersActive, staleAccounts, inviteLinksReachable, wgPortSilence, connectorHealth, publicUrlCoherence]
      description: packages/shared/src/remote/posture-model.ts's frozen POSTURE_CHECK_KEYS (R7).

    RemotePostureGrade:
      type: string
      enum: [pass, warn, fail, info]
      description: >-
        packages/shared/src/remote/posture-model.ts's frozen PostureGrade.
        `info` is a genuine, honest grade some checks can NEVER rise above
        (e.g. wgPortSilence — a server can never confirm its own external
        silence; see apps/server/src/remote/posture/checks/
        wg-port-silence.ts) — never a "pass, softened for display."

    RemotePostureFixAction:
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string, description: 'An apps/web router path the admin UI can route to directly (posture-model.ts''s frozen POSTURE_CHECK_FIX_ACTIONS).' }

    RemotePostureCheck:
      type: object
      additionalProperties: false
      required: [key, grade, detail, fixAction]
      properties:
        key: { $ref: '#/components/schemas/RemotePostureCheckKey' }
        grade: { $ref: '#/components/schemas/RemotePostureGrade' }
        detail: { type: string, description: 'Human-readable sentence explaining this check''s current grade.' }
        fixAction: { $ref: '#/components/schemas/RemotePostureFixAction' }

    RemotePostureCard:
      type: object
      additionalProperties: false
      required: [checks, overallGrade, evaluatedAtMs]
      properties:
        checks:
          type: array
          items: { $ref: '#/components/schemas/RemotePostureCheck' }
          description: >-
            Empty when no remote-access path is enabled (posture-model.ts's
            deriveCardState: the card itself is inactive) — every active
            path always yields at least one applicable check, so an empty
            array is unambiguous and no separate "active" flag is exposed.
        overallGrade: { $ref: '#/components/schemas/RemotePostureGrade' }
        evaluatedAtMs: { type: integer, format: int64, description: 'When this evaluation ran — a stateless "evaluate now" read, not a cached value.' }
