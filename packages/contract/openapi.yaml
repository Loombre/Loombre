openapi: 3.1.0
info:
  title: Loombre API
  version: 1.0.0
  summary: >-
    Contract-first API for Loombre, a ground-up self-hosted media streaming
    platform (movies, TV, music).
  description: >-
    This document is the source of truth: apps/server controllers conform to
    it and packages/sdk is generated from it — never hand-authored.


    Conventions (apply globally; see components/ for shared shapes): all
    timestamps are BIGINT epoch milliseconds as JSON integers with field
    names suffixed `Ms`; all ids are UUIDv7 strings; all list endpoints use
    cursor pagination (`{ items, nextCursor }`, with `?cursor=&limit=` query
    params); all 4xx/5xx responses are RFC 9457 `application/problem+json`;
    enums are closed OpenAPI enums; core entity schemas set
    `additionalProperties: false`.


    Evolution policy: additive-only within a major version (docs/PLAN.md
    §4.1) — CI runs oasdiff against `main` and fails the build on any
    breaking change classification. Deprecated operations carry
    `deprecated: true` plus a `Sunset` response header for two minor releases
    minimum before a major bump.
  license:
    name: AGPL-3.0-relicense-pending
    identifier: LicenseRef-Loombre-Private
externalDocs:
  description: Loombre documentation
  url: https://loombre.com/docs/
servers:
  - url: /v1
    description: Loombre API, version 1 (path-prefixed; host is deployment-specific)
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, token refresh, logout, device sessions
  - name: devices
    description: Registered client devices and their capability profiles
  - name: system
    description: Capability negotiation and instance information
  - name: users
    description: User accounts, self-service profile and settings
  - name: invites
    description: One-time, expiring invite links (admin) and the public self-serve claim flow
  - name: notices
    description: >-
      Admin broadcast notifications (publish/cancel/history, admin) and the
      all-user active-notice read — delivered live over the events socket
      AND polled on boot/reconnect (notice.published/notice.cancelled)
  - name: libraries
    description: Media libraries, scanning, per-user permissions
  - name: catalog-video
    description: Movies and TV catalog reads
  - name: catalog-music
    description: Music catalog reads
  - name: cross-type
    description: Search and home-screen surfaces spanning item types
  - name: people
    description: Credited people (actors, directors, ...) — a leak-checked metadata surface (restricted-content isolation applies)
  - name: tags
    description: Genres and free-form tags — a leak-checked metadata surface (restricted-content isolation applies)
  - name: images
    description: Pre-scaled managed image cache
  - name: playback
    description: Playback plan decisions and HLS session lifecycle
  - name: progress
    description: Per-user watch/listen progress
  - name: watchlist
    description: >-
      Per-user saved-items list — syncs across
      devices via the events socket (watchlist.added/watchlist.removed)
  - name: restricted
    description: Restricted (adult) content gating — session unlock/lock
  - name: data-freedom
    description: Open-format export/import (docs/PLAN.md §8.4)
  - name: admin
    description: Admin-only job ledger introspection, settings, and plugin management (LPP v1)
  - name: remote
    description: >-
      Loombre Remote (embedded userspace WireGuard), BYO-token Cloudflare
      tunnel, and Direct (ACME/reverse-proxy) — the three remote-access
      paths, their wizard re-entry state, the cellular-QR reachability
      proof, and the public probe-arrival page. Every mutation is admin
      + live-isAdmin (A10 pattern); GET /probe/{token} is this run's only
      public operation in this tag (`security: []`) — see its own
      description for the enumeration-resistant posture.
  - name: setup
    description: >-
      First-boot onboarding: usable ONLY while the
      instance has zero users; permanently inert afterwards

paths:
  # ─────────────────────────── First-boot setup ────────────────────────────
  /setup/state:
    get:
      operationId: getSetupState
      tags: [setup]
      summary: Whether this instance still needs first-boot setup
      description: >-
        Public by necessity (the wizard runs before any credentials exist).
        Deliberately answers ONE boolean and nothing else — no version, no
        counts, no capability data (that is authenticated surface). Rate-
        limited like every unauthenticated endpoint.
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '429':
          description: Rate limited (unauthenticated surface)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
        default: { $ref: '#/components/responses/Problem' }

  /setup/first-admin:
    post:
      operationId: createFirstAdmin
      tags: [setup]
      summary: Create the instance's first admin account (first boot only)
      description: >-
        Succeeds ONLY while the users table is empty —
        the one-time escape from the admin-creates-users chicken-and-egg.
        Once ANY user exists this endpoint is permanently inert and
        answers the shared not-found problem — byte-identical to what an
        unknown route answers at this same path (an attacker probing a
        configured instance learns nothing — same posture as
        restricted-content 404s, docs/PLAN.md §6.4; see the `NotFound`
        response for the exact body). Responds with the
        created admin plus a real token pair so the wizard proceeds
        authenticated without a second login round-trip.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstAdminRequest' }
      responses:
        '201':
          description: First admin created; wizard continues authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstAdminResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ────────────────────────── Public claim surface (E2/M12) ─────────────────
  # F1 (opus adversarial review, fix wave): mounted under /invites, NOT the
  # bare /claim/{token} this pair originally shared with the Next.js web
  # page at apps/web/src/app/claim/[token] — docs/ops/reverse-proxy.md
  # routes /claim/* to the API, so a real invite link opened JSON instead
  # of the claim page. /reset/{token} and /forgot avoided this collision
  # from the start by living under distinct API paths (/auth/*-password);
  # this pair now does too. The WEB PAGE ROUTE is UNCHANGED — still
  # /claim/[token], still the human URL in every invite link
  # (composeClaimUrl in invites.controller.ts) — only the JSON API's own
  # mounted path moved. operationIds are UNCHANGED (getClaimState/
  # claimInvite), so nothing keyed by operationId (conformance's
  # PUBLIC_OPERATION_IDS/IMPLEMENTED maps) needed a key change.
  /invites/claim/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
        description: The raw one-time invite token (never the hash).
    get:
      operationId: getClaimState
      tags: [invites]
      summary: Resolve an invite token's presets, without claiming it
      description: >-
        Public (M12). Invalid, expired, already-claimed, or revoked tokens
        all resolve to the shared not-found problem (see the `NotFound`
        response): BYTE-IDENTICAL across the four cases, and BYTE-IDENTICAL
        to what an unknown route answers at this same path — `instance` is
        this route's TEMPLATE, never the submitted token, so nothing in the
        body varies with what was probed. Same "invisible == nonexistent"
        posture as POST /setup/first-admin once configured; the four cases
        are deliberately indistinguishable from the outside.
      security: []
      responses:
        '200':
          description: Live invite presets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimState' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Rate limited (unauthenticated surface)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: claimInvite
      tags: [invites]
      summary: Claim an invite, creating an account and signing in
      description: >-
        Public (M12). Same byte-identical-404 posture as getClaimState for
        an invalid/expired/claimed/revoked token — a username collision
        against an OTHERWISE valid token is a distinct 422 (the token
        itself was fine). Auto-logs in on success (M13): the response is a
        real TokenPair, same composition as POST /setup/first-admin's own
        token minting, additively carrying `emailApplied` (LD-13c — see
        TokenPair's own property description).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInviteRequest' }
      responses:
        '201':
          description: Claimed; account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (unauthenticated surface)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Auth / devices ─────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Authenticate with credentials and register/refresh a device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-IP login attempts)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Rotate a device's refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Rate limited (per-IP refresh attempts)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Revoke the current device's refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [auth]
      summary: Request a self-service password-reset email (E3b)
      description: >-
        PUBLIC, unauthenticated, and deliberately unenumerable: the response
        is the SAME 202 with the SAME body whether or not `identifier`
        resolves to a real account, whether or not that account has an
        email on file, and whether or not mail is configured on this
        instance — a caller can never distinguish any of those cases from
        the response alone. When `identifier` does resolve to a real
        account with an email on file, a single-use, 30-minute reset token
        is minted (invalidating that account's previously-issued unused
        tokens) and a `password-reset` mail is dispatched through the mail
        seam (`MailDispatchService.trySend`, non-fatal — a dead/unconfigured
        mail system never changes this response). Rate-limited per
        `rateLimit.passwordReset` (shared with `authResetPassword`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: >-
            Always this exact body, regardless of whether the account/email
            exists or mail is configured (anti-enumeration, E3b/E8).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForgotPasswordResponse' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-IP, shared with authResetPassword)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Complete a self-service password reset with a mailed token (E3b)
      description: >-
        PUBLIC, unauthenticated. Atomically consumes `token` (single-use;
        a concurrent second consume of the same token loses the race) and,
        on success, sets `password`, revokes every refresh token the
        account holds, and clears `mustChangePassword` if it was set — one
        transaction. An invalid, expired, already-used, or well-formed-but-
        unknown token all produce the IDENTICAL 404 this operation shares
        with an unknown route at this same path (the shared not-found
        problem — a fixed generic `detail` and an `instance` that is the
        request path and nothing else; M12/E8: none of those cases may be
        distinguishable from one another or from a malformed request to a
        nonexistent path). Rate-limited per
        `rateLimit.passwordReset` (shared with `authForgotPassword`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password reset; the token is now consumed }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-IP, shared with authForgotPassword)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices registered to the current user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device by id
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device (deletes it and invalidates its refresh token)
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────────── System ─────────────────────────────────
  /system/capabilities:
    get:
      operationId: getSystemCapabilities
      tags: [system]
      summary: Feature-flag negotiation (public, with one auth-scoped entry)
      description: >-
        Reachable with no credentials, but the report is AUTH-SCOPED. An
        authenticated caller — any session, admin or not — gets an entry for
        every known CapabilityFlag. An unauthenticated caller gets the same
        report with `restricted-content` OMITTED from both `flags` and
        `details`: absent, never `enabled: false`, so the anonymous response
        is byte-identical whether or not this operator has switched
        restricted-content gating on (docs/PLAN.md 6.4 gate 1 — whether the
        zone exists on this instance is not an anonymous fact). An invalid or
        expired Bearer token is treated as unauthenticated; this operation
        never answers 401. Entitlement (gates 2-5) is unaffected: only gate
        1's VISIBILITY is scoped here.
      security: []
      responses:
        '200':
          description: >-
            Capabilities this server offers the calling audience. Values are
            the instance's LIVE state, not build-time constants — every known
            flag for an authenticated caller, all but `restricted-content`
            for an anonymous one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Admin-only instance information
      responses:
        '200':
          description: System info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /system/update:
    get:
      operationId: getSystemUpdate
      tags: [system]
      summary: Admin-only notify-only update check
      description: >-
        Never triggers a download and never auto-applies anything — this is
        display data only. Serves the server's last completed manifest
        check (LOOMBRE_UPDATE_CHECK=off|manual|daily, default daily; see
        docs/ops/updating.md for exactly what the outbound manifest request
        does and does not contain — zero identifying payload). When
        LOOMBRE_UPDATE_CHECK=off, `verification` is always `disabled` and
        `latestVersion`/`notesUrl`/`checkedAtMs` are always null; the
        manifest mirror is never contacted.
      responses:
        '200':
          description: Update check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemUpdateInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /system/restart:
    post:
      operationId: restartServer
      tags: [system]
      summary: Admin-only graceful server restart
      description: >-
        Gracefully restarts the server process. The 202 is flushed to the
        socket BEFORE teardown begins (same ordering contract as the
        controller-IPC stop), then the server runs its normal graceful
        shutdown (HTTP close, embedded-PostgreSQL stop) and exits with the
        documented restart exit code so the platform supervisor (launchd /
        systemd / Windows SCM recovery / Docker restart policy) starts it
        again — typically within 5–15 seconds. Settings marked
        `requiresRestart` take effect on the restarted process. Only the
        server process restarts; the worker and web services are untouched.
        In an unsupervised context (bare `node`, dev harness) the process
        simply exits and nothing restarts it — deployment docs state this.
      responses:
        '202':
          description: Restart accepted; teardown begins after this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerPowerActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /system/shutdown:
    post:
      operationId: shutdownServer
      tags: [system]
      summary: Admin-only graceful server shutdown
      description: >-
        Gracefully stops the server process — the same in-band self-stop the
        desktop controllers' "Stop server" performs. The 202 is flushed
        before teardown begins; the process then exits cleanly (exit 0),
        which every shipped service supervisor except Docker treats as
        "stay stopped" (launchd `SuccessfulExit=false`, systemd
        `Restart=on-failure`, the Windows service host's clean-child-exit
        stop). The server stays down until started out-of-band (menubar/tray
        controller, launchctl/systemctl/SCM, or reboot — the services are
        boot-started). Only the server stops; worker and web services keep
        running. Under a container supervisor whose restart policy ignores
        exit codes (the shipped Docker compose file's `unless-stopped`),
        an in-process exit CANNOT keep the container down, so the request
        is refused with 409 instead of pretending.
      responses:
        '202':
          description: Shutdown accepted; teardown begins after this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerPowerActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            This deployment's supervisor would immediately restart an
            exited server (container `restart: unless-stopped` — the server
            advertises this via its supervision environment), so an
            in-process shutdown cannot deliver "stays stopped." Stop the
            container from outside instead (`docker compose stop`). The
            problem `code` is `shutdown-unsupported-under-container-supervision`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────── System notices (admin broadcast) ─────────────────
  /system/notices:
    get:
      operationId: listSystemNotices
      tags: [notices]
      summary: List notice history, newest first (admin)
      description: >-
        Every notice ever published, cursor-paginated newest-first —
        including cancelled and naturally-expired ones (an audit history,
        not just the currently-active notice; use GET /notices/active for
        that). Each row's `status` is derived at read time, never stored.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of notices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemNoticePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishSystemNotice
      tags: [notices]
      summary: Publish a system notice, replacing any currently-active one (admin)
      description: >-
        Publishing supersedes any active notice — v1 holds exactly ONE
        active notice at a time (a notice channel that stacks becomes
        noise), so this call cancels whichever notice is currently active
        and inserts the new one in the same transaction. The request
        carries RELATIVE durations (`effectiveInMs`/`expiresInMs`); the
        server anchors both to its own clock and returns absolute
        `effectiveAtMs`/`expiresAtMs`, eliminating compose-time clock skew
        by construction. Severity governs expiry defaults: `info` defaults
        to a 1-hour expiry when `expiresInMs` is omitted; `warning`
        REQUIRES `expiresInMs` (422 when absent — a maintenance banner
        must not linger forever by accident); `critical` may omit
        `expiresInMs` entirely, meaning "until cancelled". Delivered live
        over the events socket (`notice.published`, all-user broadcast)
        and via GET /notices/active for anyone who connects after
        publication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishSystemNoticeRequest' }
      responses:
        '201':
          description: Notice published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemNotice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /system/notices/{id}/cancel:
    post:
      operationId: cancelSystemNotice
      tags: [notices]
      summary: Cancel a notice (admin)
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Notice cancelled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            Unknown notice id, OR the notice is already inactive (already
            cancelled, or its own expiresAtMs has already passed) —
            "nothing left to cancel" (invites revokeInvite precedent).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /notices/active:
    get:
      operationId: getActiveSystemNotice
      tags: [notices]
      summary: The currently-active notice, if any (any authenticated user)
      description: >-
        NOT admin-only — every authenticated user calls this, on auth boot
        and on every websocket reconnect (the catch-up read for anyone who
        was not connected at publish time; live delivery alone only
        reaches sockets connected at that moment). `serverNowMs` is the
        clock anchor a client renders any countdown against
        (`effectiveAtMs - (Date.now() + (serverNowMs - Date.now()))`),
        never the client's own wall clock alone.
      responses:
        '200':
          description: Active notice, or null when none is active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveSystemNoticeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  # ────────────────────────────────── Users ──────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The `username`, or the `email` if one was supplied, already
            belongs to another account. Both are compared
            case-insensitively (CITEXT), so a case-only variant of a taken
            value conflicts too. The `detail` names which of the two
            collided; nothing else about the existing account is
            disclosed. This endpoint is admin-only and admins already
            enumerate every account via `GET /users`, so a truthful
            conflict here reveals nothing they could not already read.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by id (admin)
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The supplied `email` already belongs to another account (G9).
            Compared case-insensitively (CITEXT) after trimming, so a
            case-only or padded variant of a taken address conflicts too.
            Only `email` can collide on this operation — `username` is not
            updatable here. Same admin-only disclosure posture as
            `createUser`'s 409: admins already enumerate every account via
            `GET /users`, so a truthful conflict reveals nothing new, and
            nothing else about the existing account is disclosed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: adminResetUserPassword
      tags: [users]
      summary: Admin/CLI password recovery, tier (a) (E3a/M14)
      description: >-
        Generates a random temporary password, argon2id-hashes and stores
        it, sets `mustChangePassword` on the target user, and revokes EVERY
        refresh token they hold (every existing session ends). The
        temporary password is returned ONCE in this response and is never
        retrievable again — the server keeps only its hash. Self-reset (an
        admin resetting their own account) is permitted — they know the
        consequence — but requires `currentPassword` (R-F3, opus
        adversarial review fix wave: a bearer token alone must never mint
        a permanent account takeover, same F1 reasoning as `PATCH
        /users/me`/`PUT /users/me/restricted`). Resetting ANOTHER user's
        password needs no `currentPassword` — that path is already
        live-admin-verified and audited. When the mail tier is active and
        the target user has an email on file, a non-fatal `security-notice`
        mail is also dispatched. The CLI twin of this action, `loombre
        admin reset-password <username>`, performs the identical semantics
        with `actor: "cli"` instead of `actor: "admin"` on the resulting
        `user.password-reset` event.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminResetPasswordRequest' }
      responses:
        '200':
          description: Temporary password generated; shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResetPasswordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-user current-password attempts, self-reset only)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's own profile
      description: >-
        G3 (STATE.md "Current-password re-auth on self-changes"): a body
        containing `password` and/or `email` (any value, `null` included)
        requires `currentPassword` — see UpdateMeRequest's own
        `dependentRequired`. A missing/wrong currentPassword when required
        403s/422s; a bodyless or displayName/birthDate-only body needs no
        re-auth.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-user current-password attempts)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me/settings:
    get:
      operationId: getMySettings
      tags: [users]
      summary: Get the current user's settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
