openapi: 3.1.0
info:
  title: Loombre API
  version: 1.0.0
  summary: >-
    Contract-first API for Loombre, a ground-up self-hosted media streaming
    platform (movies, TV, music).
  description: >-
    This document is the source of truth (CLAUDE.md architecture invariant
    #1): apps/server controllers conform to it and packages/sdk is generated
    from it — never hand-authored.


    Conventions (apply globally; see components/ for shared shapes): all
    timestamps are BIGINT epoch milliseconds as JSON integers with field
    names suffixed `Ms`; all ids are UUIDv7 strings; all list endpoints use
    cursor pagination (`{ items, nextCursor }`, with `?cursor=&limit=` query
    params); all 4xx/5xx responses are RFC 9457 `application/problem+json`;
    enums are closed OpenAPI enums; core entity schemas set
    `additionalProperties: false`.


    Evolution policy: additive-only within a major version (docs/PLAN.md
    §4.1) — CI runs oasdiff against `main` and fails the build on any
    breaking change classification. Deprecated operations carry
    `deprecated: true` plus a `Sunset` response header for two minor releases
    minimum before a major bump.
  license:
    name: AGPL-3.0-relicense-pending
    identifier: LicenseRef-Loombre-Private
externalDocs:
  description: docs/PLAN.md (spec) and docs/PLAYBACK.md (playback engine annex)
  url: https://example.invalid/docs/PLAN.md
servers:
  - url: /v1
    description: Loombre API, version 1 (path-prefixed; host is deployment-specific)
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login, token refresh, logout, device sessions
  - name: devices
    description: Registered client devices and their capability profiles
  - name: system
    description: Capability negotiation and instance information
  - name: users
    description: User accounts, self-service profile and settings
  - name: libraries
    description: Media libraries, scanning, per-user permissions
  - name: catalog-video
    description: Movies and TV catalog reads
  - name: catalog-music
    description: Music catalog reads
  - name: cross-type
    description: Search and home-screen surfaces spanning item types
  - name: people
    description: Credited people (actors, directors, ...) — a leak-checked metadata surface (docs/PLAN.md §6.4)
  - name: tags
    description: Genres and free-form tags — a leak-checked metadata surface (docs/PLAN.md §6.4)
  - name: images
    description: Pre-scaled managed image cache
  - name: playback
    description: Playback plan decisions and HLS session lifecycle
  - name: progress
    description: Per-user watch/listen progress
  - name: watchlist
    description: >-
      Per-user saved-items list (Phosphor Wave 2 lane L3) — syncs across
      devices via the events socket (watchlist.added/watchlist.removed)
  - name: restricted
    description: Restricted (adult) content gating — session unlock/lock
  - name: data-freedom
    description: Open-format export/import (docs/PLAN.md §8.4)
  - name: admin
    description: Admin-only job ledger introspection, settings, and plugin management (LPP v1)
  - name: setup
    description: >-
      First-boot onboarding (STATE.md P4.6/P4.10): usable ONLY while the
      instance has zero users; permanently inert afterwards

paths:
  # ─────────────────────────── First-boot setup ────────────────────────────
  /setup/state:
    get:
      operationId: getSetupState
      tags: [setup]
      summary: Whether this instance still needs first-boot setup
      description: >-
        Public by necessity (the wizard runs before any credentials exist).
        Deliberately answers ONE boolean and nothing else — no version, no
        counts, no capability data (that is authenticated surface). Rate-
        limited like every unauthenticated endpoint (STATE.md P4.15).
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '429':
          description: Rate limited (unauthenticated surface, STATE.md P4.15)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
        default: { $ref: '#/components/responses/Problem' }

  /setup/first-admin:
    post:
      operationId: createFirstAdmin
      tags: [setup]
      summary: Create the instance's first admin account (first boot only)
      description: >-
        STATE.md P4.10: succeeds ONLY while the users table is empty —
        the one-time escape from the admin-creates-users chicken-and-egg.
        Once ANY user exists this endpoint is permanently inert and
        returns a 404 byte-identical to an unknown route (an attacker
        probing a configured instance learns nothing — same posture as
        restricted-content 404s, docs/PLAN.md §6.4). Responds with the
        created admin plus a real token pair so the wizard proceeds
        authenticated without a second login round-trip.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstAdminRequest' }
      responses:
        '201':
          description: First admin created; wizard continues authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstAdminResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────── Auth / devices ─────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Authenticate with credentials and register/refresh a device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-IP login attempts, STATE.md P2.1)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Rotate a device's refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Rate limited (per-IP refresh attempts, STATE.md P2.1)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Revoke the current device's refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices registered to the current user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getDevice
      tags: [devices]
      summary: Get a device by id
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device (deletes it and invalidates its refresh token)
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ───────────────────────────────── System ─────────────────────────────────
  /system/capabilities:
    get:
      operationId: getSystemCapabilities
      tags: [system]
      summary: Public feature-flag negotiation (docs/PLAN.md §4.1)
      security: []
      responses:
        '200':
          description: Capabilities this server build supports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Admin-only instance information
      responses:
        '200':
          description: System info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /system/update:
    get:
      operationId: getSystemUpdate
      tags: [system]
      summary: Admin-only notify-only update check (docs/PLAN.md §10, STATE.md P4.3/P4.16)
      description: >-
        Never triggers a download and never auto-applies anything — this is
        display data only. Serves the server's last completed manifest
        check (LOOMBRE_UPDATE_CHECK=off|manual|daily, default daily; see
        docs/ops/updating.md for exactly what the outbound manifest request
        does and does not contain — zero identifying payload). When
        LOOMBRE_UPDATE_CHECK=off, `verification` is always `disabled` and
        `latestVersion`/`notesUrl`/`checkedAtMs` are always null; the
        manifest mirror is never contacted.
      responses:
        '200':
          description: Update check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemUpdateInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  # ────────────────────────────────── Users ──────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by id (admin)
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me/settings:
    get:
      operationId: getMySettings
      tags: [users]
      summary: Get the current user's settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putMySettings
      tags: [users]
      summary: Replace the current user's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /users/me/restricted:
    put:
      operationId: putMyRestrictedSettings
      tags: [restricted]
      summary: >-
        Self-service restricted-content opt-in and PIN management
        (docs/PLAN.md §6.4 gate 3). Admins cannot perform this on behalf of
        another user — there is no admin path to this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestrictedSettingsUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Libraries ────────────────────────────────
  /libraries:
    get:
      operationId: listLibraries
      tags: [libraries]
      summary: List libraries visible to the current user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of libraries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createLibrary
      tags: [libraries]
      summary: Create a library (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLibraryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getLibrary
      tags: [libraries]
      summary: Get a library by id
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLibrary
      tags: [libraries]
      summary: Update a library (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLibraryRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteLibrary
      tags: [libraries]
      summary: Delete a library (admin)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{id}/scan:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: scanLibrary
      tags: [libraries]
      summary: Enqueue an incremental or full scan job for a library (admin)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanLibraryRequest' }
      responses:
        '202':
          description: Scan job enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /libraries/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getLibraryPermissions
      tags: [libraries]
      summary: Get per-user permission grants for a library (admin)
      responses:
        '200':
          description: Permission set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPermissionSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putLibraryPermissions
      tags: [libraries]
      summary: >-
        Replace per-user permission grants for a library (admin). Restricted
        libraries default-deny; a grant must be explicit even for admins'
        own accounts (docs/PLAN.md §6.4 gate 4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryPermissionSet' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPermissionSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Catalog: video ───────────────────────────
  /movies:
    get:
      operationId: listMovies
      tags: [catalog-video]
      summary: List movies
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LibraryIdFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Page of movies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoviePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /movies/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getMovie
      tags: [catalog-video]
      summary: Get a movie by id
      responses:
        '200':
          description: Movie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /series:
    get:
      operationId: listSeries
      tags: [catalog-video]
      summary: List TV series
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LibraryIdFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Page of series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /series/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getSeries
      tags: [catalog-video]
      summary: Get a series by id
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /series/{id}/seasons:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: listSeriesSeasons
      tags: [catalog-video]
      summary: List seasons of a series
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of seasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /seasons/{id}/episodes:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: listSeasonEpisodes
      tags: [catalog-video]
      summary: List episodes of a season
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of episodes
