      operationId: getImage
      tags: [images]
      summary: >-
        Fetch a pre-scaled managed image (poster/backdrop/logo/disc/thumb).
        One endpoint for all image kinds and entity types (anti-pattern P4:
        no per-kind endpoint proliferation).
      parameters:
        - name: width
          in: query
          required: false
          description: Nearest pre-scaled variant is served; ingest-time only, never computed on request (Tier-0 rule).
          schema: { type: integer, minimum: 1 }
        - name: format
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ImageFormat' }
      responses:
        '200':
          description: Image bytes
          content:
            image/webp: { schema: { type: string, contentEncoding: base64 } }
            image/avif: { schema: { type: string, contentEncoding: base64 } }
            image/jpeg: { schema: { type: string, contentEncoding: base64 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Playback ─────────────────────────────────
  /playback/plan:
    post:
      operationId: computePlaybackPlan
      tags: [playback]
      summary: >-
        Compute the full playback plan for a file without starting a
        session: runs the
        `@loombre/playback-engine` `plan()` against the resolved MediaInfo,
        the request's DeviceProfile, server-resolved NetworkConditions/
        ServerPolicy/VerifiedCapabilities, and the resolved TrackSelection,
        and returns the FULL PlaybackPlan (ladder,
        ffmpegArgs, hardware routing included).
        This is a read-only preview: no session row is created and
        no job is enqueued (contrast POST /playback/sessions).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: The full PlaybackPlan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions:
    post:
      operationId: createPlaybackSession
      tags: [playback]
      summary: >-
        Compute a plan and start a playback session (HLS packaging job or
        direct-play file serving handle)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The computed PlaybackPlan
            is genuinely unplayable — `decision === 'transcode'` but
            `ffmpegArgs` is empty (tone-map refused by policy, or an
            empty/degenerate ladder). The problem body's `reasons`
            extension member carries the plan's own (real, not
            hypothetical) `PlanReason[]`. A session for
            playable-via-transcode media succeeds (201) — this response is
            reserved for media no strategy can play.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: >-
            Transcode slots exhausted (`maxSimultaneousTranscodes`
            semaphore) — the global count of
            active-ish transcode sessions (any non-direct-play decision, any
            non-terminal status) already meets or exceeds the resolved
            policy's cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/hls/media.m3u8:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getPlaybackHlsManifest
      tags: [playback]
      summary: >-
        Fetch the live HLS media
        playlist for a transcode/direct-stream/remux session.
        Blocks up to 8s for the initial
        segment to be produced (polling `status === 'active' AND
        produced_segment IS NOT NULL`) before returning 503. Also accepts
        `?token=<accessToken>` for media elements that cannot send
        Authorization headers.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: HLS media playlist (Cache-Control private, no-store)
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: >-
            Initial segment not yet produced within the 8s poll window;
            client should retry (Retry-After header set)
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/hls/master.m3u8:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getPlaybackHlsMasterPlaylist
      tags: [playback]
      summary: >-
        Fetch the MULTI-VARIANT master playlist for a
        transcode/direct-stream/remux session (docs/PLAYBACK.md §9.1.1).
        One `EXT-X-STREAM-INF` per rung of the session's stored
        `plan.ladder`, in array order, with variant URIs
        `v{K}/media.m3u8`. A ladder-empty session (direct-stream copy,
        audio-only transcode) renders a single-variant master, so
        `manifestUrl` points here for every HLS session.
        NEVER 503s: it is rendered purely from the stored plan and the
        probed MediaInfo, so it is available the moment the session row
        exists — unlike the media playlist, which cannot exist until the
        worker has produced a segment. The retry contract lives on the
        variant playlist. Also accepts `?token=<accessToken>` for media
        elements that cannot send Authorization headers.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: HLS master playlist (Cache-Control private, no-store)
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            Unknown, foreign or terminal session — and direct-play
            sessions, which have no HLS surface at all.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/hls/{file}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - name: file
        in: path
        required: true
        schema: { type: string }
        description: >-
          `runN/sNNNNNN.m4s`, `runN/sNNNNNN.ts`, or `runN/init.mp4` (fmp4
          init segment) — the transcoder's per-run
          layout — each optionally prefixed with `v{K}/`, the variant
          segment of the multi-variant path family
          (`v{K}/media.m3u8`, `v{K}/runN/sNNNNNN.m4s`,
          `v{K}/runN/init.mp4`, docs/PLAYBACK.md §9.1.1). K is a rung's
          index in the session's stored `plan.ladder`; every variant serves
          the same bytes, so the prefix carries no content difference — it
          is the ABR SWITCH SIGNAL. Bare legacy shapes remain valid and are
          treated as the session's active rung, signalling nothing.
          Strictly pattern-validated;
          anything else is rejected (traversal-safe by construction — a
          client-supplied path is never trusted).
    get:
      operationId: getPlaybackHlsFile
      tags: [playback]
      summary: >-
        Serve one HLS variant playlist/init segment/media segment for a
        session. Updates the session's `requested_segment` (parsed from
        `file`) on every call — the transcoder's pacing
        input. A `v{K}` prefix naming a rung other than the session's
        active one additionally records a rung-switch request
        (`requestRungSwitch`); the worker hands the session's existing
        admission slot to that rung at its next poll tick and never starts a
        second pipeline (LD-16). A request for a segment index outside the
        currently-produced window (before the current run's start, or more
        than 3 segments ahead of `produced_segment`) triggers a seek request
        (`requestSeek`) and responds 503 (hls.js-compatible retry
        behavior) instead of 404 while the worker restarts the pipeline.
        Also accepts `?token=` for media elements that cannot send
        Authorization headers.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: Segment or init-segment bytes (Cache-Control private, immutable)
          headers:
            Cache-Control: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, contentEncoding: base64 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: >-
            The requested segment is outside the produced window; a restart
            has been requested (V8: the requested URI itself never returns —
            forward-only numbering — so clients should re-read the playlist
            for the new run rather than retry this URI indefinitely;
            Retry-After header set). Secondary/defensive path — the primary
            seek channel is POST /playback/sessions/{id}/seek.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/subtitles/media.m3u8:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getPlaybackSubtitleManifest
      tags: [playback]
      summary: >-
        The segmented-VTT
        subtitle side-track's single-segment HLS media playlist (the
        "segmented WebVTT side-track" strategy, `subtitle.
        strategy === 'hls-vtt'`). Populated by the subtitle-extract worker
        job enqueued at session create — works for
        direct-play sessions too (a session can carry an hls-vtt subtitle
        side-track independent of its own video/audio decision). Also
        accepts `?token=` for media elements that cannot send Authorization
        headers.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: HLS subtitle media playlist (Cache-Control private, no-store)
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Not yet extracted; client should retry (Retry-After header set).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/subtitles/{file}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - name: file
        in: path
        required: true
        schema: { type: string }
        description: 'Always `sub0.vtt` (single-segment side-track) — strictly pattern-validated.'
    get:
      operationId: getPlaybackSubtitleFile
      tags: [playback]
      summary: >-
        Serve the
        extracted WebVTT file. Also accepts `?token=` for media elements
        that cannot send Authorization headers.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: WebVTT bytes (Cache-Control private, immutable)
          headers:
            Cache-Control: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
          content:
            text/vtt: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getPlaybackSession
      tags: [playback]
      summary: Get playback session state
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: endPlaybackSession
      tags: [playback]
      summary: End a playback session and release its transcode slot
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/seek:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    post:
      operationId: requestPlaybackSeek
      tags: [playback]
      summary: >-
        Record a hard-seek intent for a transcode session (docs/PLAYBACK.md
        §9, owner-decision V8). A thin, contract-visible alias of the
        segment-GET side effect: writes the same `seek_target_ms` column
        with the same last-write-wins absorption, and — when `rungIndex`
        rides along — the same single-statement coincident-pair write
        (§9.1.7). The worker kills the live pipeline and restarts at the
        clamped target; the new run appears at the served playlist's tail
        under the next `runN/` prefix with `EXT-X-PROGRAM-DATE-TIME`
        carrying its source position, which is what the client's landing
        watch keys on. Clients seek locally ("soft") for any target the
        playlist still lists; this call is for targets OUTSIDE that window,
        which hls.js can never request on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeekRequest' }
      responses:
        '202':
          description: >-
            Seek recorded. The body carries the CLAMPED target actually
            written — `[0, max(0, durationMs − one nominal segment)]`:
            never past EOF, and never AT it either (a restart at
            `durationMs` spawns a run with nothing displayable in it —
            the ceiling backs off one nominal segment so a seek to the
            very end lands on the file's final frames and ends cleanly).
            The client keys its landing match on the returned value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeekAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Not a transcode session — direct-play seeks natively via byte
            ranges; there is no pipeline to restart. The problem `code` is
            `not-a-transcode-session`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /playback/sessions/{id}/file:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getPlaybackSessionFile
      tags: [playback]
      summary: >-
        HTTP range-request byte
        serving of the session's own direct-play media file. Path resolution
        comes ONLY from the media_files row the session references — never
        from client input. Also accepts `?token=<accessToken>` since
        an HTML `<video>`/`<audio>` element cannot set an Authorization
        header.
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string }
          description: 'Single-range only, e.g. `bytes=0-1023` or `bytes=1024-`.'
        - name: If-Range
          in: header
          required: false
          schema: { type: string }
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Access JWT fallback for media elements that cannot send Authorization headers.
      responses:
        '200':
          description: Full file (no/ignored Range)
          headers:
            Accept-Ranges: { schema: { type: string } }
            Content-Type: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, contentEncoding: base64 } }
        '206':
          description: Single-range partial content
          headers:
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string } }
          content:
            application/octet-stream: { schema: { type: string, contentEncoding: base64 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Malformed or unsatisfiable Range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Progress ─────────────────────────────────
  /progress/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getProgress
      tags: [progress]
      summary: Read the current user's watch/listen progress for a single item
      description: >-
        Guarded like every other catalog-adjacent read:
        an item that doesn't exist and an item that exists but is invisible
        to the caller (not in an allowed library, or restricted without full
        gate clearance) are byte-identical 404s. No progress row for an
        otherwise-visible item is ALSO a 404 (there is nothing to return —
        this is a single-resource read, not a list).
      responses:
        '200':
          description: The current user's progress for this item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putProgress
      tags: [progress]
      summary: Upsert watch/listen progress for an item (also serves as a session heartbeat)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressUpdate' }
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /progress:
    get:
      operationId: listProgress
      tags: [progress]
      summary: List the current user's progress records
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of progress records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Watchlist ────────────────────────────────
  # Phosphor Wave 2 lane L3 — design/phosphor README.md's /watchlist route,
  # Home "Your Watchlist" rail, and the movie/series/album detail-screen
  # toggle ("Interactions & behavior → Watchlist": "Toggle from any detail
  # screen; toasts ADDED TO / REMOVED FROM WATCHLIST. Syncs across profiles
  # and devices."). PUT/DELETE take no request body — the path's itemId is
  # the entire input, mirroring PUT /progress/{itemId}'s shape but simpler
  # (no state machine to encode) and POST /restricted/lock's 204-no-body
  # response shape (the caller already knows what it just toggled).
  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List the current user's watchlist, newest-added first
      description: >-
        Guarded like every other per-user, item-referencing list (docs/
        PLAN.md §6.4): a row whose item is not visible to the caller right
        now is excluded, even if it was added while the caller was fully
        cleared — restricted titles never appear in the watchlist, locked
        or not (design/phosphor README.md "Restricted content").
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of the caller's watchlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /watchlist/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add an item to the current user's watchlist (idempotent)
      description: >-
        404 when the item does not exist OR is not visible to the caller —
        indistinguishable, matching every other guarded single-item surface
        (getMovie/getProgress/etc.). This is also what makes adding a
        restricted (zone) item UNREACHABLE without full clearance: the item
        is invisible, not merely disallowed, so there is no signal that
        distinguishes "restricted" from "does not exist" (packages/db/src/
        query/watchlist.ts's addToWatchlistAndEmit).
      responses:
        '204': { description: Added (or already present) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove an item from the current user's watchlist (idempotent)
      description: >-
        404 only when the ITEM itself does not exist or is not visible to
        the caller — removing an item that IS visible but was never
        watchlisted is a successful no-op (safe to invoke more than once
        from the inline REMOVE control).
      responses:
        '204': { description: Removed (or was already absent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  # ─────────────────────────────── Restricted ───────────────────────────────
  /restricted/unlock:
    post:
      operationId: unlockRestricted
      tags: [restricted]
      summary: >-
        Verify the restricted-content PIN and open a time-boxed unlock —
        the session-unlock gate of the restricted-content model. Unlock
        state never persists across logins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnlockRequest' }
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnlockResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429':
          description: Rate limited (per-user PIN attempts)
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/lock:
    post:
      operationId: lockRestricted
      tags: [restricted]
      summary: Immediately end the current restricted-content unlock
      responses:
        '204': { description: Locked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/count:
    get:
      operationId: getRestrictedCount
      tags: [restricted]
      summary: >-
        Aggregate item count for the restricted zone (design/phosphor
        README "Restricted content": the zone's EXISTENCE and aggregate
        count are deliberately visible to entitled users regardless of
        current lock state — titles/artwork never leak through this
        surface, count only).
      description: >-
        404 for a viewer with NO restricted-library entitlement at all
        (the earlier restricted-content gates never passed) — the zone does not
        exist for them, so this operation is absent rather than answering
        with `{count: 0}`, which would itself be a side channel.
      responses:
        '200':
          description: Zone aggregate count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/items:
    get:
      operationId: listRestrictedZoneItems
      tags: [restricted]
      deprecated: true
      summary: >-
        DEPRECATED — superseded by GET /restricted/browse (STATE.md Stash
        run, K4). Kept per the additive-only evolution policy (removed
        operations are deprecated for two minor releases minimum, never
        hard-deleted mid-major).
      description: >-
        Same 404-for-not-entitled / empty-while-locked posture as GET
        /restricted/browse, which this now thinly delegates to (unsorted-
        filter, `added`-sorted, server-side) — kept working, not stubbed,
        for the deprecation window. New clients should call GET
        /restricted/browse directly; this operation carries a `Sunset`
        response header and will be removed after that window closes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of restricted zone items (deprecated shape — superset-compatible with RestrictedBrowseItem)
          headers:
            Sunset:
              schema: { type: string }
              description: RFC 8594 Sunset date/time — informational, no enforced removal date set yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedBrowseItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/home:
    get:
      operationId: getRestrictedHome
      tags: [restricted]
      summary: Restricted zone home rails (continue watching, recently added, studios, performers)
      description: >-
        404 for a viewer with NO restricted-library entitlement at all —
        same posture as every other zone read (GET /restricted/count). For
        an entitled-but-LOCKED viewer (gate 5 not currently passed) ALL
        FOUR rails come back empty — continueWatchingInZone,
        recentlyAddedInZone, studios and performers alike — guard-consistent
        with GET /restricted/browse. The zone's U10 aggregate disclosure
        (that a zone exists, and how many items are in it) is made by GET
        /restricted/count and by that endpoint ALONE; a locked viewer never
        learns a studio or performer NAME from this endpoint, because a
        studio/performer roster is zone content, not an aggregate.
        (R1 review lane: this paragraph previously said studios/performers
        "still resolve" while locked — the implementation has always
        returned them empty, and empty is the correct, safer reading of
        docs/PLAN.md §6.4. Corrected here so nobody "conforms" the code
        to the description and opens the leak. Pinned by
        packages/db/test/leak.spec.ts 12f/12h and the HTTP twin in
        apps/server/test/libraries.e2e.spec.ts.)
      responses:
        '200':
          description: Zone home rails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/browse:
    get:
      operationId: listRestrictedBrowse
      tags: [restricted]
      summary: Keyset browse of the restricted zone with combinable filters
      description: >-
        SUPERSEDES the old full-fetch GET /restricted/items design (STATE.md
        K4): real guarded server-side keyset pagination, proven at 33k-scene
        scale (S10) rather than the client fetching the whole zone and
        filtering locally. 404 for a viewer with NO restricted-library
        entitlement at all; an entitled-but-locked viewer gets 200 with an
        EMPTY page (gate 5 — same posture the old endpoint documented). A
        malformed performerIds/studioTagIds/tagIds uuid entry answers with
        an EMPTY page, never a dropped filter (house rule — packages/db/src/
        query/catalog-detail.ts's own convention for list filters).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: performerIds
          in: query
          required: false
          description: Comma-separated performer (people.id) uuids — ANY match.
          schema: { type: string }
        - name: studioTagIds
          in: query
          required: false
          description: Comma-separated studio (tags.id, kind=studio) uuids — ANY match.
          schema: { type: string }
        - name: tagIds
          in: query
          required: false
          description: Comma-separated genre/tag (tags.id) uuids — ANY match.
          schema: { type: string }
        - name: ratingMin
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 10 }
        - name: ratingMax
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 10 }
        - name: durationMinMs
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: durationMaxMs
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: resolution
          in: query
          required: false
          description: >-
            Comma-separated RestrictedResolutionBand values — ANY match
            (e.g. "FHD,UHD"). Derived per-item from the primary probed
            video stream's height (S5's technical authority); an item with
            no probed video stream never matches a non-empty filter.
          schema: { type: string }
        - name: yearMin
          in: query
          required: false
          schema: { type: integer }
        - name: yearMax
          in: query
          required: false
          schema: { type: integer }
        - name: sort
          in: query
          required: false
          description: "Defaults to `added`. `order`'s default depends on which sort is active (title: asc; added/date/rating/duration: desc)."
          schema: { $ref: '#/components/schemas/RestrictedBrowseSort' }
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Page of restricted-zone scenes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestrictedBrowseItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        default: { $ref: '#/components/responses/Problem' }

  /restricted/scenes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      operationId: getRestrictedScene
      tags: [restricted]
      summary: Restricted-zone scene detail
      description: >-
        Byte-identical 404 to an uncleared viewer, a nonexistent id, and a
