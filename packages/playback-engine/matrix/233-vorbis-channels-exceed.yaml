name: transcode — vorbis 6ch exceeds a 2ch-capped inline device
why: "Inline device declares a vorbis entry capped at 2 channels; a 6ch vorbis stream fires audio-channels-exceed-device alone."
input:
  media:
    fileId: file-0233
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5300000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: vorbis
        channels: 6
        sampleRate: 44100
        bitrateBps: 256000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device:
    profileId: inline-vorbis-limited
    directPlayContainers: [mp4]
    hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
    video:
      - codec: h264
        maxProfile: high
        maxLevel: 41
        maxBitDepth: 8
        maxWidth: 1920
        maxHeight: 1080
        maxFrameRate: 60
        maxBitrateBps: null
    hdr: { hdr10: false, hlg: false, dolbyVision: false }
    audio:
      - codec: vorbis
        maxChannels: 2
        passthrough: false
    subtitles: { renderText: [], hlsVtt: false, renderImage: false }
    maxStreamBitrateBps: null
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - audio-channels-exceed-device
