name: transcode — local network but overall EXCEEDS a non-null device cap -> fires
why: >
  PINNED (the unless-clause's SECOND half): §3 Stage F "unless network.isLocal AND bitrate <= device cap" — isLocal alone is not sufficient. overall (40Mbps) exceeds BOTH local-4mbps's own cap (4Mbps, irrelevant since isLocal) AND device.maxStreamBitrateBps (500,000) -> withinDeviceCap is false -> the unless-clause fails -> bitrate-exceeds- network FIRES even though the network is local. Ladder: rule (a)/(b) keep every rung down to 800,000 (source is 1080p/10Mbps); rule (c) is SKIPPED (isLocal); rule (d) drops every remaining rung (500,000 device cap is below even the 360p/800,000 rung) -> survivors empty -> rule (e) keeps exactly the table's lowest rung (360p), still nominally over the device cap — pinned exactly via expect.ladder (the mission's binding instruction: "the ladder of a transcode is never empty except the refused case"). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0337
    container: mp4
    durationMs: 6000000
    sizeBytes: 30000000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.bitrate-capped-device }
  network: { fixture: networks.local-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
