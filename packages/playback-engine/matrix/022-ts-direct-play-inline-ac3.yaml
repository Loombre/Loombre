name: direct-play — ts h264 1080p + ac3 2ch, inline device with ts in directPlayContainers
why: "Stage A: no SHARED device fixture lists ts in directPlayContainers (constrained-tv's `ts` only appears as its HLS repackage container, not a direct-play one), so this case defines an inline DeviceProfile that does, to cover the ts-in-list axis. Every selected stream is constructed genuinely within the paired device's declared caps on every axis (matrix/README.md's case-authoring rule), so this case's expected outcome survives once Stages B-F land."
