    overallBitrateBps: 5500000
    video:
      - index: 0
        codec: h264
        profile: null
        level: null
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 24
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
