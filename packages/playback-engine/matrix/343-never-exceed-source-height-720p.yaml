name: transcode — 720p source never gets a 1080p or 2160p ladder rung
why: >
  §7 construction rule (a) ("never exceed source height") isolated: source is 720p, so the ladder must never include the 2160p or either 1080p rung regardless of bitrate/network/device caps (all deliberately generous here — `local` network + null device cap — so ONLY the height rule is doing the narrowing). bitrate-exceeds-network fires (overall exceeds wan-4mbps... — no: uses `local`'s huge cap, so instead this is driven via Stage B's interlaced reason, exactly like 341/342, keeping Stage F's own reason out of the picture entirely). Expected ladder: exactly the 720/480/360 rungs, pinned exactly. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0343
    container: mp4
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1280
        height: 720
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 720
      videoBitrateBps: 3000000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
