name: "direct-play — subtitleStreamIndex null with an IMAGE (pgs) stream present but unselected -> strategy none, vacuous pass"
why: >
  Same vacuous-pass proof as the TEXT case above, using an IMAGE-kind stream (pgs) and a different device (web-safari, mov container) — confirms the null-selection short-circuit fires before the kind partition is even consulted, regardless of codec kind.

input:
  media:
    fileId: file-0313
    container: mov
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: pgs
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-safari }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: direct-play
  reasons: []
  subtitleStrategy: none
