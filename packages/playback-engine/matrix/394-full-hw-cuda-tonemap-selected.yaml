name: transcode — hdr10 tone-map required, full-hw selects nvenc with the cuda tone-map method
why: >
  hdr10 source, hevc-sdr device (no hdr10/hlg/dolbyVision) -> Stage C fires hdr-tone-map-required, NOT refused (full-hw's nvenc verifies a real tone-map method, so isToneMapRefused's noHardwareToneMap is false regardless of policy). Stage G rule (i): nvenc covers hevc decode + the ladder's h264/hevc targets AND its OWN toneMap array includes 'cuda' (§8.3's nvenc->cuda preference), so hw-encoder-selected:nvenc fires with video.toneMap='cuda' (schema can't assert video.* directly — verified by test/stages/hardware.spec.ts's dedicated unit test instead).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8200000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 7000000
        hdr: hdr10
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-sdr }
  network: { fixture: networks.local }
  policy: { fixture: policies.t1-cpu-tonemap }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - hdr-tone-map-required
    - hw-encoder-selected:nvenc
