name: transcode — C1 finding 1 — T1 rule-(iii) route whose SOFTWARE row never verified av1 -> Stage G demotes every av1 rung
why: >
  C1 fable-review finding 1 (MODERATE, owner-adopted 2026-08-11), the
  reviewer's exact repro. Same caps set as case 526 (nvenc verifies av1
  encode and NOTHING else; the software row verifies h264/hevc and NOT
  av1) — but at TIER 1, where §7.2 as originally written let the
  rule-(iii) collapse keep its av1 rungs because "Tier 1 and above may
  fall back to software AV1 encoding". The 2160p hevc SOURCE keeps the
  table's untouched 2160p/hevc rung alive beside the five ×0.6 av1 rungs
  the §7.1 swap produced, so the distinct target set is the MIXED
  {hevc, av1}; nvenc's encode list cannot cover it, so §8.3's rules (i)
  and (ii) both skip it and the one-route model terminates at rule (iii)
  full software. The software encoder on THIS box never proved it can
  encode av1 (its probe row says h264/hevc only — §7.3's D4 narrowing
  means no `libsvtav1` passed the encode self-test here), so keeping the
  rungs hands the arg builder an encoder name nothing on the machine has:
  design law 4's "verified capabilities only" violated by the one corner
  the eligibility gate cannot see, since `'hw'` eligibility is a fact
  about a HARDWARE backend and rule (iii) does not use it. The refined
  §7.2 clause demotes every av1 rung on ANY rule-(iii) route whose
  software row lacks probe-verified av1 encode
  (cause=software-route-no-av1), through the SAME shared primitive
  §7.1(g) and the tier-0 arm already use. Tier 1+ software AV1 is NOT
  withdrawn — case 522 keeps its `libsvtav1` route because THERE the
  software row verifies av1. Tier cap does not run (tier 1), so all six
  demoted/untouched rungs survive at their VERBATIM bitrates.
