name: "direct-play — TEXT subrip subtitle, device hlsVtt + policy hls-vtt -> cascade (a) fires"
why: >
  Stage E TEXT cascade (a): device.subtitles.hlsVtt (text-all-capable) is true AND policy.preferredTextSubMode is hls-vtt, so strategy is hls-vtt regardless of device.subtitles.renderText content or container playability. Container mp4 is in text-all-capable's directPlayContainers so Stages A-D all copy/direct-play too — non-ass TEXT codecs carry NO informational reason under hls-vtt (only ass loses styling), so the whole plan is reason-free direct-play.

input:
  media:
    fileId: file-0266
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: subrip
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.text-all-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: direct-play
  reasons: []
  subtitleStrategy: hls-vtt
