  media:
    fileId: file-528
    container: mkv
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8160000
    video:
      - index: 0
        codec: av1
        profile: null
        level: null
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 8000000
