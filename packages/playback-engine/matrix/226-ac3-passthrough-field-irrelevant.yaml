name: direct-play — ac3 6ch within cap, device declares passthrough:true — flag is a no-op for a non-bitstream codec
why: "Inline device sets ac3's passthrough field to true (unusual but structurally valid). Since ac3 is never subject to Stage D rule 3's codec gate (truehd/dtshd only), the passthrough value — true OR false — never affects the outcome; the stream copies purely because it's within the channel cap."
