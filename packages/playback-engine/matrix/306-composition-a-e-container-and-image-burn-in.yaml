name: "transcode — composition A+E: container mismatch + IMAGE (vobsub) burn-in, web-safari"
why: >
  mkv is not in web-safari's directPlayContainers ([mp4, mov]) -> Stage A fires container-not-direct-playable. web-safari's renderImage is false, so the vobsub stream burns in (subtitle-format-requires-burn-in). h264 fits web-safari's video caps -> Stage B copies, so video-transcode-for-subtitle-burn-in appends. Deliberately a fresh device/codec pairing (web-safari + vobsub) distinct from seed case 003's web-chrome + pgs, to broaden device/codec coverage of the same A+E shape. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0306
    container: mkv
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: vobsub
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-safari }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - subtitle-format-requires-burn-in
    - video-transcode-for-subtitle-burn-in
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
