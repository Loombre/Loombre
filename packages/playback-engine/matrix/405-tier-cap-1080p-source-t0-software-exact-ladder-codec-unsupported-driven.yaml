name: "transcode — T0 + software-only + a 1080p source, driven by Stage B (not Stage F): tier-capped to EXACTLY the 480p/360p rungs"
why: >
  hevc source vs constrained-tv (h264-only device) -> Stage B fires video-codec-unsupported (Stage F contributes no reason of its own). software-only caps -> full software route; tier 0 + 1080p source -> tier cap fires, narrowing the naturally-surviving [1080p/4M,720p/3M,480p/1.5M,360p/0.8M] (constrained-tv's own 20Mbps device cap already dropped the 8M rung) down to EXACTLY [480p/1.5M,360p/0.8M] — pinned via expect.ladder.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 6600000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 5500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.constrained-tv }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-codec-unsupported
    - software-fallback:encode
    - software-fallback:tier-capped
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
