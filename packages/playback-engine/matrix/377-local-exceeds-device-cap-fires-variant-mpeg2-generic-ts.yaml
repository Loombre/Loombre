name: transcode — local network exceeds mpeg2-generic's existing 20Mbps device cap (ts container/codec variety)
why: >
  A third generality proof of "local + exceeds a non-null device cap -> fires" (companion to 337/338), this time with mpeg2/ts (mpeg2-generic's own pre-existing 20Mbps maxStreamBitrateBps). overall (25Mbps) exceeds both local-4mbps's own cap (4Mbps, irrelevant since isLocal) and the device's 20Mbps cap -> fires. Container stays ts-hls throughout (mpeg2-generic's device.hls.supportsFmp4 is false). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0377
    container: ts
    durationMs: 6000000
    sizeBytes: 18750000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: mpeg2
        profile: main
        level: null
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 15000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.mpeg2-generic }
  network: { fixture: networks.local-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: ts-hls
  ladderMaxVideoBitrateBps: 8000000
