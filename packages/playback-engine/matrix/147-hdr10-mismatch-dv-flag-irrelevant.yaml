name: transcode — hevc main10 HDR10 vs an inline device declaring dolbyVision:true but hdr10:false
why: "Proves only the SPECIFIC matching flag (device.hdr.hdr10) rescues an hdr10 source — a device that supports Dolby Vision but not HDR10 still needs tone-map for a plain HDR10 stream; DV capability does not imply HDR10 capability in this model. hdr-tone-map-required fires; t1-cpu-tonemap avoids refusal muddying this assertion. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).\n"
