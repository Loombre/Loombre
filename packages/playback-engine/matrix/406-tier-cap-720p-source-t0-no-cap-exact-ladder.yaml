name: "transcode — T0 + software-only + a 720p source: NO tier cap (source height < 1080)"
why: >
  hevc source at 720p vs constrained-tv (h264-only) -> video-codec-unsupported. software-only -> full software route; tier 0 BUT source height is 720 (< 1080) -> docs/PLAYBACK.md §8.3's tier cap does not apply at all. The naturally-surviving ladder ([720p/3M,480p/1.5M,360p/0.8M] — 1080p/2160p rungs dropped by rule (a)'s height ceiling) is pinned UNCHANGED via expect.ladder, and reasons carries software-fallback:encode WITHOUT tier-capped.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 4000000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1280
        height: 720
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 3500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.constrained-tv }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-codec-unsupported
    - software-fallback:encode
  ladder:
    - heightPx: 720
      videoBitrateBps: 3000000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
