  ''selection picks one'' had no case with MORE than one video stream). Stream 0 is hevc main10 10-bit
  2160p60 HDR10 — four axes outside web-chrome''s caps — but selection picks stream 1 (h264 high@41 1080p
  8-bit SDR, fully within), so every stage''s SELECTED-stream-only scoping (stages/video.ts, hdr.ts, ladder.ts)
