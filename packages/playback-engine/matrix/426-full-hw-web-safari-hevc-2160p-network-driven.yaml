name: transcode — full-hw + web-safari + hevc 2160p, network-driven (device/codec diversity)
why: >
  hevc 2160p source, web-safari device (hevc-capable up to 2160p), network-driven transcode. full-hw's nvenc covers hevc decode + the ladder's targets -> hw-encoder-selected:nvenc. Diversifies device/codec coverage beyond the earlier full-hw cases (388-395 mostly use web-chrome/hevc-sdr).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 153
        width: 3840
        height: 2160
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-safari }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:nvenc
