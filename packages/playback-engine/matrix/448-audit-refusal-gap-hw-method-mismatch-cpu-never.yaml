  ''always''-policy control proving the identical caps route to cpu-zscale unrefused). This arm also
  disproved stages/hardware.ts''s old header claim that the gap was ''only reachable via the unknown
  VideoCodec'' — ordinary hevc reached it whenever method preference and verified lists disagreed; that
  header is corrected in the same PR. Deliberate future-proof exception: hdr10 vs SDR.'
