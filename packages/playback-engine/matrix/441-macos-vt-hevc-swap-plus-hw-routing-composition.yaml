name: transcode — the SAME hevc-swap composition, routed through macos-vt instead of full-hw
why: >
  Identical scenario to 440 but macos-vt caps: videotoolbox covers h264 decode + hevc encode -> hw-encoder-selected:videotoolbox. Confirms the swap's effect on target codecs is caps-set-independent (a Stage F fact), while the CHOSEN backend still varies correctly by caps set.

  Wave C2 / §7.5 step (h) CHURN (regression law, §10). This case's own
  arithmetic: the FINAL Tier-0 ladder had 5 rungs, more than
  TIER0_MAX_ADVERTISED_VARIANTS (3), so the ADVERTISED set — which §9.1's
  master playlist enumerates verbatim — is trimmed to top 1080p@6000000 +
  geometric-mid 720p@2250000 + floor 360p@600000. The geometric mean of
  6000000 and 600000 is ~1897367 bps, and 2250000 is the surviving
  candidate nearest it in log space. Dropped: 1080p@3000000, 480p@1125000.
  One informational `ladder-variant-capped` fires (single-firing,
  owner-decision V2) with every dropped rung in its detail, LAST in the
  reason list because step (h) runs after Stage G. decision, container,
  video.* and ffmpegArgs are UNCHANGED — the keep rule's first clause is
  "keep the top rung", which is the only rung `video.targetCodec` and the
  initially-encoded pipeline ever read.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-safari }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.hevc-preferred }
  caps: { fixture: caps.macos-vt }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:videotoolbox
    - ladder-variant-capped
  ladder:
    - { heightPx: 1080, videoBitrateBps: 6000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 720, videoBitrateBps: 2250000, audioBitrateBps: 160000, codec: hevc }
    - { heightPx: 360, videoBitrateBps: 600000, audioBitrateBps: 160000, codec: hevc }
