name: "direct-play — TEXT webvtt, policy prefers burn-in but device renders it natively -> embed anyway (literal cascade order)"
why: >
  Cascade LITERAL ORDER pin (binding interpretation constraint 3): policy.preferredTextSubMode is 'burn-in' so cascade (a) never fires even though device.subtitles.hlsVtt (text-all-capable) is true — the cascade only asks whether (a) FIRED, never re-consults the policy a second time. (b) then fires: device.subtitles.renderText includes webvtt AND the mp4 container is direct-playable -> 'embed'. Proves policy.preferredTextSubMode==='burn-in' does NOT force a burn-in when the device can embed the format natively.

input:
  media:
    fileId: file-0271
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: webvtt
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.text-all-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.text-burn-in-preferred }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: direct-play
  reasons: []
  subtitleStrategy: embed
  container: source
