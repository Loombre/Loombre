name: transcode — hevc 2160p over a 20Mbps remote network, exceeds cap
why: >
  Stage F network-dimension coverage, 20Mbps tier, hevc/2160p/web-safari variety (distinct codec+resolution+device from case 327). overallBitrateBps (30Mbps) exceeds network.maxBitrateBps (20Mbps), non-local -> fires alone. Ladder: source height 2160p keeps every rung by height; source bitrate (25Mbps) keeps every rung by bitrate (even the 16Mbps 2160p rung); the 20Mbps network cap doesn't drop the 16Mbps rung either (16M <= 20M) — ALL SIX rungs survive, max 16,000,000 (proves the cap doesn't always bite). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

