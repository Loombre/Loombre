name: 'remux — download mode + container-only change under allowTranscode:false: remux is repackaging,
  not transcoding — the knob does not block it'
why: 'step 7b F1 new pin (disabled + repackage-unaffected, the DOWNLOAD half — case 453 pins the direct-stream
  half): the documented F1 boundary is "repackaging is not transcoding" — the disabled check fires ONLY
  on an aggregated ''transcode'' decision, and a download-mode container-only change aggregates to direct-stream
  then remuxes (§3 Final assembly), so allowTranscode:false leaves the copy-only progressive-mp4 remux
  fully allowed. Whatever future semantics tighten, blocking a -c copy remux under a no-TRANSCODE policy
  would be wrong; this case makes that boundary mechanical.'
