name: transcode — device.audio is a degenerate EMPTY array — rule 1 fires
why: "Inline device declares audio: [] entirely (docs/PLAYBACK.md §10's 'device profiles incl. degenerate empty arrays' coverage requirement). With no entries at all to search, device.audio.find(...) never matches any codec, so rule 1 fires audio-codec-unsupported for any selected stream."
