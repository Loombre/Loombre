name: "remux — download + container-mismatch + ASS hls-vtt (informational subtitle-styling-lost only) -> STILL remux"
why: >
  hls-vtt never contributes a blocking reason (design law 2 has no blocking code for a VTT side-track), so subtitle-styling-lost being informational-only means the blocking-reason set stays exactly {container-not-direct-playable} — containerOnlyChange holds and mode=download remuxes to a progressive mp4, matching the dv-stripped-to-hdr10 precedent (Step 2c / case 205) that an informational reason never disqualifies a container-only-change remux.

input:
  media:
    fileId: file-0319
    container: mkv
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: ass
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: download

expect:
  decision: remux
  reasons:
    - container-not-direct-playable
    - subtitle-styling-lost
  subtitleStrategy: hls-vtt
  container: mp4
