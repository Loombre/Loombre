name: transcode (mode=download) — bitrate-exceeds-network is blocking-class, blocks the container-only-change remux
why: >
  Matrix-level companion to the unit test in test/plan.spec.ts: an otherwise container-only change (mkv -> repackage) in mode=download would normally remux (progressive mp4, no re-encode), but overallBitrateBps (40Mbps) also exceeds wan-4mbps's cap (4Mbps) — bitrate-exceeds-network is BLOCKING-class (docs/PLAYBACK.md §4), so the container-only-change predicate's "blocking reasons are exactly {container-not-direct-playable}" check fails and the decision stays transcode (container mp4 would only ever apply to remux, not transcode — the escalated container here is fmp4-hls, mode=download notwithstanding). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0386
    container: mkv
    durationMs: 7500000
    sizeBytes: 37500000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 38000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: download

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 4000000
