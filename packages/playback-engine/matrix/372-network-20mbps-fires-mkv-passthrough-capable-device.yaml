name: transcode — mkv direct-play device (passthrough-capable), 20Mbps network tier, container variety
why: >
  Stage F network-dimension coverage, 20Mbps tier, using a device whose directPlayContainers includes mkv (passthrough-capable) — proving bitrate-exceeds-network fires cleanly on an mkv file that would otherwise be direct-playable, not just the usual mp4/webm/mov containers. overall (24Mbps) exceeds the 20Mbps cap, non-local. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0372
    container: mkv
    durationMs: 6000000
    sizeBytes: 18000000000
    overallBitrateBps: 24000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 23000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.passthrough-capable }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 8000000
