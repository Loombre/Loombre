name: "direct-play — ASS subtitle, hls-vtt strategy carries informational subtitle-styling-lost EVEN ON A DIRECT-PLAY DECISION"
why: >
  Constraint-2 PIN CASE: mp4 is direct-playable and video/audio both copy, so absent Stage E every stage is direct-play/reason-free. Stage E's hls-vtt branch fires (device.hlsVtt + policy hls-vtt) and ass loses styling in a VTT side-track -> informational subtitle-styling-lost. hls-vtt NEVER escalates severity (design law 2 has no blocking code for a VTT side-track), so the aggregated decision STAYS direct-play even though reasons is non-empty — the §5 wording 'may be [] only for direct-play' bounds non-direct-play, it does not force [] on direct-play (Step 2c dv-stripped-to-hdr10 precedent, this time actually landing ON a direct-play verdict).

input:
  media:
    fileId: file-0278
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: ass
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.text-all-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: direct-play
  reasons:
    - subtitle-styling-lost
  subtitleStrategy: hls-vtt
  container: source
