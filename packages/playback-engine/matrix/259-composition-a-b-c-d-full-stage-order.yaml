name: transcode — full A+B+C+D composition — container + video-codec-unsupported + hdr-tonemap + audio-channels-exceed, exact stage order
why: "Inline device declares directPlayContainers:[mp4] only (mkv fires Stage A), video.entries h264-only (the selected hevc stream fires Stage B's video-codec-unsupported — a naive 'Stage C only runs when Stage B is copy' reading would wrongly skip Stage C, per the inherited binding interpretation constraint 1 from Step 2c: Stage C evaluates regardless), hdr.hdr10:false (the same hevc stream is hdr10 -> Stage C fires hdr-tone-map-required), and audio.aac maxChannels:2 (the selected 6ch aac stream exceeds it -> Stage D fires audio-channels-exceed-device). t1-cpu-tonemap avoids a 5th (refusal) reason. Reasons appear in EXACT stage order: [container-not-direct-playable, video-codec-unsupported, hdr-tone-map-required, audio-channels-exceed-device]. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).\n"
