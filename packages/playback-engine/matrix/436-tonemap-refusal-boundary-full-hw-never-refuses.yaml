name: "transcode — T0 + tier-gated (would normally refuse) + full-hw caps: NOT refused, because full-hw verifies a real hardware tone-map method"
why: >
  t0-default's allowToneMapCpu is 'tier-gated' at tier 0, which ALONE would refuse (matches case 144's mandatory refused scenario under software-only) — but stages/hdr.ts's isToneMapRefused ALSO requires noHardwareToneMap across every caps.backends entry, and full-hw's nvenc verifies 'cuda' -> refusal never fires. Stage C fires hdr-tone-map-required alone (no tone-map-refused-by-policy), and Stage G proceeds normally: hw-encoder-selected:nvenc.

  Wave C2 / §7.5 step (h) CHURN (regression law, §10). This case's own
  arithmetic: the FINAL Tier-0 ladder had 4 rungs, more than
  TIER0_MAX_ADVERTISED_VARIANTS (3), so the ADVERTISED set — which §9.1's
  master playlist enumerates verbatim — is trimmed to top 1080p@4000000 +
  geometric-mid 480p@1500000 + floor 360p@800000. The geometric mean of
  4000000 and 800000 is ~1788854 bps, and 1500000 is the surviving
  candidate nearest it in log space. Dropped: 720p@3000000. One
  informational `ladder-variant-capped` fires (single-firing,
  owner-decision V2) with every dropped rung in its detail, LAST in the
  reason list because step (h) runs after Stage G. decision, container,
  video.* and ffmpegArgs are UNCHANGED — the keep rule's first clause is
  "keep the top rung", which is the only rung `video.targetCodec` and the
  initially-encoded pipeline ever read.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5000000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: hdr10
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-sdr }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - hdr-tone-map-required
    - hw-encoder-selected:nvenc
    - ladder-variant-capped
