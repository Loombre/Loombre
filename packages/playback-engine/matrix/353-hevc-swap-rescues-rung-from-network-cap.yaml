name: transcode — hevc swap applied BEFORE the network cap rescues the 1080p rung
why: >
  §7 hevc-swap (binding interpretation constraint 3, step f), applied BEFORE bitrate caps per the mission's BIND ("apply the swap FIRST"): policy.hevcEncodePreferred is true AND device.video (web-safari) declares an hevc entry, so every rung below 2160p becomes hevc at ×0.75 bitrate BEFORE the network cap is checked. The 1080p/8Mbps rung becomes 1080p/6Mbps/hevc, which SURVIVES the 7Mbps network cap — in its original (unswapped) h264/8Mbps form it would have been dropped (see case 354's control, same numbers, swap disabled). The 2160p/16Mbps rung is NEVER swapped (>= 2160p) and is dropped by the 7Mbps cap regardless. Pinned exactly via expect.ladder. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`). expect.ladder is tightened accordingly to the now-tier-capped surviving rungs.

input:
  media:
    fileId: file-0353
    container: mov
    durationMs: 6000000
    sizeBytes: 15000000000
    overallBitrateBps: 20000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-safari }
  network: { maxBitrateBps: 7000000, isLocal: false }
  policy: { fixture: policies.hevc-preferred }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladder:
    - heightPx: 480
      videoBitrateBps: 1125000
      audioBitrateBps: 160000
      codec: hevc
    - heightPx: 360
      videoBitrateBps: 600000
      audioBitrateBps: 160000
      codec: hevc
