name: transcode — unknown codec vs web-chrome, container matches (§2.1 'unknown' codec, Stage B rule 2)
why: |
  No real device fixture declares support for the 'unknown' codec value (docs/PLAYBACK.md §2.1's conservative catch-all), so it always fires video-codec-unsupported; mp4 container matches to isolate. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).
