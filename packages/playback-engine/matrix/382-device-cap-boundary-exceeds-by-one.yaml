name: transcode — overall ONE bps over the device cap fires (companion to 373's exact-equal pass)
why: >
  The other side of 373's boundary: overall (500,001) is one bps ABOVE bitrate-capped-device's cap (500,000) — withinDeviceCap is now false, so even with isLocal true the unless-clause fails and bitrate-exceeds-network fires. Network cap (100,000, isLocal true) is the same shape as 373's. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

