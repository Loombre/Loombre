name: transcode — subtitle burn-in (Stage E) forces video transcode; macos-vt routes it
why: >
  Identical scenario to 429 (pgs burn-in forcing video.action='transcode' on an otherwise-copy h264 1080p stream) with macos-vt caps instead of full-hw: videotoolbox covers h264 decode+encode -> hw-encoder-selected:videotoolbox.

  Wave C2 / §7.5 step (h) CHURN (regression law, §10). This case's own
  arithmetic: the FINAL Tier-0 ladder had 4 rungs, more than
  TIER0_MAX_ADVERTISED_VARIANTS (3), so the ADVERTISED set — which §9.1's
  master playlist enumerates verbatim — is trimmed to top 1080p@4000000 +
  geometric-mid 480p@1500000 + floor 360p@800000. The geometric mean of
  4000000 and 800000 is ~1788854 bps, and 1500000 is the surviving
  candidate nearest it in log space. Dropped: 720p@3000000. One
  informational `ladder-variant-capped` fires (single-firing,
  owner-decision V2) with every dropped rung in its detail, LAST in the
  reason list because step (h) runs after Stage G. decision, container,
  video.* and ffmpegArgs are UNCHANGED — the keep rule's first clause is
  "keep the top rung", which is the only rung `video.targetCodec` and the
  initially-encoded pipeline ever read.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: pgs
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.macos-vt }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - subtitle-format-requires-burn-in
    - video-transcode-for-subtitle-burn-in
    - hw-encoder-selected:videotoolbox
    - ladder-variant-capped
