name: transcode — hdr10 tonemap (Stage C) + audio passthrough unsupported + atmos-lost (Stage D), exact stage order
why: "Inline device declares hevc video (main10, within every axis so Stage B stays silent) but hdr.hdr10:false, so the hdr10 source forces Stage C's hdr-tone-map-required. The same file's truehd stream (8ch, exactly at the device's cap so rule 2 stays silent) has passthrough:false -> Stage D fires audio-passthrough-unsupported, and since hasAtmos:true and the stage's own verdict is transcode, audio-atmos-lost is appended. t1-cpu-tonemap avoids a tone-map-refused-by-policy 4th reason (allowToneMapCpu:always). Reasons in exact stage order: [hdr-tone-map-required, audio-passthrough-unsupported, audio-atmos-lost]. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).\n"
