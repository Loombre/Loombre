        isDefault: true
        hasAtmos: true
    subtitle: []
  device:
    profileId: inline-hdr-mismatch-truehd-device
    directPlayContainers: [ mp4 ]
    hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
    video:
      - codec: hevc
        maxProfile: main10
        maxLevel: 153
        maxBitDepth: 10
        maxWidth: 3840
