name: direct-stream — mkv hevc DV profile 8 (HDR10-compatible BL), device hdr10-only
why: >
  Stage A fires container-not-direct-playable (mkv not in the device's
  directPlayContainers, mp4 only). Stage B is copy (device supports hevc
  main10 at this resolution/level). Stage C: source is DV profile 8 with
  dvBlCompatId 1 (HDR10-compatible base layer); device.hdr.dolbyVision is
  false but device.hdr.hdr10 is true, so the base layer copies with a
  metadata strip — informational dv-stripped-to-hdr10, not a re-encode.
  Audio is copy. No stream actually transcodes, so the decision only
  escalates to direct-stream (container repackage).

input:
  media:
    fileId: file-0010
    container: mkv
    durationMs: 7200000
    sizeBytes: 8200000000
    overallBitrateBps: 9100000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 153
        width: 3840
        height: 2160
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 8500000
        hdr: dv
        dvProfile: 8
        dvBlCompatId: 1
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-hdr10-only }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: direct-stream
  reasons:
    - container-not-direct-playable
    - dv-stripped-to-hdr10
