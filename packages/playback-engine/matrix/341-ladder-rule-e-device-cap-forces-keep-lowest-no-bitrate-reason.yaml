name: transcode (Stage B driven) — device cap below every rung forces keep-lowest, Stage F contributes no reason
why: >
  Isolates §7 construction rule (e) ("keep at least the lowest rung") driven purely by the DEVICE cap, on a transcode caused by Stage B alone (interlaced source) rather than Stage F's own reason — proving rule (e) applies regardless of WHICH stage forced the transcode. network is the generous `local` fixture (1,000,000,000 cap, isLocal true) so it never factors in; device.maxStreamBitrateBps (500,000, bitrate-capped-device) is below even the 360p/800,000 rung, so rules (a)-(d) drop EVERY rung -> rule (e) keeps exactly the table's lowest-bitrate rung despite it still nominally exceeding the device cap. videoAlreadyTranscoding is true (Stage B verdict transcode) so evaluateBitrate never even evaluates its own network condition — reasons are EXACTLY [video-interlaced]. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0341
    container: mp4
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 9000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.bitrate-capped-device }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
