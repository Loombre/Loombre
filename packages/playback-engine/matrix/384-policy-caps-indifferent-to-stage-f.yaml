name: transcode — Stage F's reason is indifferent to policy/caps variety (mirrors cases 059-062/262's pattern)
why: >
  evaluateBitrate's signature never receives `policy` or `caps` at all — it only consumes media/device/network — so pairing seed 006's own scenario numbers with t1-cpu-tonemap (instead of t0-default) and full-hw (instead of software-only) caps must fire the identical reason. Ladder construction DOES read `policy.ladderRungs`/`policy.hevcEncodePreferred`, but t1-cpu-tonemap's table is byte-identical to t0-default's and hevcEncodePreferred is false in both, so the ladder bound is unchanged too. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture verifies a real hardware backend for the selected stream's codec + surviving ladder targets, so Stage G now selects it (`hw-encoder-selected:nvenc`).

input:
  media:
    fileId: file-0384
    container: mp4
    durationMs: 7500000
    sizeBytes: 37500000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 38000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t1-cpu-tonemap }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:nvenc
  ladderMaxVideoBitrateBps: 4000000
