name: "direct-play — ASS via web-safari (real fixture), mov container -> hls-vtt with informational subtitle-styling-lost, decision stays direct-play"
why: >
  A second instance of the constraint-2 pin (direct-play + hls-vtt + informational reason), this time against a REAL device fixture (web-safari) rather than the custom text-all-capable, and a different container (mov) — confirms the direct-play+non-empty-reasons outcome is not an artifact of one specific fixture.

input:
  media:
    fileId: file-0322
    container: mov
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: ass
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-safari }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: direct-play
  reasons:
    - subtitle-styling-lost
  subtitleStrategy: hls-vtt
  container: source
