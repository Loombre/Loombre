name: transcode — composition A+F, a genuine two-reason firing (Stage A's own escalation never sets videoAlreadyTranscoding)
why: >
  Unlike the B/C-driven compositions (367/370), Stage A's container escalation does NOT set `videoAlreadyTranscoding` (that boolean is derived only from Stage B/C's verdicts and Stage E's subtitle strategy — src/plan.ts's own header) — so Stage F's REASON can legitimately ALSO fire alongside Stage A's, producing a genuine two-code reason list. mkv container (not in web-chrome's directPlayContainers) fires container-not-direct-playable; video/audio otherwise fully within web-chrome's caps (B/C/D/E all silent); overallBitrateBps (10Mbps) exceeds wan-4mbps's 4Mbps cap, non-local -> bitrate-exceeds-network fires too. Reasons in exact stage order: A then F. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0371
    container: mkv
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 9000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 4000000
