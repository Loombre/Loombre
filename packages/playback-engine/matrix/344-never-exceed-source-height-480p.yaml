name: transcode — 480p source never gets a 720p, 1080p, or 2160p ladder rung
why: >
  Rule (a) isolated again at a lower boundary: source is 480p, so the surviving ladder must be exactly the 480/360 rungs. Same generous network/device/bitrate setup as 343 (Stage-B-interlaced-driven transcode, Stage F contributes no reason). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0344
    container: mp4
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 854
        height: 480
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
