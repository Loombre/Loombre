name: transcode — mp4 hevc main10 10-bit vs constrained-tv (h264-only device)
why: >
  Stage B rule 2 (docs/PLAYBACK.md §3): hevc is not in the constrained-tv
  device's video codec list, so video transcodes. mp4 IS in the device's
  directPlayContainers, so Stage A never fires — the container itself is
  not the problem, only the codec.

  why (Stage G arrival, STATE.md P3.9(a)): caps.software-only declares no
  hardware backend at all, so Stage G's rule (iii) always routes full
  software (`software-fallback:encode`). policies.t0-default is tier 0 and
  the selected source stream is exactly 1080p (>=1080), so the tier cap
  (docs/PLAYBACK.md §8.3) also applies: buildLadder's pre-cap survivors for
  this scenario (hevc 1080p/5.5Mbps source, local network, constrained-tv's
  20Mbps device cap) are the 1080p/4M, 720p/3M, 480p/1.5M, and 360p/0.8M
  rungs — the tier cap actually removes the two rungs above 480p, so
  `software-fallback:tier-capped` fires too, appended after the primary
  fallback reason per stage order (A..G).

input:
  media:
    fileId: file-0002
    container: mp4
    durationMs: 6300000
    sizeBytes: 5200000000
    overallBitrateBps: 6600000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 5500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 128000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.constrained-tv }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-codec-unsupported
    - software-fallback:encode
    - software-fallback:tier-capped
