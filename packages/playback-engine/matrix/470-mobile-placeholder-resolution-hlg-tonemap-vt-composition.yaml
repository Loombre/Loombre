name: 'transcode — mobile-placeholder × macos-vt: 2160p HLG source exceeds the 1080p mobile ceiling AND
  needs tone-mapping (hlg:false); VideoToolbox routes with its own tone-map method; device 8M cap trims
  the ladder'
why: 'mobile-placeholder composition case: Stage B resolution axis (3840x2160 vs 1920x1080), Stage C hlg
  mismatch (mobile is hdr10-only), Stage G rule (i) videotoolbox (decode hevc + encode h264 targets +
  toneMap videotoolbox). Ladder: 2160/16M-hevc rung survives height (=source) and network 20M but is dropped
  by the mobile 8M DEVICE cap — the surviving set is exactly the five h264 rungs ≤ 8M, so the target set
  stays {h264}. Deliberate future-proof exception: resolution + HDR exceed mobile caps (the drivers).'
