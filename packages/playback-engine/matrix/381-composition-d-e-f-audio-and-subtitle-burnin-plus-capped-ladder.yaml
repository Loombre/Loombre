name: transcode — composition D+E+F (audio + subtitle-burn-in reasons fire; F contributes only the capped ladder)
why: >
  Audio-passthrough-unsupported (Stage D, truehd 6ch vs web-chrome's passthrough:false entry) AND subtitle-format-requires-burn-in + video-transcode-for-subtitle-burn-in (Stage E, an unrenderable pgs image sub) both fire, in stage order (D before E). Stage E's burn-in sets videoAlreadyTranscoding, so Stage F's own reason is suppressed even though overallBitrateBps (10Mbps) exceeds the paired wan-4mbps cap (4Mbps) — but buildLadder still runs and still applies that cap. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0381
    container: mp4
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: truehd
        channels: 6
        sampleRate: 48000
        bitrateBps: 1500000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: pgs
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - audio-passthrough-unsupported
    - subtitle-format-requires-burn-in
    - video-transcode-for-subtitle-burn-in
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 4000000
