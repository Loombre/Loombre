name: "transcode — external ASS sidecar with preserveAssStyling true burns in for styling, exactly like an embedded ASS stream would"
why: >
  isExternal/externalPath make no difference to the ass-specific (a) exception: text-all-capable's hlsVtt + preserve-ass-styling's preserveAssStyling:true fire the burn-in-for-styling override on this EXTERNAL stream precisely as they would on an embedded one (constraint 8's 'the tree treats them identically by codec'). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0305
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: ass
        language: eng
        isForced: false
        isDefault: false
        isExternal: true
        externalPath: "/sidecars/movie.ass"
  device: { fixture: devices.text-all-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.preserve-ass-styling }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - subtitle-burn-in-for-styling
    - video-transcode-for-subtitle-burn-in
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
