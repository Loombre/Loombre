name: transcode — h264 vs web-chrome, EVERY rule-3 axis exceeds simultaneously — exact reason order
why: |
  profile/level/bitDepth/resolution/framerate all exceed web-chrome's h264 entry at once — proves the fixed axis order from docs/PLAYBACK.md §3's sentence (profile, level, bitDepth, resolution, framerate) regardless of which axes happen to fail. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).
