name: transcode — av1 (codec unsupported by hevc-sdr) + HDR10 mismatch — BOTH stages' reasons fire, in stage order
why: "KEY case for binding interpretation constraint 1 (Stage C evaluates regardless of Stage B's verdict): Stage B already forces transcode via video-codec-unsupported (hevc-sdr's device.video only declares an hevc entry — av1 has none), which would let a naive 'Stage C only runs when Stage B is copy or copy-possible' reading skip Stage C entirely. The real engine evaluates Stage C anyway: the same stream is ALSO hdr10 against a device with hdr.hdr10:false, so hdr-tone-map-required fires too. reasons: [video-codec-unsupported, hdr-tone-map-required], stage order (B then C). t1-cpu-tonemap avoids a third reason (refusal) so this case isolates exactly the B+C composition. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).\n"
