        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.av1-fmp4-capable }
  network: { fixture: networks.local }
