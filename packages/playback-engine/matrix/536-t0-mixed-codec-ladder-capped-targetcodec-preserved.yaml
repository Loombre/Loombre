expect:
  decision: transcode
  reasons:
    - video-interlaced
    - hw-encoder-selected:qsv
    - ladder-variant-capped
  container: fmp4-hls
  ladder:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 2400000, audioBitrateBps: 160000, codec: av1 }
    - { heightPx: 360, videoBitrateBps: 480000, audioBitrateBps: 160000, codec: av1 }
