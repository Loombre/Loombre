name: transcode — mkv h264 + TrueHD 7.1 Atmos selected, web-chrome (decodes TrueHD but no passthrough)
why: >
  Stage A fires container-not-direct-playable (mkv). Stage D rule 3:
  web-chrome's TrueHD device entry has passthrough:false, so the bitstream
  cannot be copied — audio transcodes with audio-passthrough-unsupported,
  and because the source carries Atmos (JOC side data) the informational
  audio-atmos-lost reason is added. Video (h264 1080p8bit) stays copy, so
  Stage G never runs.

input:
  media:
    fileId: file-0004
    container: mkv
    durationMs: 8100000
    sizeBytes: 9500000000
    overallBitrateBps: 9400000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: truehd
        channels: 8
        sampleRate: 48000
        bitrateBps: 3800000
        language: eng
        isDefault: true
        hasAtmos: true
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - audio-passthrough-unsupported
    - audio-atmos-lost
