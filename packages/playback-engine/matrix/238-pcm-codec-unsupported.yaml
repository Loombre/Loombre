name: transcode — pcm codec absent from an aac-only inline device (non-music)
why: "Inline device only declares aac; a selected pcm stream fires audio-codec-unsupported alone."
input:
  media:
    fileId: file-0238
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 6300000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: pcm
        channels: 2
        sampleRate: 48000
        bitrateBps: 1536000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device:
    profileId: inline-aac-only-for-pcm-test
    directPlayContainers: [mp4]
    hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
    video:
      - codec: h264
        maxProfile: high
        maxLevel: 41
        maxBitDepth: 8
        maxWidth: 1920
        maxHeight: 1080
        maxFrameRate: 60
        maxBitrateBps: null
    hdr: { hdr10: false, hlg: false, dolbyVision: false }
    audio:
      - codec: aac
        maxChannels: 6
        passthrough: false
    subtitles: { renderText: [], hlsVtt: false, renderImage: false }
    maxStreamBitrateBps: null
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
