name: transcode — mkv h264 openGop:true vs constrained-tv (mp4-only) — Stage B′ escalates the would-be copy to a transcode
why: >
  Stage B′ (docs/PLAYBACK.md §3 rule 5, ENGINE_VERSION 0.12.0; owner report
  from the Linux reference box 2026-09-07): an h264 stream whose probe found
  recovery-point SEIs (openGop:true) cannot be stream-copied into a SEGMENTED
  container — the HLS muxer cuts segments at every key-flagged packet, so
  segments begin on non-IDR I-frames and a decoder (re)starting there shows
  the missing references as blocking. devices.constrained-tv declares
  directPlayContainers:[mp4] only, so Stage A alone reaches direct-stream
  with container-not-direct-playable (ts-hls — the fixture is ts-only); Stage B's rules 1-4 find
  nothing (high@4.1 1080p24 8-bit is within the entry) and would have
  copied. Stage B′ sees the provisional container is segmented and
  escalates: decision transcode, video-open-gop-copy-unsafe appended after
  every A-F reason. Case 539 is the direct-play counterpart (mp4, nothing
  repackaged, no reason); case 540 proves the "repackaged for an UNRELATED
  reason" path.
  Stage G (never re-run when this case was written): caps.software-only routes the escalated transcode to software (`software-fallback:encode`), and the 1080p source on policies.t0-default's full-software route meets §8.3's Tier-0 cap — the 8M/4M/3M rungs go, 480p/360p stay, `software-fallback:tier-capped` fires.
input:
  media:
    fileId: file-538
    container: mkv
    durationMs: 6000000
    sizeBytes: 5000000000
    overallBitrateBps: 8160000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 24
        bitrateBps: 8000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: true
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device:
    fixture: devices.constrained-tv
  network:
    fixture: networks.local
  policy:
    fixture: policies.t0-default
  caps:
    fixture: caps.software-only
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - video-open-gop-copy-unsafe
    - software-fallback:encode
    - software-fallback:tier-capped
  container: ts-hls
