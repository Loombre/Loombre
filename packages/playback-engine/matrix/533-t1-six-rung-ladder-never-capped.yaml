name: "transcode — TIER 1 + the same 6-rung table: NEVER trimmed (owner-decision V6)"
why: >
  Wave C2 / §7.5, owner-decision V6 ("Tier 1+ advertise ALL surviving
  rungs, uncapped") — §10's C2 class 3. Byte-for-byte the same input as
  case 531 apart from the policy fixture's `tier` (and the
  maxSimultaneousTranscodes that goes with a bigger box), so the ONLY
  thing that can explain the different ladder length is the tier test in
  step (h)'s guard. All six surviving rungs are advertised and no
  `ladder-variant-capped` reason fires.

  Why the law stops at Tier-0 rather than applying everywhere: LD-16
  constrains Tier-0's advertised COUNT because a 6 W part pays 1-4 s of
  full-pipeline handoff for every ABR switch and the default table's
  1.33x adjacent ratios invite boundary-hovering. On bigger hardware that
  churn is absorbed by headroom Tier-0 does not have, and the extra
  quality points are strictly better for the viewer.
