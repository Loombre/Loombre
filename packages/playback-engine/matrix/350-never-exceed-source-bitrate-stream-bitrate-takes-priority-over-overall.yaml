name: transcode — comparator prioritizes stream.bitrateBps over media.overallBitrateBps when both present
why: >
  Companion to 349: here the stream's OWN bitrateBps (3Mbps) is present and deliberately much LOWER than media.overallBitrateBps (50Mbps, e.g. the container also carries other tracks/overhead) — the ladder must narrow using the STREAM's 3Mbps figure, not the higher whole-file number, proving the `??` fallback only ever engages when the stream's own field is null. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`). expect.ladder is tightened accordingly to the now-tier-capped surviving rungs.

input:
  media:
    fileId: file-0350
    container: mp4
    durationMs: 6000000
    sizeBytes: 37500000000
    overallBitrateBps: 50000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 3000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
