name: transcode — Stage D's reasons are indifferent to network/policy/caps variety
why: "Same web-chrome truehd 6ch passthrough:false scenario as case 208/261, but paired with wan-4mbps network, t1-cpu-tonemap policy, and full-hw caps instead of the usual local/t0-default/software-only trio — Stage D's evaluateAudio signature never even receives network/policy/caps, so the fired reason is identical regardless (mirrors cases 059-062's Stage-A/B/C indifference pattern). why (Phase 3 Step 2f amendment): overallBitrateBps lowered from 7500000 to 3200000 (still the original video+audio stream bitrates, only the whole-file derived rate changed) so it stays <= wan-4mbps's 4,000,000 cap — Stage F (bitrate/ladder) is now real and would otherwise ALSO fire bitrate-exceeds-network on this case's original number purely because of the network fixture choice this case deliberately makes for Stage-D-indifference purposes, contaminating the reason list this case exists to pin. The case's own point (Stage D's reason is unaffected by network/policy/caps variety) is unchanged and still exercised."
