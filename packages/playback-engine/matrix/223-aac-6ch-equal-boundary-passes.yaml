name: direct-play — aac 6ch exactly at web-chrome's 6ch cap — boundary passes
why: "Equal-to-cap boundary: stream.channels > entry.maxChannels is a strict inequality, so 6 == 6 never fires audio-channels-exceed-device."
input:
  media:
    fileId: file-0223
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 6000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 6
        sampleRate: 48000
        bitrateBps: 384000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: direct-play
  reasons: []
