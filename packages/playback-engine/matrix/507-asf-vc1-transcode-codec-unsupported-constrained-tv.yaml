name: transcode — asf container (v1.1 legacy reinstatement) vc1 vs constrained-tv (codec unsupported)
why: >
  STATE.md H3 (v1.1 widening, docs/PLAYBACK.md §2.1): asf is a newly
  admitted Container member (wmv/wma's ffprobe format_name) — proves the
  routing for a device that supports NEITHER the container nor the codec.
  Stage A fires container-not-direct-playable (asf is not, and never will
  be, in any device's directPlayContainers — no device ever declares a
  v1.1-reinstated container direct-playable). Stage B rule 2 also fires:
  constrained-tv declares no vc1 entry at all, so video-codec-unsupported
  fires too — proving the codec side needed ZERO widening (vc1 already
  existed in the closed VideoCodec union; only Container moved).

  why (Stage G arrival, STATE.md P3.9(a)): caps.software-only declares no
  hardware backend, so Stage G's rule (iii) always routes full software
  (`software-fallback:encode`). policies.t0-default is tier 0 and the
  selected source stream is exactly 1080p (>=1080), so the tier cap (docs/
  PLAYBACK.md §8.3) also applies: buildLadder's pre-cap survivors for this
  scenario (vc1 1080p/5.5Mbps source, local network, constrained-tv's 20Mbps
  device cap) are the 1080p/4M, 720p/3M, 480p/1.5M, and 360p/0.8M rungs — the
  tier cap removes the two rungs above 480p, so `software-fallback:tier-
  capped` fires too (identical shape to seed case 002, container/codec
  swapped only).

input:
  media:
    fileId: file-0507
    container: asf
    durationMs: 6300000
    sizeBytes: 5200000000
    overallBitrateBps: 6600000
    video:
      - index: 0
        codec: vc1
        profile: null
        level: null
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 128000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.constrained-tv }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - video-codec-unsupported
    - software-fallback:encode
    - software-fallback:tier-capped
