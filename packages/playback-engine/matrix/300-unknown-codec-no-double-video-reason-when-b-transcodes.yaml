name: "transcode — unknown codec burn-in + Stage B ALREADY transcoding (unsupported codec) -> no duplicate video-transcode reason"
why: >
  image-render-capable's device.video only declares h264, but this stream is hevc -> Stage B fires video-codec-unsupported (transcode) independently of the subtitle. Stage E's unknown-codec burn-in still fires (subtitle-codec-unknown), but since Stage B's OWN verdict is already 'transcode', video-transcode-for-subtitle-burn-in is NOT appended a second time (binding interpretation constraint 6) — reasons appear in exact stage order [video-codec-unsupported, subtitle-codec-unknown]. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0300
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: unknown
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.image-render-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-codec-unsupported
    - subtitle-codec-unknown
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
