  mpeg2 has no documented ladder; a non-matching profile string always fires video-profile-unsupported under the exact-string-match-or-exceeds fallback. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).
