name: direct-stream — asf container (v1.1 legacy reinstatement) vc1 vs vc1-generic (container-only obstacle)
why: >
  STATE.md H3: same vc1 stream as matrix case 094 (vc1 direct-play vs
  vc1-generic), container swapped from mkv to asf. vc1-generic genuinely
  supports the vc1 codec (Stage B copy — proving the codec side needed no
  change), but its directPlayContainers is [mkv, ts] — asf is not, and
  never will be, a member (adjudicated: v1.1-reinstated containers are
  never direct-playable). Stage A alone escalates to direct-stream with
  reason container-not-direct-playable — the container is the ONLY
  obstacle here, isolating that half of the routing from case 507's
  codec-also-unsupported scenario.

