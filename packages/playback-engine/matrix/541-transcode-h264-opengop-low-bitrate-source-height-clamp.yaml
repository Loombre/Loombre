name: transcode — mkv h264 openGop:true at 0.93 Mbps vs constrained-tv — §7 source-height clamp keeps a 1080p rung instead of collapsing to 360p
why: >
  ENGINE_VERSION 0.13.0 (docs/PLAYBACK.md §7 construction rules, 2026-09-07;
  Linux reference box on rebuild #10): Stage B′ forces this 1080p open-GOP
  stream into a transcode, and under the old "drop every rung above the
  source bitrate" rule only 360p/0.8M survived — a title that used to be
  served as a 1080p copy came out at 360p. The clamp keeps the rung at the
  source's own resolution (greatest height after the height rule; ties ->
  its lowest-bitrate row, 1080p/4M here) with its bitrate lowered to
  min(own, max(round(1.25 × 930000) = 1162500, table floor 800000)); the
  other over-bitrate rungs (1080p/8M, 720p/3M, 480p/1.5M) are dropped as
  before and 360p/0.8M survives on its own merits. Tier 2 (policies.t2-default,
  the reference box's LOOMBRE_TIER=2), because on Tier 0 §8.3's cap would
  land this full-software route back on 360p regardless (see 352) — the
  clamp is observable only above Tier 0. caps.software-only routes the
  transcode to software: `software-fallback:encode` closes the reason list.

input:
  media:
    fileId: file-0541
    container: mkv
    durationMs: 6000000
    sizeBytes: 800000000
    overallBitrateBps: 1100000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 24
        bitrateBps: 930000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: true
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device:
    fixture: devices.constrained-tv
  network:
    fixture: networks.local
  policy:
    fixture: policies.t2-default
  caps:
    fixture: caps.software-only
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - video-open-gop-copy-unsafe
    - software-fallback:encode
  container: ts-hls
  video:
    action: transcode
  ladder:
    - { heightPx: 1080, videoBitrateBps: 1162500, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
