name: transcode — 360p source keeps ONLY the 360p rung, via height alone (not the rule-e fallback)
why: >
  Rule (a) at its tightest natural boundary: source height (360) equals the ladder's OWN lowest rung height, so every rung above it (480p and up) gets dropped by height — the surviving ladder is exactly the 360p rung, reached NATURALLY through rule (a) alone (distinct from cases 341/342, where the identical single-rung result came from the rule-(e) fallback overriding an otherwise-fully-dropped table). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0345
    container: mp4
    durationMs: 6000000
    sizeBytes: 7500000000
    overallBitrateBps: 10000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 640
        height: 360
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
