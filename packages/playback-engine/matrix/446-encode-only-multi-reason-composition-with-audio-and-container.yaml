name: "transcode — composition A+D+F under encode-only caps: container, audio, and bitrate reasons all fire; Stage G appends last"
why: >
  mkv vs web-chrome's [mp4,webm] directPlayContainers (mismatch) + truehd passthrough-unsupported audio (web-chrome declares truehd but passthrough:false) + bitrate exceeding a tight network cap, all under encode-only caps: Stage B copies (h264 1080p is within web-chrome's caps), so reasons fire in stage order [container-not-direct-playable, audio-passthrough-unsupported, bitrate-exceeds-network], THEN Stage G appends software-fallback:decode (encode-only's nvenc encode-covers the ladder's h264 targets but has no verified decode; software decodes h264) — proving Stage G composes correctly after a MULTI-stage reason set, not just single-reason scenarios.

  Wave C2 / §7.5 step (h) CHURN (regression law, §10). This case's own
  arithmetic: the FINAL Tier-0 ladder had 4 rungs, more than
  TIER0_MAX_ADVERTISED_VARIANTS (3), so the ADVERTISED set — which §9.1's
  master playlist enumerates verbatim — is trimmed to top 1080p@4000000 +
  geometric-mid 480p@1500000 + floor 360p@800000. The geometric mean of
  4000000 and 800000 is ~1788854 bps, and 1500000 is the surviving
  candidate nearest it in log space. Dropped: 720p@3000000. One
  informational `ladder-variant-capped` fires (single-firing,
  owner-decision V2) with every dropped rung in its detail, LAST in the
  reason list because step (h) runs after Stage G. decision, container,
  video.* and ffmpegArgs are UNCHANGED — the keep rule's first clause is
  "keep the top rung", which is the only rung `video.targetCodec` and the
  initially-encoded pipeline ever read.

input:
  media:
    fileId: gen-file
    container: mkv
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: truehd
        channels: 6
        sampleRate: 48000
        bitrateBps: 1500000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.encode-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - audio-passthrough-unsupported
    - bitrate-exceeds-network
    - software-fallback:decode
    - ladder-variant-capped
