name: direct-play — mp4 h264 CONSTRAINED BASELINE@41 8-bit 1080p + aac 2ch, web-chrome (SPF-12)
why: >
  SPF-12 (found live): ffprobe reports phone recordings, screen captures and
  WebRTC/OBS exports as "Constrained Baseline" (worker-normalized to
  constrainedbaseline), a strict subset of Baseline that every browser
  decodes. It was not a member of stages/video.ts's h264 profile ladder, so
  the conservative unranked-exceeds rule fired video-profile-unsupported and
  forced a transcode session — a cap slot and an encoder for a file that
  direct-plays. The alias ranks it at baseline: direct-play, no reasons.

input:
  media:
    fileId: file-0001
    container: mp4
    durationMs: 5400000
    sizeBytes: 4050000000
    overallBitrateBps: 6000000
    video:
      - index: 0
        codec: h264
        profile: constrainedbaseline
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: direct-play
  reasons: []
