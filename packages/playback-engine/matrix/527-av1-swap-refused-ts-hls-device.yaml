name: transcode — opted-in T1 with software av1, but an MPEG-TS-only client -> NO av1 swap, ladder byte-identical to pre-C1
why: >
  Wave C1 / LD-7, §7.1's condition-2 negative on the SWAP side (case 525
  covers the same fact on the demotion side). Every capability condition
  passes — policies.av1-preferred-t1 opts in, caps.software-av1 gives
  eligibility 'software' at tier 1 — and the device even declares an av1
  `device.video` entry. The swap still must not fire, because
  devices.av1-ts-only cannot take fmp4 and AV1 has no assigned MPEG-TS
  stream_type (§6 interp. M). The produced ladder is therefore the
  UNCHANGED instance default table minus the 2160p rung the 1080p source
  caps away — byte-identical to what this input produced before Wave C1,
  which is the point: the swap is claimed by nothing here, so the h264
  fall-through owns every rung. `hevcEncodePreferred` is false in this
  policy, so no hevc swap masks the result either.
