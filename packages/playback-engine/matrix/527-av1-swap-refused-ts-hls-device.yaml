  media:
    fileId: file-527
    container: ts
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 20500000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
