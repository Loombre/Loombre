name: transcode — video interlaced (Stage B) + audio passthrough unsupported (Stage D), exact stage order
why: "The h264 stream is interlaced (Stage B rule 1 fires video-interlaced) while every other video axis stays within web-chrome's caps (rule 2/3 stay silent). The truehd stream (6ch, well under web-chrome's 8ch cap) has passthrough:false -> Stage D rule 3 fires audio-passthrough-unsupported. Container mp4 is in web-chrome's list (Stage A silent). Reasons appear in exact stage order: [video-interlaced, audio-passthrough-unsupported]. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).\n"
input:
  media:
    fileId: file-0256
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 7500000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: truehd
        channels: 6
        sampleRate: 48000
        bitrateBps: 2500000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - video-interlaced
    - audio-passthrough-unsupported
    - software-fallback:encode
    - software-fallback:tier-capped
