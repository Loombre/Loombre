name: transcode — 2160p source over a 1Mbps remote network, keep-lowest-rung
why: >
  Stage F network-dimension coverage, 1Mbps tier (the tightest §10 network value) — bitrate-exceeds-network fires alone. §7 ladder construction: source height/bitrate are generous (2160p, 20Mbps) so rules (a)/(b) drop nothing; the 1Mbps network cap then drops EVERY rung except the 360p rung (800,000bps <= 1,000,000bps) — the surviving ladder is EXACTLY the single 360p rung, pinned via the expect.ladder bonus (mission's "keep-lowest-rung" case). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0332
    container: mp4
    durationMs: 6000000
    sizeBytes: 18750000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-1mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
