name: transcode — UNREACHABILITY leg 4 — T0 'hw' eligibility whose route still lands on full software -> Stage G demotes every av1 rung
why: >
  Wave C1 / LD-16, §7.2's residual guard and the fourth (and subtlest)
  unreachability leg. caps.hw-av1-encode-only verifies av1 encode on nvenc
  and NOTHING else, so §7.2's gate returns `'hw'` and the §7.1 swap legally
  admits av1 rungs even at tier 0. But the 2160p SOURCE keeps the table's
  untouched 2160p/hevc rung alive, so the ladder's distinct target set is
  the MIXED {hevc, av1} — which nvenc's encode list cannot cover, so §8.3's
  rules (i) and (ii) both skip it and the one-route model terminates at
  rule (iii) full-software. Without the guard this is precisely the pairing
  the LD-16 law forbids: a Tier-0 box software-encoding AV1, four cores
  pegged at a fraction of realtime with the playhead overrunning the
  encoder inside the first minute. The guard demotes all five av1 rungs
  through the SAME shared primitive §7.1(g) uses (cause=tier0-software-route)
  BEFORE the existing ≥1080p height cap runs, so the two ≤480p survivors
  are the DEMOTED rungs at their swap bitrates. Known conservatism, stated
  not hidden (§7.2): this box lands on software h264/hevc rather than
  splitting encode across two backends — §8.3's one-route model is not
  renegotiated by this feature.
