name: "direct-play — IMAGE vobsub, device.renderImage true AND container playable -> embed"
why: >
  image-render-capable declares subtitles.renderImage:true; mp4 is in its directPlayContainers -> both AND conditions hold, so Stage E embeds (copy) the vobsub stream. Video/audio both fit the device's generous h264/aac caps, so the whole plan is direct-play, reason-free.

input:
  media:
    fileId: file-0290
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: vobsub
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.image-render-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: direct-play
  reasons: []
  subtitleStrategy: embed
