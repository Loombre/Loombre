name: transcode — full-hw routes mpeg2 DECODE through nvenc
why: >
  Source codec is mpeg2; full-hw's nvenc verifies mpeg2 decode + h264/hevc encode. Stage F fires bitrate-exceeds-network (overallBitrateBps 25Mbps over the 20Mbps network cap); rule (i) fires hw-encoder-selected:nvenc.

input:
  media:
    fileId: gen-file
    container: ts
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: mpeg2
        profile: main
        level: null
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.mpeg2-generic }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:nvenc
