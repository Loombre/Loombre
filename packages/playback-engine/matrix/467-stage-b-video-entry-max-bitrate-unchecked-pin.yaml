name: AUDIT direct-play — a video ENTRY's maxBitrateBps (§2.2) far below the stream's bitrate does NOT
  fire any Stage B reason (as-implemented pin; spec-PR candidate)
why: 'Step-7 audit pin of a Step-2b logged interpretation that never got a matrix case: §2.2''s per-entry
  maxBitrateBps is deliberately unchecked by Stage B (no §4 code exists for it; §3 rule 3''s axis list
  omits bitrate; Stage F owns the only bitrate dimension and reads device.maxStreamBitrateBps, not the
  entry field). An 8M h264 stream against an entry declaring maxBitrateBps 2M — with the DEVICE-level
  cap null and the network local — must be direct-play []. Candidate docs/PLAYBACK.md clarification: either
  give the entry field semantics (a new §4 code) or drop it from §2.2. Inline device isolates the entry
  cap as the only unusual axis.'
