name: "transcode — TEXT webvtt: device renders it natively but the container ISN'T direct-playable -> burn-in, not embed"
why: >
  text-embed-capable declares renderText including webvtt, but its directPlayContainers is [mp4, mkv] and this case's container is webm (NOT in that list) -> Stage A fires container-not-direct-playable, so containerDirectPlayable is false for Stage E too. Cascade (b) requires BOTH renderText membership AND container direct-playability — with the container half failing, (b) does not fire and (c) burns in instead, proving the embed branch's AND-gate applies to TEXT exactly like IMAGE's. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0282
    container: webm
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: webvtt
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.text-embed-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.text-burn-in-preferred }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - subtitle-format-requires-burn-in
    - video-transcode-for-subtitle-burn-in
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
