name: transcode — hdr10 tone-map required, macos-vt selects videotoolbox with the videotoolbox tone-map method
why: >
  hdr10 mismatch requires tone-mapping; macos-vt's videotoolbox verifies decode/encode AND its OWN toneMap array includes 'videotoolbox' (§8.3's videotoolbox->videotoolbox preference), so rule (i) fires hw-encoder-selected:videotoolbox with video.toneMap='videotoolbox' (verified by test/stages/hardware.spec.ts, not this schema).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8200000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 7000000
        hdr: hdr10
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-sdr }
  network: { fixture: networks.local }
  policy: { fixture: policies.t1-cpu-tonemap }
  caps: { fixture: caps.macos-vt }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - hdr-tone-map-required
    - hw-encoder-selected:videotoolbox
