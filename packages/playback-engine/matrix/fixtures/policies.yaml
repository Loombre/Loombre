# Shared ServerPolicy fixtures (docs/PLAYBACK.md §2.4). Field defaults per
# the resolved-defaults comments in the spec (T0 policy defaults).

# T1 variant that explicitly allows CPU tone mapping — used by cases that
# exercise the tone-map path itself rather than the tier-gated refusal
# (with T0 defaults + software-only caps, §3 Stage C would additionally emit
# tone-map-refused-by-policy and an empty ladder).
t1-cpu-tonemap:
  allowTranscode: true
  allowToneMapCpu: always
  tier: 1
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 2
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false

t0-default:
  allowTranscode: true
  allowToneMapCpu: tier-gated
  tier: 0
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 1
  # Instance default ladder table, docs/PLAYBACK.md §7.
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false

# --- Phase 3 Step 2c (Stage C — HDR) additive fixture ---------------------
# `allowToneMapCpu: never` UNCONDITIONALLY refuses a CPU tone-map — unlike
# `tier-gated` (only refuses at tier 0), 'never' refuses regardless of
# tier (docs/PLAYBACK.md §3/binding interpretation constraint 4). tier: 2
# here is DELIBERATE (not tier 0) — it proves 'never' doesn't need tier 0
# to bite, matching the mission's explicit "'never' + software-only +
# tier 2 → refused" refusal-matrix variant. This same fixture pairs with
# hardware-tonemap-capable caps sets (macos-vt/full-hw) in other cases to
# prove the OTHER half of the refusal formula: 'never' alone is NOT
# sufficient to refuse when a caps backend already has a real hardware
# tone-map method (refusal requires BOTH no hardware method AND a
# refusing policy).
tonemap-never:
  allowTranscode: true
  allowToneMapCpu: never
  tier: 2
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 4
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false

# --- Phase 3 Step 2c (Stage C — HDR) additive fixture ---------------------
# `allowToneMapCpu: tier-gated` at a NON-ZERO tier — proves the "tier-gated
# only refuses at tier 0" half of the refusal formula (binding
# interpretation constraint 4): at tier 1 (or any tier != 0), tier-gated
# behaves like an allowed CPU tone-map path, same as 'always', even under
# software-only caps. Distinct from `t1-cpu-tonemap` above, which uses
# `allowToneMapCpu: always` — this fixture specifically exercises the
# 'tier-gated' resolution rule at a non-zero tier, not the 'always' rule.
tiergated-t1:
  allowTranscode: true
  allowToneMapCpu: tier-gated
  tier: 1
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 2
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false

