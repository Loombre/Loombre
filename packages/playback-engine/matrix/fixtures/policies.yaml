# --- Phase 3 Step 2f (Stage F — bitrate/ladder) additive fixture -----------
# Identical to `t0-default` except `hevcEncodePreferred: true` — every prior
# policy fixture declares this false. Pairs with a device declaring an hevc
# `device.video` entry (e.g. `devices.web-safari`, `devices.hevc-sdr`, or the
# combined `devices.bitrate-capped-device`) to exercise the §7 hevc-swap
# construction rule (binding interpretation constraint 3, step f); paired
# with an h264-only device (e.g. `devices.web-chrome`), it proves the swap
# does NOT apply merely because the policy wants it — `device.video` must
# also declare hevc.
hevc-preferred:
  allowTranscode: true
  allowToneMapCpu: tier-gated
  tier: 0
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 1
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: true

# --- Phase 3 §11 step 3 (Stage G — hardware routing) additive fixture -----
# Empty ladderRungs — isolates the decode-only-backend guard (binding
# interpretation 2's defensive note, stages/hardware.ts): with NO rungs to
# build at all, the ladder's target-codec set is vacuously `[]`, which is
# the only way any current case can exercise that guard (every other policy
# fixture's ladderRungs is the real 6-rung table, and the property
# generators always supply it too). tier 1 (not 0) so the tier cap — a
# DIFFERENT Stage G concern — never conflates with this fixture's purpose.
empty-ladder:
  allowTranscode: true
  allowToneMapCpu: tier-gated
  tier: 1
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 1
  ladderRungs: []
  segmentDurationSec: 6
  hevcEncodePreferred: false

# --- Phase 3 step 7 (adversarial spec audit) additive fixtures -------------
# t0-default with `allowTranscode: false` (docs/PLAYBACK.md §2.4's knob,
# §10's "transcode-disabled" policy dimension, §4's blocking-class
# `transcode-disabled-by-policy`). Step 7b fix F1 made the knob REAL: in
# src/plan.ts's final assembly, an aggregated 'transcode' decision under
# allowTranscode:false keeps decision 'transcode' and mirrors the
# tone-map-refused empty-output shape — `transcode-disabled-by-policy`
# appended LAST (assembly-level verdict, after every stage's reasons; Stage
# G skipped entirely, tone-map refusal moot), ladder [], ffmpegArgs [],
# video/audio target fields unset. Boundary: repackaging is not
# transcoding — direct-stream/remux/direct-play are unaffected. Cases
# 451/452 (would-transcode paths), 453/505 (repackage unaffected), 489
# (direct-play), 503/504/506 (video-driven, audio-only, refusal-interaction)
# pin the semantics.
transcode-disabled:
  allowTranscode: false
  allowToneMapCpu: tier-gated
  tier: 0
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 1
  ladderRungs:
    - { heightPx: 2160, videoBitrateBps: 16000000, audioBitrateBps: 384000, codec: hevc }
    - { heightPx: 1080, videoBitrateBps: 8000000, audioBitrateBps: 384000, codec: h264 }
    - { heightPx: 1080, videoBitrateBps: 4000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 480, videoBitrateBps: 1500000, audioBitrateBps: 160000, codec: h264 }
    - { heightPx: 360, videoBitrateBps: 800000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false

# Single-rung 720p-only instance ladder at tier 0 — constructs the §8.3
# tier-cap edge where the PRE-cap ladder is exactly ONE rung above 480p:
# the tier filter momentarily empties it, the keep-lowest rescue restores
# the SAME rung, and `software-fallback:tier-capped` must NOT fire
# (stages/hardware.ts binding interpretation 4's sameLadder comparison —
# "the client actually lost rungs" vs "the filter momentarily produced []").
# Previously pinned only in unit tests; case 462 pins it at matrix level.
only-720p-ladder:
  allowTranscode: true
  allowToneMapCpu: tier-gated
  tier: 0
  preferredTextSubMode: hls-vtt
  preserveAssStyling: false
  audioTranscodeCodecPriority: [opus, aac]
  maxSimultaneousTranscodes: 1
  ladderRungs:
    - { heightPx: 720, videoBitrateBps: 3000000, audioBitrateBps: 160000, codec: h264 }
  segmentDurationSec: 6
  hevcEncodePreferred: false
