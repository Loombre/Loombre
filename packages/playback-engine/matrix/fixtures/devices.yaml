# --- Phase 3 Step 2d (Stage D — Audio) additive fixtures --------------------
# Added because no existing fixture declares a bitstream-passthrough-capable
# TrueHD/DTS-HD audio entry (`passthrough: true`) or a plain (non-HD) DTS
# entry — every existing truehd-capable device (web-chrome) declares
# `passthrough: false` specifically to exercise Stage D.3's transcode path
# (seed case 004). This is the passthrough-TRUE counterpart, so Stage D.3's
# copy branch (docs/PLAYBACK.md §3: "copy ONLY when device entry has
# passthrough:true") has a device that can actually take it. Broad generous
# h264 video cap (mirrors web-chrome's) so it composes cleanly with any of
# the audio-focused matrix cases.
passthrough-capable:
  profileId: passthrough-capable-client
  directPlayContainers: [mp4, mkv]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 52
      maxBitDepth: 8
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 50000000
  hdr: { hdr10: true, hlg: true, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 8
      passthrough: false
    # Bitstream passthrough — Stage D.3's copy branch.
    - codec: truehd
      maxChannels: 8
      passthrough: true
    - codec: dtshd
      maxChannels: 8
      passthrough: true
    # Plain (non-HD) DTS — Stage D.3 never applies to this codec regardless
    # of the passthrough flag's value (binding interpretation: "Plain `dts`
    # is NOT DTS-HD — rules 1/2 only").
    - codec: dts
      maxChannels: 6
      passthrough: false
    - codec: ac3
      maxChannels: 6
      passthrough: false
    - codec: opus
      maxChannels: 8
      passthrough: false
  subtitles: { renderText: [webvtt], hlsVtt: true, renderImage: false }
  maxStreamBitrateBps: null

# Device declaring ONLY aac (no opus, no truehd/dtshd) — exercises Stage
# D.4's assembly fallback rule when `policy.audioTranscodeCodecPriority`
# prefers opus but the device never declares it (binding interpretation
# constraint 4: "first of policy.audioTranscodeCodecPriority present in
# device.audio").
aac-only-no-opus:
  profileId: aac-only-no-opus-client
  directPlayContainers: [mp4]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 41
      maxBitDepth: 8
      maxWidth: 1920
      maxHeight: 1080
      maxFrameRate: 60
      maxBitrateBps: null
  hdr: { hdr10: false, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [], hlsVtt: false, renderImage: false }
  maxStreamBitrateBps: null

# --- Phase 3 Step 2e (Stage E — Subtitles) additive fixtures ----------------
# Added because no existing fixture declares MORE than one TEXT subtitle
# codec in `renderText` (web-chrome/web-safari both declare only [webvtt]),
# and NONE declares `renderImage: true` at all — both are needed to isolate
# the TEXT (b)/IMAGE embed branches (docs/PLAYBACK.md §3 Stage E) from the
# hls-vtt branch and from the burn-in fallback, across every TEXT codec.

# `hlsVtt: true` AND renders every TEXT codec natively — lets a single
# fixture cover BOTH sides of the TEXT cascade's (a) condition (device flag
# true) for every codec, paired with either a hls-vtt-preferring or
# burn-in-preferring policy fixture below to select which literal branch
# fires (docs/PLAYBACK.md §3 Stage E TEXT tree, cascade order — binding
# interpretation constraint 3).
text-all-capable:
  profileId: text-all-capable-client
  directPlayContainers: [mp4, mkv]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 52
      maxBitDepth: 8
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 50000000
  hdr: { hdr10: false, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [subrip, ass, webvtt, mov_text], hlsVtt: true, renderImage: false }
  maxStreamBitrateBps: null

# Same TEXT-codec coverage as `text-all-capable` but `hlsVtt: false` — proves
# the cascade's (a) condition is a genuine AND (device flag alone, absent a
# hls-vtt-preferring policy, is not sufficient) and isolates the (b) embed
# branch ("device renders codec natively in directPlayContainer") on its own.
text-embed-capable:
  profileId: text-embed-capable-client
  directPlayContainers: [mp4, mkv]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
