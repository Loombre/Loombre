      maxLevel: 52
      maxBitDepth: 8
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 50000000
  hdr: { hdr10: false, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [subrip, ass, webvtt, mov_text], hlsVtt: false, renderImage: false }
  maxStreamBitrateBps: null

# --- Phase 3 Step 2f (Stage F — bitrate/ladder) additive fixture -----------
# A device with a genuinely restrictive, non-null `maxStreamBitrateBps`
# (docs/PLAYBACK.md §2.2: "device hard cap — TV SoC limits"). The two
# existing non-null-cap fixtures (`constrained-tv`, `mpeg2-generic`) both
# declare 20,000,000 — generous enough that it never actually drops a rung
# from the §7 default ladder table (whose highest rung is 16,000,000), so
# neither can exercise Stage F's device-cap reason/construction rules
# meaningfully. This fixture's cap (500,000) sits BELOW even the default
# table's lowest rung (360p/800,000), so it doubles as the fixture used both
# for "local + exceeds device cap -> reason fires" cases (the Stage F REASON
# rule only needs `overallBitrateBps > maxStreamBitrateBps`, any non-null
# value below it works) and for "every rung dropped by the device cap alone
# -> keep only the lowest rung" ladder-construction cases (§7's "keep at
# least the lowest rung" fallback). Video/audio/hdr entries are otherwise as
# generous as `web-chrome` so this fixture never contaminates Stage
# A/B/C/D/E's own reasons when used in a Stage-F-focused case.
bitrate-capped-device:
  profileId: bitrate-capped-device-client
  directPlayContainers: [mp4, mkv, webm, mov]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 52
      maxBitDepth: 8
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: null
    - codec: hevc
      maxProfile: main10
      maxLevel: 153
      maxBitDepth: 10
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: null
  hdr: { hdr10: true, hlg: true, dolbyVision: true }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
    - codec: opus
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [webvtt], hlsVtt: true, renderImage: false }
  maxStreamBitrateBps: 500000

# `renderImage: true` — no existing fixture sets this (every prior fixture
# declares it false), so nothing could exercise the IMAGE tree's embed branch
# ("device.subtitles.renderImage && container playable -> 'embed'") until
# now.
