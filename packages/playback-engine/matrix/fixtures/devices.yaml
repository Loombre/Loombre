# framerate axes. Every one of these is a genuinely new axis matrix/README.md's
# case-authoring rule can't exercise with the five Step-2a fixtures above.

# AV1-capable client with a concrete (non-null) level cap, so av1 profile/
# level/resolution/framerate can each be isolated as "the deciding axis"
