      maxProfile: main10
      maxLevel: 153
      maxBitDepth: 10
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 80000000
  hdr: { hdr10: true, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [], hlsVtt: false, renderImage: false }
  maxStreamBitrateBps: null

# Strictly hlg-only: hlg true, hdr10 AND dolbyVision false.
