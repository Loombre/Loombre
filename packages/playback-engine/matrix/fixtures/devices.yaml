# hdr10-true/hlg-false and one that is hdr10-false/hlg-true IN ISOLATION —
# `devices.hevc-hdr10-only` (above, Phase 3 Step 2b/2a vintage) actually
# declares BOTH hdr10:true AND hlg:true (it exists for the DV-strip-vs-
# HDR10 scenario, not to isolate the hdr10 flag from the hlg flag), and
# `devices.hevc-sdr` declares all three false. Neither can exercise "hlg
# source vs an hdr10-but-not-hlg device" or "hdr10 source vs an hlg-but-
# not-hdr10 device" — the two flags need to be independently false/true to
# prove stages/hdr.ts checks EACH flag on its own axis rather than treating
# "any HDR flag" as sufficient.

# Strictly hdr10-only: hdr10 true, hlg AND dolbyVision false.
