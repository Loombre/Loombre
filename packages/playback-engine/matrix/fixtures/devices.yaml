# Shared DeviceProfile fixtures for matrix cases (docs/PLAYBACK.md §2.2).
# Referenced from case files via `{ fixture: "devices.<key>" }`.

# Generic evergreen browser client: broad codec support, no HDR-plus-Atmos
# passthrough, renders WebVTT natively, burns in image subs.
web-chrome:
  profileId: web-chrome
  directPlayContainers: [mp4, webm]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 52
      maxBitDepth: 8
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 50000000
    - codec: vp9
      maxProfile: null
      maxLevel: null
      maxBitDepth: 10
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 50000000
  hdr: { hdr10: true, hlg: true, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
    - codec: opus
      maxChannels: 6
      passthrough: false
    # Decodable but no bitstream passthrough — exercises Stage D.3.
    - codec: truehd
      maxChannels: 8
      passthrough: false
    - codec: ac3
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [webvtt], hlsVtt: true, renderImage: false }
  maxStreamBitrateBps: null

# Tier-0-style constrained smart TV: h264-only, 1080p SDR, stereo, mp4
# direct-play only (docs/PLAYBACK.md §10 dimension list).
constrained-tv:
  profileId: constrained-tv
  directPlayContainers: [mp4]
  hls: { container: ts, supportsFmp4: false, lowLatency: false }
  video:
    - codec: h264
      maxProfile: high
      maxLevel: 41
      maxBitDepth: 8
      maxWidth: 1920
      maxHeight: 1080
      maxFrameRate: 30
      maxBitrateBps: 20000000
  hdr: { hdr10: false, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 2
      passthrough: false
  subtitles: { renderText: [], hlsVtt: false, renderImage: false }
  maxStreamBitrateBps: 20000000

# HEVC-decode-capable client that is SDR-only (case 5): main10 profile is
# within device limits, but no HDR10/HLG/DV flag is set, forcing tone-map.
hevc-sdr:
  profileId: hevc-sdr-client
  directPlayContainers: [mp4]
  hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
  video:
    - codec: hevc
      maxProfile: main10
      maxLevel: 153
      maxBitDepth: 10
      maxWidth: 3840
      maxHeight: 2160
      maxFrameRate: 60
      maxBitrateBps: 80000000
  hdr: { hdr10: false, hlg: false, dolbyVision: false }
  audio:
    - codec: aac
      maxChannels: 6
      passthrough: false
  subtitles: { renderText: [], hlsVtt: false, renderImage: false }
  maxStreamBitrateBps: null

# HEVC-decode-capable client with HDR10 support but no Dolby Vision (case 10):
# a DV profile 8 HDR10-compatible base layer strips to HDR10 rather than
# tone-mapping.
hevc-hdr10-only:
  profileId: hevc-hdr10-client
  directPlayContainers: [mp4]
