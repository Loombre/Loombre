name: transcode — 720p source over a 1Mbps remote network, height AND network both narrow the ladder
why: >
  Stage F 1Mbps tier variety with a 720p source (distinct from case 332's 2160p source): bitrate-exceeds-network fires (overall 6Mbps > 1Mbps cap, non-local). Ladder: rule (a) drops the 2160p and both 1080p rungs (source height 720p); rule (b) (source bitrate 5Mbps) keeps the remaining 720/480/360 rungs; the 1Mbps network cap then drops 720p (3Mbps) and 480p (1.5Mbps) too, leaving only the 360p rung — same single-rung result as 332, reached via a DIFFERENT combination of rules (height first, then network), asserted via the looser ladderMaxVideoBitrateBps bound here. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0334
    container: mp4
    durationMs: 6000000
    sizeBytes: 4500000000
    overallBitrateBps: 6000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1280
        height: 720
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-1mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 800000
