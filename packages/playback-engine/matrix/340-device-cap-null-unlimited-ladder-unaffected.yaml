name: transcode — device.maxStreamBitrateBps null means rule (d) drops nothing, even while Stage F's reason fires
why: >
  Explicit "device-cap-null unlimited" coverage: a non-local network so the reason fires regardless of any device cap (overall 40Mbps > wan-4mbps's 4Mbps cap, non-local); device.maxStreamBitrateBps is null (web-chrome) so §7 construction rule (d) never drops anything on its own. Ladder: rule (a) drops the 2160p rung (source is 1080p); rule (b) (10Mbps source) keeps every remaining rung; rule (c) (4Mbps network cap, non-local) drops the 1080p/8Mbps rung; rule (d) contributes nothing further — surviving max is exactly 4,000,000, driven ENTIRELY by the network cap, never by the (null) device cap. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0340
    container: mp4
    durationMs: 6000000
    sizeBytes: 30000000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 10000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladderMaxVideoBitrateBps: 4000000
