name: transcode — truehd 8ch exceeding a 6ch-capped device AND passthrough:false — rules 2 and 3 both fire, in order
why: "Inline device declares truehd maxChannels:6 (unlike web-chrome's 8) with passthrough:false, and the stream carries 8 channels — both Stage D rule 2 (channels exceed) and rule 3 (passthrough unsupported) fire independently, in the documented 2-then-3 order, with audio-atmos-lost appended last (binding interpretation constraint 2/3)."
input:
  media:
    fileId: file-0210
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 7500000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: truehd
        channels: 8
        sampleRate: 48000
        bitrateBps: 3000000
        language: eng
        isDefault: true
        hasAtmos: true
    subtitle: []
  device:
    profileId: inline-truehd-limited
    directPlayContainers: [mp4]
    hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
    video:
      - codec: h264
        maxProfile: high
        maxLevel: 41
        maxBitDepth: 8
        maxWidth: 1920
        maxHeight: 1080
        maxFrameRate: 60
        maxBitrateBps: null
    hdr: { hdr10: false, hlg: false, dolbyVision: false }
    audio:
      - codec: truehd
        maxChannels: 6
        passthrough: false
    subtitles: { renderText: [], hlsVtt: false, renderImage: false }
    maxStreamBitrateBps: null
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - audio-channels-exceed-device
    - audio-passthrough-unsupported
    - audio-atmos-lost
