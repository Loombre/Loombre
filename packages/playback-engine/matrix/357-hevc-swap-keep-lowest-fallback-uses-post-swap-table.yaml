name: transcode — rule (e)'s keep-lowest fallback picks the lowest of the POST-swap table, not the original
why: >
  Combines rule (e) with the hevc swap: an extremely tight network cap (100,000bps, far below even the swapped 360p/600,000 rung) drops every rung, forcing the rule-(e) fallback — but because the swap (step f) runs BEFORE the drop filters, the table rule (e) picks its lowest rung FROM is already {360p, 600,000, hevc}, not the original {360p, 800,000, h264}. Pinned exactly: the surviving rung's videoBitrateBps is 600,000 and its codec is hevc, proving construction order end-to-end. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0357
    container: mov
    durationMs: 6000000
    sizeBytes: 15000000000
    overallBitrateBps: 20000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-safari }
  network: { maxBitrateBps: 100000, isLocal: false }
  policy: { fixture: policies.hevc-preferred }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 600000
      audioBitrateBps: 160000
      codec: hevc
