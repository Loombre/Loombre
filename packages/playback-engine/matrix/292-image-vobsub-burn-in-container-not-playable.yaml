name: "transcode — IMAGE vobsub, device.renderImage TRUE but the container isn't direct-playable -> burn-in (AND requires BOTH)"
why: >
  image-render-capable declares renderImage:true, but this case's container (webm) is NOT in its directPlayContainers ([mp4, mkv]) -> Stage A fires container-not-direct-playable, so containerDirectPlayable is false for Stage E too, and the IMAGE tree's AND fails on the CONTAINER half this time (contrast with the renderImage-false case above, which fails on the OTHER half) -> 'burn-in'. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

input:
  media:
    fileId: file-0292
    container: webm
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5200000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 192000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle:
      - index: 2
        codec: vobsub
        language: eng
        isForced: false
        isDefault: false
        isExternal: false
        externalPath: null
  device: { fixture: devices.image-render-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: 2
  mode: stream

expect:
  decision: transcode
  reasons:
    - container-not-direct-playable
    - subtitle-format-requires-burn-in
    - video-transcode-for-subtitle-burn-in
    - software-fallback:encode
    - software-fallback:tier-capped
  subtitleStrategy: burn-in
