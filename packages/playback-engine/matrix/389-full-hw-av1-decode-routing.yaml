name: transcode — full-hw routes av1 DECODE through nvenc (encode targets stay h264/hevc per the ladder table)
why: >
  Source codec is av1; full-hw's nvenc verifies av1 decode AND h264/hevc/av1 encode. Stage F fires bitrate-exceeds-network (forcing the ladder to build); the surviving ladder's targets are h264/hevc (the §7 table never emits av1 rungs) — nvenc covers both, so rule (i) fires hw-encoder-selected:nvenc with av1 DECODE + h264 ENCODE, proving decode/encode routing are independent axes.

  Wave C2 / §7.5 step (h) CHURN (regression law, §10). This case's own
  arithmetic: the FINAL Tier-0 ladder had 5 rungs, more than
  TIER0_MAX_ADVERTISED_VARIANTS (3), so the ADVERTISED set — which §9.1's
  master playlist enumerates verbatim — is trimmed to top 1080p@8000000 +
  geometric-mid 720p@3000000 + floor 360p@800000. The geometric mean of
  8000000 and 800000 is ~2529822 bps, and 3000000 is the surviving
  candidate nearest it in log space. Dropped: 1080p@4000000, 480p@1500000.
  One informational `ladder-variant-capped` fires (single-firing,
  owner-decision V2) with every dropped rung in its detail, LAST in the
  reason list because step (h) runs after Stage G. decision, container,
  video.* and ffmpegArgs are UNCHANGED — the keep rule's first clause is
  "keep the top rung", which is the only rung `video.targetCodec` and the
  initially-encoded pipeline ever read.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: av1
        profile: null
        level: 30
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.av1-generic }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:nvenc
    - ladder-variant-capped
