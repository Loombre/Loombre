name: AUDIT transcode — amf declares a verified opencl toneMap but §8.3's preference table has no amf
  row → amf can never satisfy a tone-map requirement; falls through to software cpu-zscale
why: 'Pins stages/hardware.ts binding interpretation 3''s amf/d3d11va branch (previously defensive-only,
  fixture-unexercised): §8.3''s method table names only videotoolbox/nvenc/qsv/vaapi/software, so an amf
  backend — even one declaring a verified toneMap method — is treated as never able to tone-map. amf covers
  decode+encode for this route yet both rule (i) and (ii) fall through on method resolution; rule (iii)
  software + ''always'' CPU policy yields cpu-zscale. Reasons [hdr-tone-map-required, software-fallback:encode].
  Deliberate future-proof exception: hdr10 vs SDR.'
