name: transcode — UNREACHABILITY legs 1+2+3 — T0 + SOFTWARE-only av1 + operator opt-in -> zero av1 anywhere in the plan
why: >
  Wave C1 / LD-16, docs/PLAYBACK.md §7.2's unreachability argument, legs 1-3
  pinned as one plan. Identical to case 520 in EVERY respect except the caps
  set: caps.software-av1's libsvtav1 encode self-test passed, but no
  non-software backend verifies av1, so §7.2's `'software'` arm — which
  requires `tier >= 1` by definition — cannot apply and eligibility is
  `'none'` (leg 2). With eligibility `'none'` the §7.1(f) swap produces no
  av1 rung and §7.1(g) has none to normalize (leg 1), so `video.targetCodec`
  (derived exclusively from the final ladder's top rung) cannot be av1 and
  no av1 encoder name can appear in ffmpegArgs (leg 3). The operator opt-in
  is deliberately still ON: a preference flag alone never costs a Tier-0 box
  a CPU cycle. The resulting ladder is BYTE-IDENTICAL to what the same
  input produced before Wave C1 — the T0 tier cap then trims it to the
  ≤480p rungs exactly as it always did (caps.software-av1 has no hardware
  backend, so §8.3 lands on rule (iii)).
