name: transcode — source bitrate EXACTLY equal to a rung's videoBitrateBps keeps that rung (strict > only)
why: >
  Rule (b) boundary case: "exceed" is strict `>` — a rung whose videoBitrateBps EQUALS the source bitrate is not exceeding it. Source bitrate is exactly 4,000,000 (the 1080p/4Mbps rung's own value), so that rung survives while the 8Mbps and 16Mbps rungs above it are dropped. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`). expect.ladder is tightened accordingly to the now-tier-capped surviving rungs.

input:
  media:
    fileId: file-0351
    container: mp4
    durationMs: 6000000
    sizeBytes: 3000000000
    overallBitrateBps: 4000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 4000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
