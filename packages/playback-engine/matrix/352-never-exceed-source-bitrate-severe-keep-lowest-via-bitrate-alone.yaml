name: transcode — source bitrate below even the lowest rung forces keep-lowest via rule (b) alone
why: >
  Rule (e) triggered by rule (b) alone (distinct from 341/342, which triggered it via device/network caps): source bitrate is 700,000 — below even the 360p/800,000 rung — so EVERY rung is dropped on bitrate grounds (height/network/device are all generous/irrelevant here). Rule (e) keeps exactly the table's lowest-bitrate rung despite it still nominally exceeding the source's own bitrate. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

input:
  media:
    fileId: file-0352
    container: mp4
    durationMs: 6000000
    sizeBytes: 525000000
    overallBitrateBps: 700000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 700000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: true
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 64000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - video-interlaced
    - software-fallback:encode
  container: fmp4-hls
  ladder:
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
