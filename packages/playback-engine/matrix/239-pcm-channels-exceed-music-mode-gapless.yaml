name: transcode — pcm 6ch exceeds a 2ch-capped music-mode device — gapless-degraded
why: "Music mode (no video streams), container wav is in the inline device's directPlayContainers so Stage A stays silent. The pcm entry caps at 2 channels; a 6ch stream fires audio-channels-exceed-device (rule 2), and because this is a music-mode Stage-D transcode, gapless-degraded is appended (binding interpretation constraint 5)."
input:
  media:
    fileId: file-0239
    container: wav
    durationMs: 240000
    sizeBytes: 45000000
    overallBitrateBps: 1536000
    video: []
    audio:
      - index: 0
        codec: pcm
        channels: 6
        sampleRate: 48000
        bitrateBps: 1536000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device:
    profileId: inline-pcm-limited-music
    directPlayContainers: [wav]
    hls: { container: fmp4, supportsFmp4: true, lowLatency: false }
    video: []
    hdr: { hdr10: false, hlg: false, dolbyVision: false }
    audio:
      - codec: pcm
        maxChannels: 2
        passthrough: false
    subtitles: { renderText: [], hlsVtt: false, renderImage: false }
    maxStreamBitrateBps: null
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: null
    audioStreamIndex: 0
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - audio-channels-exceed-device
    - gapless-degraded
