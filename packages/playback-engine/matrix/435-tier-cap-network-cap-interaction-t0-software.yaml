name: "transcode — Stage F's own network-cap drop and Stage G's tier cap compose: network narrows to 4 rungs, tier cap narrows those further to 2"
why: >
  wan-4mbps's network cap (4,000,000) drops the 16M/8M rungs (Stage F's rule c), leaving [1080p/4M,720p/3M,480p/1.5M,360p/0.8M]; Stage G's tier cap (tier 0, 1080p source, full-software route since caps.software-only) then narrows THOSE four down to EXACTLY [480p/1.5M,360p/0.8M] — a real, non-vacuous removal, so software-fallback:tier-capped fires. Pinned via expect.ladder (exact array).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 40000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
