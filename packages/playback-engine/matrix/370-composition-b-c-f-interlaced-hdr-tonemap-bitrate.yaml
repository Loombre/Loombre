name: transcode — composition B+C+F (interlaced + hdr-tonemap fire as reasons; F contributes the capped ladder)
why: >
  Three-stage composition: video-interlaced (Stage B) AND hdr-tone-map- required (Stage C, NOT refused — t1-cpu-tonemap's allowToneMapCpu 'always') both fire, in stage order. Stage F's own reason cannot ALSO fire (Stage B already set videoAlreadyTranscoding), but buildLadder still runs and still applies the paired wan-4mbps cap, dropping the 1080p/8Mbps rung — proving Stage F's ladder-construction half composes correctly alongside two earlier stages' reasons on the same plan. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`).

