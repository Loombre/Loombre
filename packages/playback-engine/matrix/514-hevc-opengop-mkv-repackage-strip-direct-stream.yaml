name: direct-stream — mkv hevc openGop:true vs hevc-sdr (container-only obstacle) — open-gop-leading-pictures-stripped fires alongside the container reason
why: >
  2026-08-10 decision (ffmpeg-verified — see args/builder.ts's seek-restart
  bsf comment for the evidence): a video COPY into a repackaged container
  for an hevc stream with openGop:true now carries the informational reason
  open-gop-leading-pictures-stripped, mirroring case 165's dv-stripped-to-
  hdr10 precedent exactly (same "only when container repackaging is
  required" gating, threaded via containerDirectPlayable). devices.hevc-sdr
  declares directPlayContainers:[mp4] only and hdr all-false; mkv is not a
  member, so Stage A alone escalates to direct-stream with
  container-not-direct-playable, and — since the stream is otherwise fully
  within device caps (Stage B's own rules 1-3 find nothing) — Stage B adds
  open-gop-leading-pictures-stripped right after it. No re-encode: video
  stays a copy, decision stays direct-stream (never transcode). Case 515 is
  the direct-play counterpart (same stream, mp4 container) proving the
  reason does NOT fire when nothing is repackaged.

