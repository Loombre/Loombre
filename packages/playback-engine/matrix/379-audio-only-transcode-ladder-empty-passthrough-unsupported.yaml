name: transcode (audio-only) — truehd passthrough unsupported, video stays copy, ladder is []
why: >
  Third Stage D rule variety (companion to 361/362): truehd 6ch is within
  web-chrome's truehd maxChannels (8) but the device entry declares
  passthrough:false, so audio-passthrough-unsupported fires alone (no
  atmos-lost — hasAtmos is false here). video.action stays 'copy' -> ladder
  must be [] regardless of the paired network's own restrictiveness (kept
  under cap here for a clean single-stage-D case, mirroring 361/362).

input:
  media:
    fileId: file-0379
    container: mp4
    durationMs: 6000000
    sizeBytes: 2250000000
    overallBitrateBps: 3000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 2500000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: truehd
        channels: 6
        sampleRate: 48000
        bitrateBps: 1500000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - audio-passthrough-unsupported
  container: fmp4-hls
  ladder: []
