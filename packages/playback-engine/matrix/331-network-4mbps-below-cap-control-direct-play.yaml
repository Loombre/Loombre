name: direct-play — vp9/webm 1080p under the 4Mbps remote network cap
why: >
  Control case for 330: identical device/network/policy/caps, but
  overallBitrateBps (3Mbps) stays under network.maxBitrateBps (4Mbps), so
  Stage F does not fire — decision is direct-play with zero reasons.

input:
  media:
    fileId: file-0331
    container: webm
    durationMs: 6000000
    sizeBytes: 2250000000
    overallBitrateBps: 3000000
    video:
      - index: 0
        codec: vp9
        profile: null
        level: null
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 2800000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: direct-play
  reasons: []
  container: source
