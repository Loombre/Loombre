name: "transcode — full-hw route at T0 with a 1080p+ source: NO tier cap (hw routes are never tier-capped)"
why: >
  docs/PLAYBACK.md §8.3's tier cap gates ONLY the rule-(iii) full-software route ("T0 full-software transcode of >=1080p sources"). Stage F fires bitrate-exceeds-network (25Mbps overall over a 20Mbps network cap); full-hw's nvenc covers h264 decode + the surviving ladder's h264 targets, so Stage G picks rule (i) hw-encoder-selected:nvenc — even though policy is t0-default (tier 0) and the source is 1080p (>=1080), the tier cap NEVER applies to a hardware route. ladderMaxVideoBitrateBps stays bounded by the NETWORK cap (20,000,000), proving no 480p-only narrowing happened.

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 25000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 18000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-20mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - hw-encoder-selected:nvenc
  ladderMaxVideoBitrateBps: 20000000
