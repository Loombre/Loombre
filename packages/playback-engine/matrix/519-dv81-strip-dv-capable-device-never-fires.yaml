name: direct-stream — mkv DV profile 8.1 WITH compat BL on a DV-CAPABLE device — repackage happens but NO strip reason (the negative pin for LD-3)
why: >
  2026-08-11 (LD-3): the counterpart that stops the now-REAL strip from
  over-firing. Everything here matches case 165's shape — mkv is not in the
  device's directPlayContainers, so Stage A forces a repackage and the
  container reason fires — EXCEPT that the device plays Dolby Vision
  natively (devices.web-safari declares hdr.dolbyVision true). The DV layer
  is exactly what such a device wants, so `dvStripApplies()` is false, Stage
  C takes its silent-copy branch, and the arg builder emits NO `-bsf:v` and
  NO `-tag:v` at all (golden 38 pins that the args are byte-identical to a
  plain copy). Without this case, a future widening of the strip condition
  could start destroying DV for the devices that can actually play it and
  every other DV case would stay green. reasons: [container-not-direct-playable]
  ONLY — no dv-stripped-to-hdr10.
