  media:
    fileId: file-519
    container: mkv
    durationMs: 6000000
    sizeBytes: 5000000000
    overallBitrateBps: 15384000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 3840
        height: 2160
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 15000000
        hdr: dv
