  §3 Stage E''s hls-vtt branch never consults device.hls.container, so a ts-segment HLS device with hlsVtt:true
  must yield the identical strategy — pinned with expect.container ts-hls + subtitleStrategy hls-vtt together.
  Inline device: ts HLS, hlsVtt true, renderText [], generous h264/aac.'
