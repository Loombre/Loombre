name: direct-play — plain dts 6ch copies despite the device entry's passthrough:false (dts is NOT dts-hd)
why: "passthrough-capable's dts entry declares passthrough:false (maxChannels:6), and the stream is exactly at that cap. Stage D rule 3's codec gate is truehd/dtshd ONLY — plain dts is never subject to it (binding interpretation constraint 2: 'Plain dts is NOT DTS-HD — rules 1/2 only') — so this copies with zero reasons even though the device's passthrough flag is false."
input:
  media:
    fileId: file-0218
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 7500000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: dts
        channels: 6
        sampleRate: 48000
        bitrateBps: 1500000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.passthrough-capable }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: direct-play
  reasons: []
