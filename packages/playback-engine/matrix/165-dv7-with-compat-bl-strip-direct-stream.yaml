name: direct-stream — mkv DV profile 7 WITH compat BL, hevc-hdr10-only (mkv repackage -> strip informational reason fires)
why: >
  Binding interpretation constraint 3: dv-stripped-to-hdr10 fires ONLY when Stage A required container repackaging — here mkv is NOT in hevc-hdr10-only's directPlayContainers (mp4 only), so the strip genuinely happens in the arg builder during repackage. reasons: [container-not-direct-playable, dv-stripped-to-hdr10], decision direct-stream (no stream is re-encoded).
  LD-3 UPDATE (2026-08-11): dv-stripped-to-hdr10 is now TRUE. args/builder.ts's
  interpretation L emits `-bsf:v filter_units=remove_types=62-63` (HEVC UNSPEC62
  RPU + UNSPEC63 enhancement layer) plus `-tag:v hvc1` on this copy branch —
  before that the reason described a strip the builder never performed. Decision
  and reason codes here are UNCHANGED; only the reason's `detail` gained
  `elDropped=<bool>` (LD-15). Verified red-first against real ffmpeg with real DV
  samples: apps/worker/test/transcode/dv-strip-args.integration.spec.ts.

