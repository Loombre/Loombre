name: transcode — eac3 8ch exceeds web-safari's 6ch cap despite passthrough:true — passthrough:true does not rescue an over-cap stream
why: "Same device/stream shape as case 229 minus Atmos — isolates the proof that a passthrough:true entry never overrides rule 2's channel check for eac3 (or rescues it from downmixing), and that audio-passthrough-unsupported never appears for this codec regardless of the flag."
input:
  media:
    fileId: file-0231
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 6000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: eac3
        channels: 8
        sampleRate: 48000
        bitrateBps: 448000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-safari }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - audio-channels-exceed-device
