name: transcode — vp9/webm 1080p over a 4Mbps remote network, exceeds cap
why: >
  Stage F network-dimension coverage, 4Mbps tier, vp9/webm variety (distinct codec+container from seed 006's h264/mp4). overallBitrateBps (10Mbps) exceeds network.maxBitrateBps (4Mbps), non-local -> fires alone. Ladder: source height 1080p drops the 2160p rung; source bitrate (10Mbps) keeps every remaining rung; the 4Mbps network cap then drops the 1080p/8Mbps rung — surviving max is 4,000,000 (the 1080p/4Mbps rung itself). why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`).

