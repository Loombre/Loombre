name: transcode — full-hw's nvenc does NOT decode mpeg4, so Stage G falls back to software decode (rule ii)
why: >
  full-hw's nvenc decode list is [h264,hevc,av1,vp9,mpeg2] — mpeg4 is absent, so rule (i) never matches. nvenc's ENCODE list still covers the surviving ladder's h264 targets, and software's decode list covers mpeg4, so rule (ii) fires software-fallback:decode with encoder=nvenc (decode falls to software).

input:
  media:
    fileId: gen-file
    container: avi
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 5000000
    video:
      - index: 0
        codec: mpeg4
        profile: null
        level: null
        width: 1280
        height: 720
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.mpeg4-generic }
  network: { fixture: networks.wan-4mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.full-hw }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:decode
