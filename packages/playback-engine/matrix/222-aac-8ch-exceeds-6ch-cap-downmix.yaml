name: transcode — aac 8ch exceeds web-chrome's 6ch cap — downmix
why: "Non-passthrough-codec channel-downmix coverage: web-chrome's aac entry caps at 6 channels; an 8ch aac stream fires audio-channels-exceed-device alone (aac is never subject to rule 3)."
input:
  media:
    fileId: file-0222
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 5000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 8
        sampleRate: 48000
        bitrateBps: 512000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.local }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream
expect:
  decision: transcode
  reasons:
    - audio-channels-exceed-device
