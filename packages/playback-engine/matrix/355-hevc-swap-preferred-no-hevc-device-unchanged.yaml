name: transcode — hevcEncodePreferred true but the device has NO hevc entry -> h264 unchanged
why: >
  The OTHER swap-eligibility half (companion to 354): here the POLICY wants hevc encoding (hevc-preferred fixture), but the device (web-chrome) never declares an hevc entry in device.video at all — the swap must NOT apply regardless of the policy flag. Same network cap (7Mbps) and source (2160p/20Mbps) as 353/354; result is identical to 354's unswapped h264 ladder, proving BOTH conditions (policy flag AND device hevc entry) are required, not either alone. why (Phase 3 §11 step 3, Stage G arrival, STATE.md P3.2 regression law): this case's caps fixture has no hardware backend covering this route, so Stage G now routes full software (`software-fallback:encode`); tier 0 + a >=1080p selected source additionally trips the tier cap, narrowing the surviving ladder to <=480p rungs (`software-fallback:tier-capped`). expect.ladder is tightened accordingly to the now-tier-capped surviving rungs.

input:
  media:
    fileId: file-0355
    container: mp4
    durationMs: 6000000
    sizeBytes: 15000000000
    overallBitrateBps: 20000000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 52
        width: 3840
        height: 2160
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 20000000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { maxBitrateBps: 7000000, isLocal: false }
  policy: { fixture: policies.hevc-preferred }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - bitrate-exceeds-network
    - software-fallback:encode
    - software-fallback:tier-capped
  container: fmp4-hls
  ladder:
    - heightPx: 480
      videoBitrateBps: 1500000
      audioBitrateBps: 160000
      codec: h264
    - heightPx: 360
      videoBitrateBps: 800000
      audioBitrateBps: 160000
      codec: h264
