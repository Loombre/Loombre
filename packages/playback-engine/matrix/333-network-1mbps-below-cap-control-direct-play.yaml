name: direct-play — low-bitrate source under the 1Mbps remote network cap
why: >
  Control case for the 1Mbps tier: overallBitrateBps (900,000) stays under
  network.maxBitrateBps (1,000,000), so Stage F does not fire — decision is
  direct-play with zero reasons (proves the tightest §10 network tier
  doesn't fire indiscriminately either).

input:
  media:
    fileId: file-0333
    container: mp4
    durationMs: 6000000
    sizeBytes: 675000000
    overallBitrateBps: 900000
    video:
      - index: 0
        codec: h264
        profile: high
        level: 41
        width: 1920
        height: 1080
        bitDepth: 8
        frameRate: 23.976
        bitrateBps: 800000
        hdr: none
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 64000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.web-chrome }
  network: { fixture: networks.wan-1mbps }
  policy: { fixture: policies.t0-default }
  caps: { fixture: caps.software-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: direct-play
  reasons: []
  container: source
