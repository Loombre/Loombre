name: "transcode — qsv verifies BOTH opencl and vulkan: 'opencl' wins (table preference order)"
why: >
  hdr10 mismatch requires tone-mapping; qsv-opencl's qsv backend verifies decode+encode AND both opencl+vulkan tone-map methods -> §8.3's 'qsv -> opencl(else vulkan)' preference picks opencl FIRST. hw-encoder-selected:qsv with video.toneMap='opencl' (verified by test/stages/hardware.spec.ts).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8200000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 7000000
        hdr: hdr10
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
        openGop: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-sdr }
  network: { fixture: networks.local }
  policy: { fixture: policies.t1-cpu-tonemap }
  caps: { fixture: caps.qsv-opencl }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - hdr-tone-map-required
    - hw-encoder-selected:qsv
