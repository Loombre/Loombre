name: transcode — tone-map required + encode-only's nvenc has no verified tone-map method -> falls all the way to full software (not rule ii)
why: >
  hdr10 mismatch requires tone-mapping; encode-only's nvenc satisfies rule (ii)'s decode/encode split (encode covers targets, software decode covers hevc) but its OWN toneMap array is empty, so it falls through past rule (ii) too (constraint 3) — the route resolves as rule (iii) full software (software-fallback:encode, NOT software-fallback:decode), with cpu-zscale (t1-cpu-tonemap allows it unconditionally of tier).

input:
  media:
    fileId: gen-file
    container: mp4
    durationMs: 6000000
    sizeBytes: 6000000000
    overallBitrateBps: 8200000
    video:
      - index: 0
        codec: hevc
        profile: main10
        level: 123
        width: 1920
        height: 1080
        bitDepth: 10
        frameRate: 23.976
        bitrateBps: 7000000
        hdr: hdr10
        dvProfile: null
        dvBlCompatId: null
        interlaced: false
    audio:
      - index: 1
        codec: aac
        channels: 2
        sampleRate: 48000
        bitrateBps: 160000
        language: eng
        isDefault: true
        hasAtmos: false
    subtitle: []
  device: { fixture: devices.hevc-sdr }
  network: { fixture: networks.local }
  policy: { fixture: policies.t1-cpu-tonemap }
  caps: { fixture: caps.encode-only }
  selection:
    videoStreamIndex: 0
    audioStreamIndex: 1
    subtitleStreamIndex: null
  mode: stream

expect:
  decision: transcode
  reasons:
    - hdr-tone-map-required
    - software-fallback:encode
